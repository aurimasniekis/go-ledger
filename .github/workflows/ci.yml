# Validation for pushes and pull requests (F6). Release and publishing workflows are separate (F10).
# Every action is pinned by commit SHA; the version in the trailing comment is the release it names.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only by default. No job in this file requests a write scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool versions are pinned here and changed deliberately (see docs/decisions/0007).
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.32.0
  # Frontend toolchain (ADR-0008). Corepack is not shipped with Node 25+, so pnpm comes from a SHA-pinned action at an
  # exact version, which must equal "packageManager" in web/package.json.
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 12.21.0

jobs:
  workflow-lint:
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --only-binary :all: "zizmor==${ZIZMOR_VERSION}"
          echo "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"
      # --offline: static audits only (unpinned uses, permissions, injection). No API token is passed.
      - name: zizmor (unpinned actions and permissions)
        run: zizmor --offline --min-severity low .github/workflows
      # Negative fixtures run first, so a broken pattern cannot pass the real workflows silently.
      - name: Permission policy (read-only scopes only)
        run: make workflow-policy
      # A broken .goreleaser.yaml would otherwise show only on a tag or a dispatch, after merge (ADR-0018).
      - name: GoReleaser configuration
        run: make release-check

  go-format-lint:
    name: go format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: gofmt -s
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make lint

  go-test:
    name: go test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Offline tests with the race detector
        run: make test

  go-build:
    name: go build (pure Go, with the built frontend embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies (frozen lockfile)
        run: make web-install
      # The frontend is built first so that go:embed picks up the real assets.
      - name: Build the frontend, then bin/ledger with CGO_ENABLED=0
        run: make build-full
      - name: Smoke test the binary serves the embedded UI and the JSON API 404
        env:
          LEDGER_HTTP_LISTEN: 127.0.0.1:18080
          LEDGER_KEK_VALUE: ci-smoke-not-a-secret-0123456789abcdef
          LEDGER_REPORTING_TIMEZONE: UTC
        # The store refuses in-memory databases, so the smoke test uses a file under the runner's temp dir.
        run: |
          export LEDGER_DATABASE_PATH="$RUNNER_TEMP/ledger.db"
          bin/ledger serve > "$RUNNER_TEMP/ledger.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:18080/ > "$RUNNER_TEMP/index.html" && break; sleep 0.2; done
          grep -q '<div id="root">' "$RUNNER_TEMP/index.html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/commitments/1)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/nope)" = 404
          test "$(curl -s http://127.0.0.1:18080/api/nope | grep -c '"code":"not_found"')" = 1

  e2e:
    name: end-to-end (Playwright, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies (frozen lockfile)
        run: make web-install
      # The browser is a toolchain download; the tests themselves reach no bank, rate service or model: the
      # main journey (web/e2e/journey.spec.ts) runs the real binary against a simulated bank on loopback.
      - name: Install Chromium
        run: cd web && pnpm exec playwright install --with-deps chromium
      - name: Build the binary and run the end-to-end tests
        run: make e2e

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: govulncheck ./...
        run: govulncheck ./...

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies (frozen lockfile)
        run: make web-install
      - name: pnpm lint
        run: make web-lint
      - name: pnpm typecheck
        run: make web-typecheck
      - name: pnpm test
        run: make web-test
      - name: pnpm build
        run: make web-build

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes in the pull request
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
