# Validation for pushes and pull requests (F6). Release and publishing workflows are separate (F10).
# Every action is pinned by commit SHA; the version in the trailing comment is the release it names.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only by default. No job in this file requests a write scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool versions are pinned here and changed deliberately (see docs/decisions/0007).
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.32.0

jobs:
  workflow-lint:
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --only-binary :all: "zizmor==${ZIZMOR_VERSION}"
          echo "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"
      # --offline: static audits only (unpinned uses, permissions, injection). No API token is passed.
      - name: zizmor (unpinned actions and permissions)
        run: zizmor --offline --min-severity low .github/workflows
      - name: Permission policy (read-only scopes only)
        run: |
          set -eu
          status=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            if grep -qE ':[[:space:]]*write(-all)?([[:space:]]|$)' "$f"; then
              echo "::error file=$f::must stay read-only, but a write scope was requested"
              status=1
            fi
            if ! grep -A1 -x 'permissions:' "$f" | grep -qx '  contents: read'; then
              echo "::error file=$f::top-level permissions must be exactly contents read"
              status=1
            fi
          done
          exit $status

  go-format-lint:
    name: go format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: gofmt -s
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make lint

  go-test:
    name: go test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Offline tests with the race detector
        run: make test

  go-build:
    name: go build (pure Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build bin/ledger with CGO_ENABLED=0
        run: make build

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: govulncheck ./...
        run: govulncheck ./...

  frontend:
    # F7 placeholder: the steps below run only once web/package.json exists. Until then the job passes with a notice.
    name: frontend (skipped until F7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect frontend
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=frontend::web/package.json not found; frontend checks skipped until F7"
          fi
      - name: Set up Node.js from web/package.json
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - name: Install pnpm and dependencies (frozen lockfile)
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: pnpm lint
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm lint
      - name: pnpm typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm typecheck
      - name: pnpm test
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm test
      - name: pnpm build
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm build

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes in the pull request
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
