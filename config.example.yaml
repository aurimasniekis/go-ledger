      # Even when on, nothing is sent until consent for this provider and this
      # purpose is recorded; consent for one provider or purpose never covers
      # another. Suggestions are kept apart from bank facts and are only
      # suggestions: a failure never changes anything.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_ENABLED  Flag: --decisions.tasks.payment_matching.enabled
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      enabled: false

      # Decision provider for this task: openrouter, openai, anthropic or
      # typesafe. Required when the task is enabled. typesafe serves decide
      # tasks only (categorisation, label_suggestion, payment_matching), not
      # alerts.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_PROVIDER  Flag: --decisions.tasks.payment_matching.provider
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      provider: ""

      # Model identifier at the provider. Required when the task is enabled.
      # The model the provider reports is recorded with every suggestion.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_MODEL  Flag: --decisions.tasks.payment_matching.model
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      model: ""

      # Capability the task needs: decide (a choice among candidates:
      # categorisation, label_suggestion, payment_matching) or generate (free
      # text: alerts). Empty means the task's own; any other value than the
      # task's is refused.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_CAPABILITY  Flag: --decisions.tasks.payment_matching.capability
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      capability: ""

      # Time limit for one run of the task on one provider, retries included
      # (1s to 2m). A run that exceeds it ends without a suggestion and
      # changes nothing.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_TIMEOUT  Flag: --decisions.tasks.payment_matching.timeout
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      timeout: "30s"

      # Most requests the task may send per calendar month (UTC), every
      # attempt counted, retries and fallback providers included (1 to
      # 1000000). Once reached, the task makes no suggestions until the next
      # month. The default of 500 is a proposal awaiting the operator.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_MONTHLY_REQUESTS  Flag: --decisions.tasks.payment_matching.monthly_requests
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      monthly_requests: 500

      # Retries of a request the provider refused before generating anything
      # (rate limit, overload: 0 to 2, decision D13), honouring Retry-After. A
      # response that was generated, even a broken one, is never retried.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_RETRIES  Flag: --decisions.tasks.payment_matching.retries
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      retries: 2

      # Mark suggestions for automatic application instead of review. Allowed
      # for categorisation only (decision D13); an applied suggestion is
      # always reversible and never replaces a person's choice.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_AUTO_APPLY  Flag: --decisions.tasks.payment_matching.auto_apply
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      auto_apply: false

      # Fields this task may send to its provider (a list in YAML, comma
      # separated in the variable), from description, amount, currency,
      # booking_date, merchant_name and candidate_names. Empty means the
      # provider's default: all of them for openrouter, openai and anthropic
      # (generate tasks have no candidates); description, merchant_name and
      # candidate_names for typesafe. iban, account_number, counterparty_name
      # and balance are never sent and are refused here. A decide task needs
      # candidate_names. Applies to the main provider; fallback providers use
      # their defaults.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_FIELDS  Flag: --decisions.tasks.payment_matching.fields
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      fields: []

      # Explicit fallback providers, as provider:model entries tried in order
      # only when the one before had an outage (a list in YAML, comma
      # separated in the variable). Empty (the default) means no fallback:
      # there is never an automatic one. Each needs its own consent and key.
      # Environment: LEDGER_DECISIONS_TASKS_PAYMENT_MATCHING_FALLBACK  Flag: --decisions.tasks.payment_matching.fallback
      # Runtime setting (group decision_tasks.payment_matching): also
      # changeable through the Management API unless a configuration layer
      # sets it.
      fallback: []

alerts:

  # Channels that also receive a newly raised alert (a list in YAML, comma
  # separated in the variable). Empty (the default) keeps alerts in the app
  # only: nothing leaves this machine. The only channel is pulse, which
  # records an alert.raised event in the outbox (kind, object type and id
  # only, never the message or any amount) and needs events.pulse.enabled. A
  # dismissed alert is never sent again.
  # Environment: LEDGER_ALERTS_CHANNELS  Flag: --alerts.channels
  # Runtime setting (group alerts): also changeable through the Management API
  # unless a configuration layer sets it.
  channels: []

  # Raise a consent-expiring alert when a bank connection's consent ends
  # within this many days (1 to 365), or has ended.
  # Environment: LEDGER_ALERTS_CONSENT_HORIZON_DAYS  Flag: --alerts.consent_horizon_days
  # Runtime setting (group alerts): also changeable through the Management API
  # unless a configuration layer sets it.
  consent_horizon_days: 14

  # How often the alert detectors run (1m to 24h), besides after every bank
  # refresh that stored something. They check bank consent expiry, commitment
  # amount changes and overdue occurrences with no matching payment, and
  # resolve an alert when its condition no longer holds.
  # Environment: LEDGER_ALERTS_INTERVAL  Flag: --alerts.interval
  # Runtime setting (group alerts): also changeable through the Management API
  # unless a configuration layer sets it.
  interval: "1h"
