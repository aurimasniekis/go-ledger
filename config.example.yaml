      # Environment: LEDGER_DECISIONS_TASKS_CATEGORISATION_TIMEOUT  Flag: --decisions.tasks.categorisation.timeout
      # Runtime setting (group decision_tasks.categorisation): also changeable
      # through the Management API unless a configuration layer sets it.
      timeout: "30s"

      # Most requests the task may send per calendar month (UTC), every
      # attempt counted, retries and fallback providers included (1 to
