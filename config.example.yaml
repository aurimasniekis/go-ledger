# Ledger configuration file.
# Generated from the configuration definition; do not edit by hand.
# Regenerate with: make config-examples
#
# Pass it with --config or LEDGER_CONFIG. Every key can also be set with an
# environment variable (LEDGER_ plus the dotted key in upper case with dots
# turned into underscores) and, except secrets, a flag of the same name as the
# key. Precedence, highest first: flags, environment variables (the real
# environment, then .env), this file, the value stored through the Management
# API (runtime settings only, see each key), built-in defaults. A key that any
# of the first three sets is pinned: the API shows it with its source and
# refuses to change it. Unknown keys and wrong types are rejected. Durations
# are written like "30s". Secrets never go in this file.

http:

  # Address the HTTP server listens on, as host:port. The default accepts
  # local connections only; use :8080 to listen on every interface.
  # Environment: LEDGER_HTTP_LISTEN  Flag: --http.listen
  # Deployment setting: configuration only; the API shows it read-only.
  listen: "127.0.0.1:8080"

  # Maximum time to read a request's headers.
  # Environment: LEDGER_HTTP_READ_HEADER_TIMEOUT  Flag: --http.read_header_timeout
  # Deployment setting: configuration only; the API shows it read-only.
  read_header_timeout: "10s"

  # Maximum time to read an entire request, body included.
  # Environment: LEDGER_HTTP_READ_TIMEOUT  Flag: --http.read_timeout
  # Deployment setting: configuration only; the API shows it read-only.
  read_timeout: "30s"

  # Maximum time to write a response.
  # Environment: LEDGER_HTTP_WRITE_TIMEOUT  Flag: --http.write_timeout
  # Deployment setting: configuration only; the API shows it read-only.
  write_timeout: "60s"

  # Maximum time an idle keep-alive connection stays open.
  # Environment: LEDGER_HTTP_IDLE_TIMEOUT  Flag: --http.idle_timeout
  # Deployment setting: configuration only; the API shows it read-only.
  idle_timeout: "120s"

  # How long graceful shutdown waits for in-flight requests before closing
  # connections.
  # Environment: LEDGER_HTTP_SHUTDOWN_TIMEOUT  Flag: --http.shutdown_timeout
  # Deployment setting: configuration only; the API shows it read-only.
  shutdown_timeout: "15s"

  # Maximum size of a request body in bytes.
  # Environment: LEDGER_HTTP_MAX_BODY_BYTES  Flag: --http.max_body_bytes
  # Deployment setting: configuration only; the API shows it read-only.
  max_body_bytes: 1048576

  # Address of the management listener that serves /metrics, /healthz and
  # /readyz, as host:port. Unauthenticated by design: keep it on loopback or a
  # private network, never a public interface. Empty (set in the YAML file or
  # with --http.management_listen=; a blank environment variable counts as
  # unset) serves them on the main listener instead.
  # Environment: LEDGER_HTTP_MANAGEMENT_LISTEN  Flag: --http.management_listen
  # Deployment setting: configuration only; the API shows it read-only.
  management_listen: "127.0.0.1:9090"

  # IP addresses or CIDR ranges of reverse proxies whose forwarding headers
  # are trusted (a list in YAML, comma separated in the variable). Empty
  # trusts none. Behind a reverse proxy, list it here: otherwise every client
  # has the proxy's address, and the per-address sign-in limit becomes one
  # lockout shared by everyone, the owner included (ADR-0026). Ledger logs a
  # warning when X-Forwarded-For arrives from an untrusted loopback or private
  # address.
  # Environment: LEDGER_HTTP_TRUSTED_PROXIES  Flag: --http.trusted_proxies
  # Deployment setting: configuration only; the API shows it read-only.
  trusted_proxies: []

database:

  # Path of the SQLite database file. The directory is created if it is
  # missing.
  # Environment: LEDGER_DATABASE_PATH  Flag: --database.path
  # Deployment setting: configuration only; the API shows it read-only.
  path: "data/ledger.db"

  # How long a statement waits for a locked database before failing.
  # Environment: LEDGER_DATABASE_BUSY_TIMEOUT  Flag: --database.busy_timeout
  # Deployment setting: configuration only; the API shows it read-only.
  busy_timeout: "5s"

log:

  # Minimum log level.
  # Environment: LEDGER_LOG_LEVEL  Flag: --log.level  Allowed: debug, info, warn, error
  # Runtime setting (group logging): also changeable through the Management
  # API unless a configuration layer sets it.
  level: "info"

  # Log output format: json for machines, text for people.
  # Environment: LEDGER_LOG_FORMAT  Flag: --log.format  Allowed: text, json
  # Deployment setting: configuration only; the API shows it read-only.
  format: "json"

reporting:

  # IANA time zone used for due dates and monthly views, for example
  # Europe/Vilnius. Empty means the zone stored in the database; on first
  # start against a new database the host's IANA zone is captured once and
  # stored, and startup is refused if the host has no IANA name. A value that
  # differs from the stored zone is applied with a warning, because it
  # reclassifies dates; its audit entry is recorded once the audit log exists.
  # 'Local' is not accepted.
  # Environment: LEDGER_REPORTING_TIMEZONE  Flag: --reporting.timezone
  # Runtime setting (group reporting): also changeable through the Management
  # API unless a configuration layer sets it.
  timezone: ""

  # ISO 4217 code of the reporting currency, for example EUR: the outlook adds
  # a secondary total converted into it, next to the per-currency figures,
  # counting only amounts with an acceptable exchange rate and listing the
  # rest as excluded (decision D5). Empty means no converted total unless a
  # request asks for one.
  # Environment: LEDGER_REPORTING_CURRENCY  Flag: --reporting.currency
  # Runtime setting (group reporting): also changeable through the Management
  # API unless a configuration layer sets it.
  currency: ""

  # Secret kek.value: Key-encryption key for stored credentials (TOTP secrets
  # are encrypted with a key derived from it). Use a long random value, for
  # example 32 random bytes in base64. Changing it makes enrolled
  # authenticators unusable: users then sign in with a recovery code, or the
  # host resets their two-factor authentication. Required unless
  # LEDGER_KEK_FILE is set. Secret: environment only, never in the YAML file
  # and never a flag.

kek:

  # Path of a file that contains the key-encryption key. Alternative to
  # LEDGER_KEK_VALUE; trailing newlines are ignored.
  # Environment: LEDGER_KEK_FILE  Flag: --kek.file
  # Deployment setting: configuration only; the API shows it read-only.
  file: ""

events:

  pulse:

    # Publish events to Pulse. Off by default. While off, nothing is recorded
    # or published, and turning it on later does not replay changes made while
    # it was off.
    # Environment: LEDGER_EVENTS_PULSE_ENABLED  Flag: --events.pulse.enabled
    # Runtime setting (group pulse): also changeable through the Management
    # API unless a configuration layer sets it.
    enabled: false

    # Event source stamped on every published event (the envelope's source
    # field): 1 to 128 printable characters.
    # Environment: LEDGER_EVENTS_PULSE_SOURCE  Flag: --events.pulse.source
    # Runtime setting (group pulse): also changeable through the Management
    # API unless a configuration layer sets it.
    source: "ledger"

    # Pulse server URL; must use the tls:// scheme, for example
    # tls://pulse.example.com:4222. Required when events.pulse.enabled is
    # true. Nothing connects while publishing is off.
    # Environment: LEDGER_EVENTS_PULSE_URL  Flag: --events.pulse.url
    # Runtime setting (group pulse): also changeable through the Management
    # API unless a configuration layer sets it.
    url: ""

    # Path of the Pulse .creds file (user JWT and key seed). Required when
    # events.pulse.enabled is true. Only the path is configuration: the file
    # is read by the Pulse client, never copied, and its path and content are
    # never logged.
    # Environment: LEDGER_EVENTS_PULSE_CREDS_FILE  Flag: --events.pulse.creds_file
    # Deployment setting: configuration only; the API shows it read-only.
    creds_file: ""

    # Optional PEM file with an extra CA to trust for the Pulse server, added
    # to the system roots. Certificate verification is never disabled.
    # Environment: LEDGER_EVENTS_PULSE_CA_FILE  Flag: --events.pulse.ca_file
    # Deployment setting: configuration only; the API shows it read-only.
    ca_file: ""

    # Connection name shown on the Pulse server.
    # Environment: LEDGER_EVENTS_PULSE_NAME  Flag: --events.pulse.name
    # Runtime setting (group pulse): also changeable through the Management
    # API unless a configuration layer sets it.
    name: "ledger"

banking:

  # Where a bank sends you back after you approve access: Ledger's external
  # address followed by /connections/callback, for example
  # https://ledger.example.com/connections/callback. The same URL must be
  # registered with the banking provider. https only (plain http only on
  # loopback). Empty means connecting a bank (and reconnecting) is switched
  # off; refreshing and disconnecting existing connections still work.
  # Environment: LEDGER_BANKING_REDIRECT_URL  Flag: --banking.redirect_url
  # Runtime setting (group banking): also changeable through the Management
  # API unless a configuration layer sets it.
  redirect_url: ""

  # How long a started bank consent may wait for the bank's redirect. After it
  # a completion is refused (409 consent_not_found) and a connection that
  # never connected becomes failed (consent_expired). Between 1 minute and 24
  # hours.
  # Environment: LEDGER_BANKING_CONSENT_TTL  Flag: --banking.consent_ttl
  # Runtime setting (group banking): also changeable through the Management
  # API unless a configuration layer sets it.
  consent_ttl: "1h"

  # How old the last successful refresh of a bank account may be before its
  # data is shown as stale (and the background scheduler refreshes it).
  # Between 1 minute and 30 days.
  # Environment: LEDGER_BANKING_STALE_AFTER  Flag: --banking.stale_after
  # Runtime setting (group banking): also changeable through the Management
  # API unless a configuration layer sets it.
  stale_after: "24h"

  enable_banking:

    # Enable Banking API base URL. Sandbox and production applications use the
    # same host; the environment belongs to the application.
    # Environment: LEDGER_BANKING_ENABLE_BANKING_BASE_URL  Flag: --banking.enable_banking.base_url
    # Runtime setting (group banking): also changeable through the Management
    # API unless a configuration layer sets it.
    base_url: "https://api.enablebanking.com"

    app:

      # Configure the Enable Banking application for this mode. app mode means
      # an unrestricted production application (signed contract with Enable
      # Banking). developer mode means a restricted production application
      # that reaches only the accounts linked to it in the Enable Banking
      # Control Panel. Neither mode is the sandbox.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_APP_ENABLED  Flag: --banking.enable_banking.app.enabled
      # Deployment setting: configuration only; the API shows it read-only.
      enabled: false

      # Ledger's name for this application, recorded on every connection made
      # with it: 1 to 64 lower-case letters, digits, '-' or '_'. Empty means
      # enablebanking-app or enablebanking-developer. Changing it orphans
      # existing connections.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_APP_NAME  Flag: --banking.enable_banking.app.name
      # Deployment setting: configuration only; the API shows it read-only.
      name: ""

      # Application id from the Enable Banking Control Panel (a UUID, sent as
      # the JWT kid). Required when the application is enabled. Never logged.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_APP_APP_ID  Flag: --banking.enable_banking.app.app_id
      # Deployment setting: configuration only; the API shows it read-only.
      app_id: ""

      # Environment the application was registered in at Enable Banking.
      # sandbox is for testing with simulated banks; it is not a mode.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_APP_ENVIRONMENT  Flag: --banking.enable_banking.app.environment  Allowed: production, sandbox
      # Deployment setting: configuration only; the API shows it read-only.
      environment: "production"

      # Secret banking.enable_banking.app.private_key: PEM-encoded RSA private key
      # of the application (in .env, one double-quoted line with \n for line
      # breaks). Secret: environment only, never in the YAML file and never a
      # flag. Set this or private_key_file.

      # Path of the PEM-encoded RSA private key file of the application.
      # Alternative to the private_key variable. Only the path is
      # configuration; the key is never logged.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_APP_PRIVATE_KEY_FILE  Flag: --banking.enable_banking.app.private_key_file
      # Deployment setting: configuration only; the API shows it read-only.
      private_key_file: ""

    developer:

      # Configure the Enable Banking application for this mode. app mode means
      # an unrestricted production application (signed contract with Enable
      # Banking). developer mode means a restricted production application
      # that reaches only the accounts linked to it in the Enable Banking
      # Control Panel. Neither mode is the sandbox.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_DEVELOPER_ENABLED  Flag: --banking.enable_banking.developer.enabled
      # Deployment setting: configuration only; the API shows it read-only.
      enabled: false

      # Ledger's name for this application, recorded on every connection made
      # with it: 1 to 64 lower-case letters, digits, '-' or '_'. Empty means
      # enablebanking-app or enablebanking-developer. Changing it orphans
      # existing connections.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_DEVELOPER_NAME  Flag: --banking.enable_banking.developer.name
      # Deployment setting: configuration only; the API shows it read-only.
      name: ""

      # Application id from the Enable Banking Control Panel (a UUID, sent as
      # the JWT kid). Required when the application is enabled. Never logged.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_DEVELOPER_APP_ID  Flag: --banking.enable_banking.developer.app_id
      # Deployment setting: configuration only; the API shows it read-only.
      app_id: ""

      # Environment the application was registered in at Enable Banking.
      # sandbox is for testing with simulated banks; it is not a mode.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_DEVELOPER_ENVIRONMENT  Flag: --banking.enable_banking.developer.environment  Allowed: production, sandbox
      # Deployment setting: configuration only; the API shows it read-only.
      environment: "production"

      # Secret banking.enable_banking.developer.private_key: PEM-encoded RSA
      # private key of the application (in .env, one double-quoted line with \n
      # for line breaks). Secret: environment only, never in the YAML file and
      # never a flag. Set this or private_key_file.

      # Path of the PEM-encoded RSA private key file of the application.
      # Alternative to the private_key variable. Only the path is
      # configuration; the key is never logged.
      # Environment: LEDGER_BANKING_ENABLE_BANKING_DEVELOPER_PRIVATE_KEY_FILE  Flag: --banking.enable_banking.developer.private_key_file
      # Deployment setting: configuration only; the API shows it read-only.
      private_key_file: ""

  refresh:

    # Refresh active bank connections in the background. When false,
    # connections are only refreshed on request. Retries of one read and the
    # provider's daily fetch budget are not configurable.
    # Environment: LEDGER_BANKING_REFRESH_ENABLED  Flag: --banking.refresh.enabled
    # Runtime setting (group banking): also changeable through the Management
    # API unless a configuration layer sets it.
    enabled: true

    # Time between successful background refreshes of a connection. Banks
    # commonly allow about four background fetches a day; the scheduler also
    # keeps to the provider's daily budget whatever this is set to.
    # Environment: LEDGER_BANKING_REFRESH_INTERVAL  Flag: --banking.refresh.interval
    # Runtime setting (group banking): also changeable through the Management
    # API unless a configuration layer sets it.
    interval: "6h"

    # How long after a refresh of a bank connection finished (whoever started
    # it, whatever the outcome) another refresh on request for that connection
    # is refused with HTTP 429 and Retry-After. It applies to the API, the web
    # UI, the CLI and MCP; the background refresh is not held back. 0s
    # switches it off; at most 24h (decision D-B6c).
    # Environment: LEDGER_BANKING_REFRESH_REQUEST_COOLDOWN  Flag: --banking.refresh.request_cooldown
    # Runtime setting (group banking): also changeable through the Management
    # API unless a configuration layer sets it.
    request_cooldown: "5m"

    # Longest wait after failed refreshes. The wait starts at 15 minutes and
    # doubles per consecutive failure. A rate limit waits at least 6 hours, or
    # the provider's Retry-After (at most 24 hours).
    # Environment: LEDGER_BANKING_REFRESH_MAX_BACKOFF  Flag: --banking.refresh.max_backoff
    # Runtime setting (group banking): also changeable through the Management
    # API unless a configuration layer sets it.
    max_backoff: "6h"

rates:

  # Fetch exchange rates from Frankfurter (https://frankfurter.dev, free, no
  # key) and cache them locally. Off by default: the outlook then shows only
  # amounts already in the reporting currency and lists the rest as excluded
  # (no_provider), though rates cached while it was on are still used and
  # shown with their age. Turning it on sends currency codes (never amounts or
  # account data) to the Frankfurter service.
  # Environment: LEDGER_RATES_ENABLED  Flag: --rates.enabled
  # Runtime setting (group rates): also changeable through the Management API
  # unless a configuration layer sets it.
  enabled: false

  # Frankfurter base URL. https only (plain http only for a loopback test
  # server).
  # Environment: LEDGER_RATES_BASE_URL  Flag: --rates.base_url
  # Runtime setting (group rates): also changeable through the Management API
  # unless a configuration layer sets it.
  base_url: "https://api.frankfurter.dev"

  # Frankfurter provider key whose rates are used, for example ECB (European
  # Central Bank reference rates, published on working days; a weekend or
  # holiday uses the previous working day), or blended for Frankfurter's own
  # blend of its providers. Rates of different sources are cached apart and
  # never mixed; changing this stops using the rates of the old source.
  # Environment: LEDGER_RATES_SOURCE  Flag: --rates.source
  # Runtime setting (group rates): also changeable through the Management API
  # unless a configuration layer sets it.
  source: "ECB"

  # Time between background refreshes of the rates from every currency in use
  # to the reporting currency (decision D11: daily), and how long a cached
  # rate is used without asking Frankfurter again. 1h to the stale_after
  # value. Needs reporting.currency; without it nothing is refreshed in the
  # background.
  # Environment: LEDGER_RATES_REFRESH_INTERVAL  Flag: --rates.refresh_interval
  # Runtime setting (group rates): also changeable through the Management API
  # unless a configuration layer sets it.
  refresh_interval: "24h"

  # How old a cached rate may get before it is treated as stale and left out
  # of converted totals (decision D11: 5 days): measured from when it was last
  # retrieved, and from its date to the date it is used for. 24h or more.
  # Environment: LEDGER_RATES_STALE_AFTER  Flag: --rates.stale_after
  # Runtime setting (group rates): also changeable through the Management API
  # unless a configuration layer sets it.
  stale_after: "120h"

  # Time limit for one request to Frankfurter (1s to 2m). A request that
  # exceeds it counts as an outage: cached rates stay in use.
  # Environment: LEDGER_RATES_TIMEOUT  Flag: --rates.timeout
  # Runtime setting (group rates): also changeable through the Management API
  # unless a configuration layer sets it.
  timeout: "15s"

merchants:

  enrichment:

    remote:

      # Ask a remote merchant-identification service about transactions the
      # local curated mapping and your confirmations cannot identify. Off by
      # default and no service is approved (decision D15). Turning it on sends
      # one cleaned merchant string per transaction: the counterparty name
      # only, never the description, with every word that holds a digit
      # removed and the words iban, bic, swift and account removed (text is
      # split at white space and at , / . and ;), at most 100 characters.
      # Nothing is sent unless the name starts or ends, as a whole word in any
      # case, with one of the company forms uab, mb, sia, ltd, limited, llc,
      # gmbh, inc, plc, corp, srl, sarl, kft, oü next to at least one other
      # word. The short forms as, co, sa, ab, ag, sp, oy, nv and bv never
      # count, a bare form or a form plus punctuation sends nothing, and so do
      # names of people, transfers (transfer words such as sepa or transfer)
      # and everything else. Merchants your own confirmations or rejections
      # already cover are not asked about. If
      # merchants.enrichment.remote.country is set, that country code is sent
      # too. Never amounts, dates, IBANs, account holders or balances. Needs
      # url, and you are responsible for the service's terms: see attribution,
      # store_logo_ref and retention.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_ENABLED  Flag: --merchants.enrichment.remote.enabled
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      enabled: false

      # Lookup endpoint of the remote service (POST, JSON; see ADR-0054 for
      # the contract). https only (plain http only for a loopback test
      # server), no credentials or query. Required when enabled.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_URL  Flag: --merchants.enrichment.remote.url
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      url: ""

      # Path of a file with the bearer key for the remote service (trailing
      # newlines ignored). The key is read at startup, sent only to the
      # configured URL and never logged. Optional.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_API_KEY_FILE  Flag: --merchants.enrichment.remote.api_key_file
      # Deployment setting: configuration only; the API shows it read-only.
      api_key_file: ""

      # Optional ISO 3166-1 alpha-2 country code sent with each lookup as a
      # hint, for example LT. Empty means no country is sent.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_COUNTRY  Flag: --merchants.enrichment.remote.country
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      country: ""

      # Time limit for one lookup (1s to 1m). A failure or timeout leaves the
      # transaction without a remote answer and never delays or fails an
      # import.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_TIMEOUT  Flag: --merchants.enrichment.remote.timeout
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      timeout: "10s"

      # Attribution text the service's licence requires, for example 'Logos by
      # Example Service'. Shown with identities that came from it (GET
      # /api/v1/merchants/sources). Up to 200 characters.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_ATTRIBUTION  Flag: --merchants.enrichment.remote.attribution
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      attribution: ""

      # Keep the logo reference the service returns. Leave false unless its
      # licence allows storing or linking its logos: Ledger then shows the
      # name with a neutral icon. Logos are never downloaded or copied by
      # Ledger.
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_STORE_LOGO_REF  Flag: --merchants.enrichment.remote.store_logo_ref
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      store_logo_ref: false

      # How long answers from the remote service are kept (the longest a
      # licence usually allows is 30 days, the default; 24h to 8760h, or 0 to
      # keep them until replaced). Older answers are deleted, so the
      # transaction is looked up again; your confirmations and corrections are
      # never deleted. The limit still applies after the remote source is
      # turned off: answers it cached are deleted when they pass it (0 keeps
      # them until replaced, which never happens once it is off).
      # Environment: LEDGER_MERCHANTS_ENRICHMENT_REMOTE_RETENTION  Flag: --merchants.enrichment.remote.retention
      # Runtime setting (group merchant_enrichment): also changeable through
      # the Management API unless a configuration layer sets it.
      retention: "720h"

auth:

  password:

    # Allow signing in with a username and password. false refuses password
    # sign-in and password re-authentication for everyone (403
    # password_sign_in_disabled) and sends the sign-in page to single sign-on;
    # it needs auth.oidc.enabled. Linking an OIDC identity never turns
    # password sign-in off by itself. If the identity provider is unavailable
    # while this is false, the host can issue a one-time sign-in with ledger
    # auth recovery-sign-in (docs/oidc.md).
    # Environment: LEDGER_AUTH_PASSWORD_ENABLED  Flag: --auth.password.enabled
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    enabled: true

    # Minimum password length in bytes (1 to 1024). Length is the only rule:
    # there are no composition rules.
    # Environment: LEDGER_AUTH_PASSWORD_MIN_LENGTH  Flag: --auth.password.min_length
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    min_length: 12

  session:

    # A session not used for this long ends. Must not exceed the absolute
    # timeout.
    # Environment: LEDGER_AUTH_SESSION_IDLE_TIMEOUT  Flag: --auth.session.idle_timeout
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    idle_timeout: "30m"

    # A session ends this long after sign-in, however much it is used.
    # Environment: LEDGER_AUTH_SESSION_ABSOLUTE_TIMEOUT  Flag: --auth.session.absolute_timeout
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    absolute_timeout: "12h"

    # How long a password check counts as recent for sensitive actions
    # (credential changes, token creation, user management). After it, the
    # user confirms their password again.
    # Environment: LEDGER_AUTH_SESSION_REAUTH_WINDOW  Flag: --auth.session.reauth_window
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    reauth_window: "10m"

  sign_in:

    # Failed sign-ins (and re-authentications) allowed per username within
    # auth.sign_in.window before further attempts for it are refused with 429.
    # Environment: LEDGER_AUTH_SIGN_IN_ACCOUNT_MAX_FAILURES  Flag: --auth.sign_in.account_max_failures
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    account_max_failures: 10

    # Failed sign-ins allowed per client address (an IPv6 address counts as
    # its /64) within auth.sign_in.window before further attempts from it are
    # refused with 429.
    # Environment: LEDGER_AUTH_SIGN_IN_ADDRESS_MAX_FAILURES  Flag: --auth.sign_in.address_max_failures
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    address_max_failures: 30

    # Sliding window over which failed sign-ins are counted.
    # Environment: LEDGER_AUTH_SIGN_IN_WINDOW  Flag: --auth.sign_in.window
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    window: "15m"

    # Lifetime of the device cookie a browser gets at each complete password
    # sign-in (decision D23-1b). While it is valid, that browser's failed
    # sign-ins count against the cookie instead of the username, so a username
    # locked out by someone else's guesses does not lock out the owner's known
    # browsers; the per-address limit, the password and the second factor
    # still apply. Changing a user's password revokes all of that user's
    # device cookies. Default 2160h (90 days), accepted by the operator (D30,
    # 2026-11-21).
    # Environment: LEDGER_AUTH_SIGN_IN_DEVICE_COOKIE_TTL  Flag: --auth.sign_in.device_cookie_ttl
    # Runtime setting (group auth): also changeable through the Management API
    # unless a configuration layer sets it.
    device_cookie_ttl: "2160h"

  oidc:

    # Allow signing in with one OpenID Connect identity provider
    # (authorization code flow with PKCE). Users link their identity while
    # signed in; an identity that is not linked gets no access unless
    # auth.oidc.provisioning.enabled is true.
    # Environment: LEDGER_AUTH_OIDC_ENABLED  Flag: --auth.oidc.enabled
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    enabled: false

    # Name of the identity provider shown on the sign-in page and recorded in
    # audit entries: 1 to 64 printable characters.
    # Environment: LEDGER_AUTH_OIDC_NAME  Flag: --auth.oidc.name
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    name: "Single sign-on"

    # Issuer URL of the provider, exactly as its discovery document states it
    # (a trailing slash matters), for example
    # https://id.example.com/realms/home. https only (plain http only for a
    # loopback test provider). Links are keyed by issuer and subject: changing
    # the issuer leaves every existing link unusable.
    # Environment: LEDGER_AUTH_OIDC_ISSUER  Flag: --auth.oidc.issuer
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    issuer: ""

    # Client ID registered for Ledger at the provider. Required when
    # auth.oidc.enabled is true.
    # Environment: LEDGER_AUTH_OIDC_CLIENT_ID  Flag: --auth.oidc.client_id
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    client_id: ""

    # Secret auth.oidc.client_secret: Client secret registered for Ledger at the
    # provider. Secret: environment only, never in the YAML file and never a
    # flag. Set this or client_secret_file.

    # Path of a file that contains the client secret. Alternative to the
    # client_secret variable; trailing newlines are ignored. Only the path is
    # configuration; the secret is never logged.
    # Environment: LEDGER_AUTH_OIDC_CLIENT_SECRET_FILE  Flag: --auth.oidc.client_secret_file
    # Deployment setting: configuration only; the API shows it read-only.
    client_secret_file: ""

    # Callback URL registered at the provider: Ledger's external address
    # followed by /api/v1/auth/oidc/callback, for example
    # https://ledger.example.com/api/v1/auth/oidc/callback. https only (plain
    # http only on loopback).
    # Environment: LEDGER_AUTH_OIDC_REDIRECT_URL  Flag: --auth.oidc.redirect_url
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    redirect_url: ""

    # Scopes requested (a list in YAML, comma separated in the variable). Must
    # include openid. email and profile only fill in display data and a
    # provisioned account's username; identity is never taken from them.
    # Environment: LEDGER_AUTH_OIDC_SCOPES  Flag: --auth.oidc.scopes
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    scopes: ["openid", "email", "profile"]

    # Ask users who have Ledger TOTP enabled for their code after an OIDC
    # sign-in too, and apply auth.require_2fa to OIDC sessions. false (the
    # default, decision D16) trusts the identity provider's own
    # authentication.
    # Environment: LEDGER_AUTH_OIDC_REQUIRE_2FA  Flag: --auth.oidc.require_2fa
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    require_2fa: false

    # Clock difference tolerated when checking ID token times (exp, nbf, iat,
    # auth_time): 0 to 5m.
    # Environment: LEDGER_AUTH_OIDC_CLOCK_SKEW  Flag: --auth.oidc.clock_skew
    # Runtime setting (group oidc): also changeable through the Management API
    # unless a configuration layer sets it.
    clock_skew: "1m"

    provisioning:

      # Create an account, with no password, the first time an identity that
      # is linked to no account signs in, and link it. Off by default: unknown
      # identities are refused. Accounts are never matched by email address.
      # Environment: LEDGER_AUTH_OIDC_PROVISIONING_ENABLED  Flag: --auth.oidc.provisioning.enabled
      # Runtime setting (group oidc): also changeable through the Management
      # API unless a configuration layer sets it.
      enabled: false

      # Role of accounts created by provisioning.
      # Environment: LEDGER_AUTH_OIDC_PROVISIONING_ROLE  Flag: --auth.oidc.provisioning.role  Allowed: administrator, read-only
      # Runtime setting (group oidc): also changeable through the Management
      # API unless a configuration layer sets it.
      role: "read-only"

  # Require two-factor authentication (TOTP) for everyone. A signed-in user
  # without it can only enrol an authenticator, see their session,
  # re-authenticate and sign out; every other request is refused with 403
  # two_factor_enrollment_required. API tokens are not affected. While it is
  # on, users cannot disable their own TOTP (the host command ledger auth
  # reset-2fa can).
  # Environment: LEDGER_AUTH_REQUIRE_2FA  Flag: --auth.require_2fa
  # Runtime setting (group auth): also changeable through the Management API
  # unless a configuration layer sets it.
  require_2fa: false

mcp:

  # Serve the MCP endpoint (streamable HTTP, POST /api/v1/mcp). Every call
  # needs an API token and is limited to what the token's grants allow,
  # exactly as through the HTTP API. false removes the endpoint (404). The
  # stdio mode (ledger mcp stdio) is a separate client-side command and is not
  # affected.
  # Environment: LEDGER_MCP_ENABLED  Flag: --mcp.enabled
  # Runtime setting (group mcp): also changeable through the Management API
  # unless a configuration layer sets it.
  enabled: true

  # Sustained MCP requests allowed per API token per minute (1 to 100000);
  # more are refused with 429 rate_limited and Retry-After. Counted in memory
  # per process, reset on restart.
  # Environment: LEDGER_MCP_REQUESTS_PER_MINUTE  Flag: --mcp.requests_per_minute
  # Runtime setting (group mcp): also changeable through the Management API
  # unless a configuration layer sets it.
  requests_per_minute: 120

  # Most MCP requests one API token may send at once before the per-minute
  # rate applies (1 to 10000).
  # Environment: LEDGER_MCP_BURST  Flag: --mcp.burst
  # Runtime setting (group mcp): also changeable through the Management API
  # unless a configuration layer sets it.
  burst: 30

  # Maximum size of one MCP request body in bytes (1024 to 16777216); larger
  # bodies are refused with 413. The general http.max_body_bytes applies as
  # well.
  # Environment: LEDGER_MCP_MAX_REQUEST_BYTES  Flag: --mcp.max_request_bytes
  # Runtime setting (group mcp): also changeable through the Management API
  # unless a configuration layer sets it.
  max_request_bytes: 262144

      # Secret decisions.providers.openrouter.api_key: OpenRouter API key. Secret:
