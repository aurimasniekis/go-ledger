      # Runtime setting (group decision_tasks.categorisation): also changeable
      # through the Management API unless a configuration layer sets it.
      model: ""

      # Capability the task needs: decide (a choice among candidates:
      # categorisation, label_suggestion, payment_matching) or generate (free
      # text: alerts). Empty means the task's own; any other value than the
      # task's is refused.
      # Environment: LEDGER_DECISIONS_TASKS_CATEGORISATION_CAPABILITY  Flag: --decisions.tasks.categorisation.capability
      # Runtime setting (group decision_tasks.categorisation): also changeable
