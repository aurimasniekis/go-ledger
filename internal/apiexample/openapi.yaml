# OpenAPI description of the example resource (package apiexample). These
# paths are NOT part of the published API: the example's contract test merges
# them into the published document to check that the example follows the same
# conventions. Use them as the template for a real resource.
paths:
  /examples:
    get:
      operationId: listExamples
      summary: List examples
      tags: [example]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          description: Only examples of these kinds (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ExampleKind"
        - name: name[prefix]
          in: query
          description: Only examples whose name starts with this text (case-sensitive).
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: One page of examples in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Example"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createExample
      summary: Create an example
      tags: [example]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  $ref: "#/components/schemas/ExampleKind"
                note:
                  description: Optional; null is the same as leaving it out.
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 200
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        default:
          $ref: "#/components/responses/Error"
  /examples/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getExample
      summary: Get an example
      tags: [example]
      responses:
        "200":
          description: The example.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateExample
      summary: Change an example
      description: |
        A JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017): an absent member is
        left unchanged, null clears an optional member (note) and is refused on
        a required one. Requires the version in If-Match or the body; a stale
        version is a 409 version_conflict with reconciliation. An empty patch
        ({}), or one that only names version, is a no-op: the version is
        checked, nothing changes and the version is not bumped. Any other
        Content-Type is a 415.
      tags: [example]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  $ref: "#/components/schemas/ExampleKind"
                note:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 200
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The changed example.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteExample
      summary: Delete an example
      description: The version is taken from If-Match only (there is no body); without it the request is a 428.
      tags: [example]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
components:
  schemas:
    ExampleKind:
      type: string
      enum: [alpha, beta]
    Example:
      type: object
      required: [id, name, kind, note, version, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ExampleKind"
        note:
          type: [string, "null"]
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
