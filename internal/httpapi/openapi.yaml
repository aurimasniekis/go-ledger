      responses:
        "200":
          description: The assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectAssignments"
        "409":
          description: review_inherited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
