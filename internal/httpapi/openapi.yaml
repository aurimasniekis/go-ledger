    SettingsOidc:
      description: |
        Runtime settings group `oidc` (grant settings): the effective value of every member as a top-level member, then the read-only members below. Members that are not settings are read-only.
      allOf:
        - $ref: "#/components/schemas/SettingsGroupMeta"
        - type: object
          properties:
            "enabled":
              type: boolean
              description: "Configuration key `auth.oidc.enabled`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "name":
              type: string
              description: "Configuration key `auth.oidc.name`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "issuer":
              type: string
              description: "Configuration key `auth.oidc.issuer`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "client_id":
              type: string
              description: "Configuration key `auth.oidc.client_id`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            client_secret:
              type: string
              description: "Configuration key `auth.oidc.client_secret`. Sensitive: refused through the API until the sign-in gate lands (task S2). Write-only secret: never returned."
              writeOnly: true
            client_secret_set:
              type: boolean
              readOnly: true
              description: Whether a value exists, from any source.
            client_secret_set_at:
              type: [string, "null"]
              format: date-time
              readOnly: true
              description: When a stored value was written; null until sealed secrets exist (task S2).
            client_secret_source:
              type: string
              enum: [api, environment, dotenv, file]
              readOnly: true
              description: Where the value comes from; absent when none is set.
            "redirect_url":
              type: string
              description: "Configuration key `auth.oidc.redirect_url`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "scopes":
              type: array
              items:
                type: string
              description: "Configuration key `auth.oidc.scopes`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "require_2fa":
              type: boolean
              description: "Configuration key `auth.oidc.require_2fa`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "clock_skew":
              type: string
              description: "Configuration key `auth.oidc.clock_skew`. Sensitive: refused through the API until the sign-in gate lands (task S2). A duration with a unit, such as 30s or 6h."
            "provisioning.enabled":
              type: boolean
              description: "Configuration key `auth.oidc.provisioning.enabled`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "provisioning.role":
              type: string
              enum: ["administrator", "read-only"]
              description: "Configuration key `auth.oidc.provisioning.role`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
    SettingsPulse:
      description: |
        Runtime settings group `pulse` (grant integrations): the effective value of every member as a top-level member, then the read-only members below. Members that are not settings are read-only.
      allOf:
        - $ref: "#/components/schemas/SettingsGroupMeta"
        - type: object
          properties:
            "enabled":
              type: boolean
              description: "Configuration key `events.pulse.enabled`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "url":
