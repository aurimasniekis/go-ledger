# Ledger Management API, version 1. This file is the contract (ADR-0011): it is
# written by hand, served at /api/v1/openapi.yaml and /api/v1/openapi.json, and
# TestOpenAPIContract fails when a registered /api/v1 route is missing here or a
# path here has no registered route. Change it in the same commit as the routes.
openapi: 3.1.1
info:
  title: Ledger Management API
  version: 1.0.0
  summary: Manage a personal Ledger instance.
  description: |
    Ledger shows paid, upcoming and overdue commitments and an outlook that
    compares commitments still due with bank balances. It is never a
    guarantee of money that is safe to spend.

    Conventions (ADR-0011):

    - **Base path** `/api/v1`. Backwards-incompatible changes get a new major
      version and base path; `info.version` follows semantic versioning.
    - **Identifiers** are ULIDs: 26 upper-case Crockford base32 characters,
      stable for the life of the object and never reused.
    - **Lists** return `{"items": [...], "next_cursor": "..."|null}`. Pass
      `limit` (1-200, default 50) and `cursor` (the previous
      `next_cursor`, valid only with the same filters). A walk is exact for
      items that existed when it began; items created during a walk may or
      may not appear (no snapshot; ID order holds to the millisecond). Filters are
      `field=value` (repeat for any of several values) and
      `field[op]=value` with `op` one of `prefix`, `gt`, `gte`, `lt`,
      `lte` where an endpoint documents it. Unknown parameters are rejected.
    - **Optimistic concurrency.** Mutable objects carry `version` (from 1)
      and the strong ETag `"<version>"`. Changing or deleting one requires
      that version in `If-Match` or, for a partial update, the body's
      `version` (DELETE: `If-Match` only): missing is 428, stale is 409
      `version_conflict` with `reconciliation` (the current version and,
      where allowed, the current object). `conflict` is any other 409.
    - **Partial updates** are JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017):
      `PATCH` with `Content-Type: application/merge-patch+json`; an absent
      member is unchanged, `null` clears an optional member, and nested
      objects merge member by member.
    - **Errors** use the `Error` envelope with a stable `code`.
    - **Access** (ADR-0021). Each operation states in `x-ledger-access`
      who may call it: `public` (no credentials), `authenticated` (any
      signed-in user or API token) or a grant `resource:action` such as
      `users:write`. A write grant also allows reading the same resource.
      No credentials, or wrong ones, is 401 `unauthenticated`; a missing
      grant is 403 `forbidden`. The `administrator` role holds every
      grant; `read-only` holds read on every resource that is not
      administrative and never a write. API tokens carry their own grants,
      limited by their owner's current role. `GET /grants` lists the
      vocabulary. `session` means a user signed in with the session
      cookie, acting on their own session, password or API tokens whatever their role;
      API tokens get 403 there.
    - **Sessions and CSRF** (ADR-0026). `POST /auth/sign-in` sets the
      `__Host-ledger_session` cookie (Secure, HttpOnly, SameSite=Strict) and returns
      a `csrf_token` (also from `GET /auth/session`). Every state-changing
      request made with the cookie must send it in `X-CSRF-Token` and come
      from Ledger's own origin, or it is 403 `csrf_failed`. Requests with
      an API token (`Authorization: Bearer`) need no CSRF token. Sessions
      end after an idle and an absolute timeout, on sign-out, when ended from
      another session, and (other sessions) when the password changes; the
      next request with an ended session is 401.
    - **Known browsers** (ADR-0026 amendment, decision D23-1b). A complete
      password sign-in also sets the `__Host-ledger_device` cookie (same
      attributes, expiring after `auth.sign_in.device_cookie_ttl`). While
      it is valid for the submitted account, that browser's failed sign-ins
      and re-authentications count against the cookie instead of the
      username, so a username locked out by someone else does not lock out
      the owner's known browsers. The per-address limit, the password and
      the second factor always apply. The cookie is replaced at each
      sign-in, outlives sign-out, and every device cookie of a user is
      revoked when the user's password is set.
    - **Recent authentication.** Operations marked
      `x-ledger-recent-auth: true` (credential changes, user management;
      API token creation) need a password check within the
      re-authentication window when called with a session: otherwise 403
      `reauthentication_required`; confirm with
      `POST /auth/reauthenticate`. API tokens are exempt by design (their
      writes are audited as `token.write_used`). Exception (decision D32):
      with a token, creating or promoting an administrator, re-enabling a
      disabled administrator and setting any password need the root token of
      the root account; other tokens get 403 `root_token_required`.
    - **API tokens** (ADR-0029). Send `Authorization: Bearer ldgr_…`
      (`ldgr_` and 43 base62 characters). A request with an Authorization
      header is judged by it alone: a wrong, expired or revoked token is 401
      even with a valid session cookie. Tokens are created with a session
      (`POST /auth/tokens`) or on the host (`ledger token create`), shown
      once, and limited by their owner's current role on every request;
      revocation applies to the next request. Token requests skip
      two-factor and re-authentication, and each state-changing one is
      audited (`token.write_used`, `interactive_steps: skipped`).
    - **Two-factor authentication** (ADR-0030). A user may enrol a TOTP
      authenticator (RFC 6238: SHA-1, 6 digits, 30 s) under
      `/auth/two-factor`; enabling it returns recovery codes once. Sign-in
      then takes two steps: `POST /auth/sign-in` answers 202 with a
      challenge, and `POST /auth/sign-in/second-factor` takes a TOTP code
      or a recovery code and starts the session. When `auth.require_2fa`
      is on, a session whose user has no authenticator reaches only the
      operations marked `x-ledger-during-enrollment: true` (enrolment,
      the current session, re-authentication, sign-out); every other
      request is 403 `two_factor_enrollment_required`. API tokens skip
      interactive steps by design and are not affected.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
# Every operation needs a bearer API token or a session cookie, unless it
# says `security: []` (x-ledger-access: public) or only the session cookie
# (x-ledger-access: session; API tokens are refused there).
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      x-ledger-access: public
      security: []
      summary: This document as JSON
      tags: [meta]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      x-ledger-access: public
      security: []
      summary: This document as YAML
      tags: [meta]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      x-ledger-access: authenticated
      summary: Who the request acts as
      description: The principal of the request and its effective grants, as evaluated for this request.
      tags: [access]
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        default:
          $ref: "#/components/responses/Error"
  /grants:
    get:
      operationId: getGrantVocabulary
      x-ledger-access: authenticated
      summary: The grant vocabulary and roles
      description: Every resource with its actions, and every role with the grants it holds. API tokens and MCP tools use the same grants.
      tags: [access]
      responses:
        "200":
          description: The vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantVocabulary"
        default:
          $ref: "#/components/responses/Error"
  /audit:
    get:
      operationId: listAuditEntries
      x-ledger-access: audit:read
      summary: List audit entries
      description: |
        The append-only audit log, oldest first (ID order). Administrators only.
        Entries record who did what to which object: sign-in successes and
        failures, two-factor changes, OIDC links, role changes, API token
        creation, revocation and write use, state-changing MCP calls (with the
        token's identity) and finance corrections. An entry has no free-form
        payload: `details` holds only the few non-secret fields its action
        declares. The attempted username of a failed sign-in is never recorded.
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: action
          in: query
          description: Only entries with these actions (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              maxLength: 64
        - name: action[prefix]
          in: query
          description: Only entries whose action starts with this text, for example `token.`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: actor_kind
          in: query
          description: Only entries by these kinds of actor (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AuditActorKind"
        - name: actor_user_id
          in: query
          description: Only entries by this user, or by a token this user owns.
          schema:
            $ref: "#/components/schemas/ID"
        - name: actor_token_id
          in: query
          description: Only entries made with this API token.
          schema:
            $ref: "#/components/schemas/ID"
        - name: target_type
          in: query
          schema:
            type: string
            maxLength: 32
        - name: target_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: at[gte]
          in: query
          description: Only entries at or after this time.
          schema:
            type: string
            format: date-time
        - name: at[lt]
          in: query
          description: Only entries before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One page of audit entries in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      x-ledger-access: users:read
      summary: List users
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          description: Only users with these roles (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Role"
        - name: disabled
          in: query
          description: Only disabled (true) or enabled (false) users.
          schema:
            type: string
            enum: ["true", "false"]
        - name: username[prefix]
          in: query
          description: Only users whose username starts with this text.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: One page of users in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      x-ledger-access: users:write
      x-ledger-recent-auth: true
      summary: Create a user
      description: |
        Creates an enabled user with a role. Audited (user.created). A taken
        username is a 409 conflict. Credentials (password, 2FA, OIDC link) are
        set up separately. Creating an administrator with an API token needs
        the root token of the root account (decision D32); any other token is
        refused with 403 `root_token_required`. Sessions are unchanged.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, role]
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                display_name:
                  description: Optional; null is the same as leaving it out.
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 100
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: "With an API token: code `root_token_required` when creating an administrator unless the caller is a root token of the root account (decision D32); also the usual authorization refusals."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getUser
      x-ledger-access: users:read
      summary: Get a user
      tags: [users]
      responses:
        "200":
          description: The user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      x-ledger-access: users:write
      x-ledger-recent-auth: true
      summary: Change, disable or re-enable a user, or change their role
      description: |
        A JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017). display_name is
        optional (null clears it); username, role and disabled are required
        and cannot be null. Requires the version in If-Match or the body; a
        stale version is a 409 version_conflict with reconciliation. An empty
        patch is a no-op. Role changes (user.role_changed with from and to),
        disabling (user.disabled), re-enabling (user.enabled) and profile
        changes (user.updated) are audited. A change that would leave no
        enabled administrator is a 409 conflict. Users are never deleted:
        disable them instead, which keeps audit history and token ownership
        intact. A disabled user's sessions and tokens stop working on their
        next request. With an API token, making a user an administrator or
        re-enabling a disabled administrator needs a root token of the root
        account (decision D32); so does demoting, disabling or renaming
        the root (first) account (decisions D34, D35). Any other token is refused with 403
        `root_token_required` before anything changes, and that check is
        pinned to the version (a stale version is a 409). Demoting,
        disabling or renaming other users, no-op changes and profile edits stay open to a
        `users:write` token. Sessions are unchanged.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                display_name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 100
                role:
                  $ref: "#/components/schemas/Role"
                disabled:
                  type: boolean
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The changed user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: "With an API token: code `root_token_required` when promoting to administrator or re-enabling an administrator (decision D32), or when demoting, disabling or renaming the root account (decisions D34, D35), unless the caller is a root token of the root account; also the usual authorization refusals."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /commitments:
    get:
      operationId: listCommitments
      x-ledger-access: commitments:read
      summary: List commitment definitions
      tags: [commitments]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/LabelFilter"
        - name: kind
          in: query
          description: Only commitments of these kinds (repeat for any of several).
          schema:
            $ref: "#/components/schemas/CommitmentKind"
        - name: priority
          in: query
          description: Only commitments with these priorities (repeat for any of several).
          schema:
            $ref: "#/components/schemas/CommitmentPriority"
        - name: currency
          in: query
          description: Only commitments in these currencies (repeat for any of several).
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: One page of commitments in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commitment"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCommitment
      x-ledger-access: commitments:write
      summary: Record a recurring commitment
      description: |
        Records a recurring commitment definition (ADR-0024). The definition
        is user data, kept apart from bank facts and from dated occurrences
        and payment state, which are derived from it. Every invalid field is
        reported: the first in field and message, all of them in errors.
        Audited (commitment.created with kind and currency).
      tags: [commitments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, amount, schedule, start_date]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  $ref: "#/components/schemas/CommitmentKind"
                amount:
                  $ref: "#/components/schemas/PositiveMoney"
                schedule:
                  $ref: "#/components/schemas/Schedule"
                start_date:
                  $ref: "#/components/schemas/Date"
                end_date:
                  description: The last day the commitment applies (inclusive); null for open-ended. Not before start_date.
                  oneOf:
                    - $ref: "#/components/schemas/Date"
                    - type: "null"
                priority:
                  description: Optional; null when not prioritised.
                  oneOf:
                    - $ref: "#/components/schemas/CommitmentPriority"
                    - type: "null"
                notes:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 2000
                match_tolerance:
                  description: |
                    Optional; null for none. How far a booked bank payment may fall
                    short of amount and still be confirmed automatically by the matching
                    engine (decision D9, ADR-0039); without one only the exact amount
                    confirms automatically. Zero or more, in the commitment's currency.
                    A payment above amount is never confirmed automatically (it would
                    overpay).
                  oneOf:
                    - $ref: "#/components/schemas/Money"
                    - type: "null"
                leeway:
                  description: |
                    Optional; null when nothing is recorded, which is not the same as the
                    explicit kinds unknown (the user does not know) and none (the user states
                    there is no grace). What the user knows about the grace the creditor
                    allows after a due date (decision D14, ADR-0052): entered by the user only,
                    never inferred from payment history, bank data or model output, with no
                    default length. It only annotates an overdue occurrence; it never moves a
                    due date or hides an obligation.
                  oneOf:
                    - allOf:
                        - $ref: "#/components/schemas/LeewayInput"
                        - required: [kind]
                    - type: "null"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        default:
          $ref: "#/components/responses/Error"
  /commitments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getCommitment
      x-ledger-access: commitments:read
      summary: Get a commitment definition
      tags: [commitments]
      responses:
        "200":
          description: The commitment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCommitment
      x-ledger-access: commitments:write
      summary: Change a commitment definition
      description: |
        A JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017) of the writable
        members. amount and schedule merge member by member, so
        {"schedule":{"day":20}} changes only the day; to switch a schedule
        between monthly and annual, send the whole schedule: every member of
        the new form, plus an explicit null for each member of the old form that
        does not apply (interval for monthly, month for annual). A member left
        out of the patch keeps its old value, so the nulls are required.
        end_date, priority and notes are optional (null clears them); name,
        kind, amount, schedule and start_date cannot be null. The merged
        result is validated as a whole and every invalid field is reported.
        Requires the version in If-Match or the body; a stale version is a
        409 version_conflict with reconciliation. An empty patch, or one
        that changes nothing, is a no-op. Audited (commitment.updated with
        the names of the changed fields).

        A change to amount, schedule, start_date or end_date also reaches
        the commitment's occurrences (decision D6, ADR-0027) in the same
        transaction, from effective_from forward: unpaid occurrences due on
        or after it are rewritten in place (same id), removed when the new
        terms no longer schedule that month, or added; unpaid occurrences
        due before it and every paid occurrence stay as they are. The one
        exception is a start_date or end_date change (decision D23): it
        removes the unpaid occurrences due before the effective date that
        are left outside the new [start_date, end_date]; later ones follow
        the rule above. Occurrences with
        payment evidence (a payment or a confirmed match) or a status override
        of any state are never removed; the audit counts the latter as
        kept_override. An occurrence that is only referenced by deleted
        manual payments cannot be deleted, so any removal (the D23 one or the
        plan's) cancels it instead (decision D31): it leaves the totals, the
        monthly view and the outlook, stays readable, and is audited as
        cancelled_referenced (never also as removed). A later edit that
        schedules its month again revives it: the row keeps its id and history
        and is counted in created. Without
        effective_from the change applies from today in the reporting time
        zone, so overdue unpaid occurrences keep their terms. Audited as
        occurrences.regenerated with the effective date and the counts
        created, updated, removed, kept_paid, kept_history, kept_override,
        removed_out_of_range (the D23 removals) and cancelled_referenced.

        An effective_from after today is allowed and recorded as pending.
        Until that date passes, a later change to these terms whose effective
        date is earlier than the pending one is refused with 409
        pending_terms_change (field effective_from): the definition holds only
        the latest terms, so it would overwrite the older terms of the months
        in between. Retry with effective_from on or after the pending date. An
        edit effective on or after the pending date supersedes it.
      tags: [commitments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  $ref: "#/components/schemas/Version"
                effective_from:
                  description: |
                    Not a member of the commitment: the first date from which
                    changed terms reach occurrences. Defaults to today in the
                    reporting time zone. At most 60 months after the current
                    month.
                  allOf:
                    - $ref: "#/components/schemas/Date"
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  $ref: "#/components/schemas/CommitmentKind"
                amount:
                  $ref: "#/components/schemas/MoneyPatch"
                schedule:
                  $ref: "#/components/schemas/SchedulePatch"
                start_date:
                  $ref: "#/components/schemas/Date"
                end_date:
                  description: The last day the commitment applies (inclusive); null for open-ended. Not before start_date.
                  oneOf:
                    - $ref: "#/components/schemas/Date"
                    - type: "null"
                priority:
                  description: Optional; null when not prioritised.
                  oneOf:
                    - $ref: "#/components/schemas/CommitmentPriority"
                    - type: "null"
                notes:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 2000
                match_tolerance:
                  description: |
                    Optional; null for none. How far a booked bank payment may fall
                    short of amount and still be confirmed automatically by the matching
                    engine (decision D9, ADR-0039); without one only the exact amount
                    confirms automatically. Zero or more, in the commitment's currency.
                    A payment above amount is never confirmed automatically (it would
                    overpay). In a patch, send the whole object or null.
                  oneOf:
                    - $ref: "#/components/schemas/Money"
                    - type: "null"
                leeway:
                  description: |
                    Optional; null when nothing is recorded, which is not the same as the
                    explicit kinds unknown (the user does not know) and none (the user states
                    there is no grace). What the user knows about the grace the creditor
                    allows after a due date (decision D14, ADR-0052): entered by the user only,
                    never inferred from payment history, bank data or model output, with no
                    default length. It only annotates an overdue occurrence; it never moves a
                    due date or hides an obligation. In a patch the object merges member by member; send null to clear it.
                  oneOf:
                    - $ref: "#/components/schemas/LeewayInput"
                    - type: "null"
      responses:
        "200":
          description: The changed commitment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        "409":
          description: |
            version_conflict (stale version, with reconciliation) or
            pending_terms_change (an earlier edit takes effect after this
            edit's effective_from) or deferral_plan_currency (the edit would
            change the currency of an occurrence with an active deferral
            plan; undo the plan first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCommitment
      x-ledger-access: commitments:write
      summary: Delete a commitment definition
      description: |
        Deletes the definition and its unpaid occurrences (derived data).
        An occurrence that only deleted manual payments still refer to cannot
        be deleted; it is cancelled instead (decision D31, ADR-0027) and keeps
        its history, and the commitment row is then kept (archived): it no
        longer appears in any commitment read, list, edit or delete (404) and
        gets no new occurrences. The cancelled occurrences are still readable
        by id and with include_cancelled on the occurrence list.
        Requires If-Match; a stale version is a 409 version_conflict.
        Audited (commitment.deleted, with unpaid_occurrences_removed,
        cancelled_referenced and archived). A commitment with an occurrence
        that has live payment evidence (a manual payment or a confirmed match,
        ADR-0031) cannot be deleted (409 conflict); set end_date to stop it
        instead.
      tags: [commitments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    put:
      operationId: setUserPassword
      x-ledger-access: users:write
      x-ledger-recent-auth: true
      summary: Set a user's password
      description: |
        Sets the user's password (minimum length in bytes, no composition
        rules) and ends every session of that user, except the caller's own
        current session when they set their own password, and revokes every
        device cookie of that user. Audited
        (auth.password_changed with by and sessions_ended); the password is
        never recorded. With an API token this needs the root token of the
        root account (decision D32), even for the token owner's own
        password; any other token is refused with 403 `root_token_required`.
        Sessions need recent sign-in instead.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          description: The password was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSet"
        "403":
          description: "With an API token: code `root_token_required` unless the caller is a root token of the root account (decision D32); also the usual authorization refusals."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /auth/sign-in:
    post:
      operationId: signIn
      x-ledger-access: public
      security: []
      summary: Sign in with a username and password
      description: |
        Starts a session: sets the `__Host-ledger_session` cookie (Secure, HttpOnly,
        SameSite=Strict, Path=/) and returns the session with its CSRF token.
        Every failure (unknown user, wrong password, no password set,
        disabled account) is the same 401 `invalid_credentials` after the
        same work. Too many failures for the username or from the client
        address within the window are 429 `rate_limited` with Retry-After.
        A browser sending a valid `__Host-ledger_device` cookie of the
        account counts its failures against that cookie instead of the
        username (it is not blocked by failures from other browsers); a
        forged, expired, replaced or other user's cookie changes nothing. A
        complete sign-in sets a new device cookie in place of the old one.
        A browser request from another origin is 403 `csrf_failed`. Success
        and failure are audited; a failure never records the username.
        When `auth.password.enabled` is false, every request is 403
        `password_sign_in_disabled` before any check: sign in with
        `GET /auth/oidc/authorize`.

        When the user has TOTP enabled, a right password starts no session:
        the answer is 202 with a challenge for
        `POST /auth/sign-in/second-factor`, valid for five minutes. Only
        a complete sign-in clears the username's failure count.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 256
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie and a new device cookie (`__Host-ledger_device`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "202":
          description: The password was right; a second factor must follow. No cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorChallenge"
        default:
          $ref: "#/components/responses/Error"
  /auth/sign-in/second-factor:
    post:
      operationId: signInSecondFactor
      x-ledger-access: public
      security: []
      summary: Complete a sign-in with a TOTP code or a recovery code
      description: |
        The second step of a sign-in for a user with TOTP enabled. Send the
        challenge from `POST /auth/sign-in` and exactly one of `code`
        (from the authenticator; accepted within one 30-second step either
        side, and only once) or `recovery_code` (consumed by its use). On
        success the session starts exactly as after a password-only sign-in,
        with a new device cookie.
        A wrong, malformed or reused code is 401 `invalid_second_factor` and
        counts towards the same per-username and per-address limits as a
        wrong password (429 `rate_limited` with Retry-After; the device
        cookie's limit instead of the username's when the password step came
        from a known browser); a challenge
        takes at most five wrong codes. An unknown, expired or used-up
        challenge is 401 `unauthenticated`: sign in again. A browser
        request from another origin is 403 `csrf_failed`. Audited
        (auth.signin_succeeded and auth.signin_failed with method totp or
        recovery_code).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge]
              properties:
                challenge:
                  type: string
                  maxLength: 128
                code:
                  type: string
                  description: The 6-digit code from the authenticator.
                  examples: ["123456"]
                recovery_code:
                  type: string
                  format: password
                  description: One unused recovery code, with or without its dashes.
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie and a new device cookie (`__Host-ledger_device`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        default:
          $ref: "#/components/responses/Error"
  /auth/sign-out:
    post:
      operationId: signOut
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-during-enrollment: true
      summary: End the current session
      description: Ends the session the request was made with and clears the cookie. Audited (auth.session_ended, reason signed_out).
      tags: [auth]
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      operationId: getCurrentSession
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-during-enrollment: true
      summary: The current session and its CSRF token
      tags: [auth]
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      operationId: listMySessions
      x-ledger-access: session
      security:
        - sessionCookie: []
      summary: List your active sessions
      description: The signed-in user's sessions that have not ended, newest first. Never includes session tokens.
      tags: [auth]
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    delete:
      operationId: endMySession
      x-ledger-access: session
      security:
        - sessionCookie: []
      summary: End one of your sessions
      description: |
        Ends the session; its next request is 401. Ending the current session
        signs out and clears the cookie. Another user's session is 404.
        Audited (auth.session_ended, reason terminated or signed_out).
      tags: [auth]
      responses:
        "204":
          description: Ended.
        default:
          $ref: "#/components/responses/Error"
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-during-enrollment: true
      summary: Confirm your password for sensitive actions
      description: |
        Checks the signed-in user's password again; when it matches, the
        session counts as recently authenticated until recent_auth_until. A
        wrong password is 403 `invalid_credentials` (the session stays
        valid) and counts towards the sign-in limits (429 with Retry-After;
        with a valid device cookie, against the cookie instead of the
        username).
        403 `password_sign_in_disabled` when `auth.password.enabled` is
        false: use `POST /auth/oidc/reauthenticate`. Audited
        (auth.reauthenticated, auth.reauthentication_failed).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated_at, recent_auth_until]
                properties:
                  authenticated_at:
                    type: string
                    format: date-time
                  recent_auth_until:
                    type: string
                    format: date-time
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    put:
      operationId: changeMyPassword
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      summary: Change your password
      description: |
        Sets the signed-in user's password (minimum length in bytes, no
        composition rules) and ends every other session of the user; the
        current session stays. Revokes every device cookie of the user and
        clears this browser's. Audited (auth.password_changed, by self).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSet"
        default:
          $ref: "#/components/responses/Error"
  /auth/methods:
    get:
      operationId: getSignInMethods
      x-ledger-access: public
      security: []
      summary: Which sign-in methods are available
      description: |
        Tells the sign-in page what to offer: password sign-in (off when
        `auth.password.enabled` is false) and single sign-on with the
        configured OpenID Connect provider (ADR-0033).
      tags: [auth]
      responses:
        "200":
          description: The methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/authorize:
    get:
      operationId: startOIDCSignIn
      x-ledger-access: public
      security: []
      summary: Sign in with single sign-on (browser redirect)
      description: |
        Starts an authorization code flow with PKCE (S256), state and nonce,
        and redirects the browser (303) to the identity provider. The state
        is also set in the `__Host-ledger_oidc` cookie (Secure, HttpOnly,
        SameSite=Lax, ten minutes), which the callback must present. When
        single sign-on is not configured or the provider cannot be reached,
        the browser is sent to `/sign-in?oidc_error=not_configured` or
        `provider_unavailable` instead. Starts are limited per client address
        (20 a minute): beyond that the browser is sent to
        `/sign-in?oidc_error=rate_limited` with a Retry-After header, so a
        flood cannot push pending sign-ins out of the store. Never JSON.
      tags: [auth]
      parameters:
        - name: return_to
          in: query
          required: false
          description: A same-origin path to go to after signing in; anything else means /.
          schema:
            type: string
            maxLength: 512
      responses:
        "303":
          description: To the identity provider, or to the sign-in page with oidc_error.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      x-ledger-access: public
      security: []
      summary: Where the identity provider sends the browser back (browser redirect)
      description: |
        Completes a sign-in, link or re-authentication started by Ledger.
        The state must match a pending request (single use, ten minutes) and
        the `__Host-ledger_oidc` cookie. The code is redeemed with the PKCE
        verifier, and the ID token must pass: its signature against the
        provider's keys, issuer, an audience of exactly this client, azp
        when present, nonce, expiry, an iat within this request (with
        `auth.oidc.clock_skew`), a non-empty subject and, for
        re-authentication, a fresh auth_time. The account is found by the
        (issuer, subject) pair only, never by email address.

        Sign-in: an identity linked to no account is refused unless
        `auth.oidc.provisioning.enabled` is true. Success sets the session
        cookie (an ordinary session, method oidc) and redirects to the
        request's return path. With `auth.oidc.require_2fa` and TOTP
        enabled, it redirects to `/sign-in#second_factor=<challenge>` for
        `POST /auth/sign-in/second-factor`. A failure redirects to
        `/sign-in?oidc_error=<code>`: not_configured, invalid_state,
        access_denied, invalid_response, provider_unavailable, not_linked,
        sign_in_failed or internal_error.

        Link and re-authentication: redirect back to the return path with
        `oidc=linked` or `oidc=reauthenticated`, or with `oidc_error`
        (also already_linked, session_ended, identity_mismatch).

        Audited: auth.signin_succeeded and auth.signin_failed (method oidc;
        reasons identity_not_linked, invalid_credentials, account_disabled),
        oidc.linked, auth.reauthenticated and auth.reauthentication_failed;
        provisioning adds user.created. Never JSON.
      tags: [auth]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Signed in, linked or re-authenticated, or a failure; see the description.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The session cookie after a sign-in; always clears the single-sign-on cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/link:
    get:
      operationId: getMyOIDCLink
      x-ledger-access: session
      security:
        - sessionCookie: []
      summary: Your single-sign-on link
      description: Shown even when single sign-on is no longer configured, so a stale link stays visible.
      tags: [auth]
      responses:
        "200":
          description: The link, or linked false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCLink"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startOIDCLink
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      summary: Link a single-sign-on identity to your account
      description: |
        Starts linking: returns the provider's authorization URL for the
        browser to visit, and sets the `__Host-ledger_oidc` cookie. The
        callback links the identity, keyed by issuer and subject, to this
        account if this session is still live. An account has one link: 409
        `conflict` when it already has one (unlink first), and the callback
        answers already_linked when the identity belongs to another account.
        Linking never disables password sign-in. 404 `not_found` when
        single sign-on is not configured; 503 when the provider is
        unavailable. Audited at the callback (oidc.linked, by self).
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnTo"
      responses:
        "200":
          description: Visit authorization_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationURL"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkMyOIDC
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      summary: Remove your single-sign-on link
      description: |
        Needs another sign-in method to remain: 409 `conflict` unless the
        account has a password and password sign-in is enabled (the host
        command `ledger auth unlink-oidc` can always remove it). Sessions
        already started stay. 404 when there is no link. Audited
        (oidc.unlinked, by self).
      tags: [auth]
      responses:
        "204":
          description: Unlinked.
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/reauthenticate:
    post:
      operationId: startOIDCReauthentication
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-during-enrollment: true
      summary: Re-authenticate with the identity provider for sensitive actions
      description: |
        Returns the provider's authorization URL with prompt=login and
        max_age=0; the callback requires a fresh auth_time and the identity
        linked to this account, then counts the session as recently
        authenticated (as `POST /auth/reauthenticate` does with a
        password). The way to re-authenticate when password sign-in is
        disabled. 409 `conflict` when the account has no link; 404 when
        single sign-on is not configured.
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnTo"
      responses:
        "200":
          description: Visit authorization_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationURL"
        default:
          $ref: "#/components/responses/Error"
  /auth/recovery-sign-in:
    get:
      operationId: recoverySignInPage
      x-ledger-access: public
      security: []
      summary: Confirmation page of a recovery sign-in link (HTML)
      description: |
        Break-glass (decision D16): the link printed by the host command
        `ledger auth recovery-sign-in`. This request changes nothing, so a
        link previewer cannot use up the token: it answers a small HTML page
        whose button posts the token to the same path.
      tags: [auth]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "303":
          description: Signed in, or a failure.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: recoverySignIn
      x-ledger-access: public
      security: []
      summary: Use a one-time recovery sign-in link (browser redirect)
      description: |
        Sent by the confirmation page as a form post
        (application/x-www-form-urlencoded, field token). The token works
        once, expires (15 minutes by default), skips the second factor and
        works whether or not password sign-in is enabled. Success sets the
        session cookie (method recovery) and redirects to /; any failure
        redirects to `/sign-in?recovery_error=invalid_or_expired`. A
        cross-origin browser request is refused (403). Audited
        (auth.signin_succeeded and auth.signin_failed, method
        recovery_sign_in). Never JSON.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 128
      responses:
        "303":
          description: Signed in, or a failure.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor:
    get:
      operationId: getMyTwoFactor
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-during-enrollment: true
      summary: Your two-factor authentication status
      tags: [auth]
      responses:
        "200":
          description: The status. Never includes secrets or recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disableMyTwoFactor
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      summary: Disable your two-factor authentication
      description: |
        Removes the authenticator and every recovery code. Besides recent
        re-authentication, the body must carry a current code from the
        authenticator or an unused recovery code (decision D26-1a; see
        CurrentSecondFactor). 409 `conflict` when TOTP is not enabled, or
        when `auth.require_2fa` is on (enrol a new authenticator to replace
        it instead; the host command `ledger auth reset-2fa` can still
        remove it). Audited (two_factor.disabled, by self, verified_with).
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentSecondFactor"
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor/totp:
    post:
      operationId: startTOTPEnrollment
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      x-ledger-during-enrollment: true
      summary: Start enrolling a TOTP authenticator
      description: |
        Generates a new secret and returns it, with its otpauth:// URI for a
        QR code. This is the only time the secret is shown; it is stored
        encrypted. Confirm with a code from the authenticator within ten
        minutes (`POST /auth/two-factor/totp/confirm`). Starting again
        replaces an unconfirmed enrolment. An enabled authenticator keeps
        working until the new one is confirmed, so this also replaces one.
        503 `dependency_unavailable` when no key-encryption key is
        configured.
      tags: [auth]
      responses:
        "201":
          description: The enrolment was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor/totp/confirm:
    post:
      operationId: confirmTOTPEnrollment
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      x-ledger-during-enrollment: true
      summary: Confirm a TOTP enrolment and receive recovery codes
      description: |
        Checks a code from the authenticator against the started enrolment.
        When it matches, TOTP is enabled (replacing an earlier
        authenticator), ten new recovery codes are returned (shown only
        here; earlier codes stop working) and every other session of the
        user ends; the current session stays and is no longer confined by
        `auth.require_2fa`. A wrong code is 400 `invalid_second_factor`
        (field `code`); no started or an expired enrolment is 409
        `conflict`.

        When TOTP is already enabled (replacing the authenticator), the
        body must also carry `current_code` from the authenticator being
        replaced or `current_recovery_code` (decision D26-1a; see
        CurrentSecondFactor). The new code is checked first, so a mistyped
        new code uses up no recovery code. Audited (two_factor.enabled,
        with verified_with on a replacement).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  description: A code from the authenticator being enrolled.
                  examples: ["123456"]
                current_code:
                  type: string
                  description: Replacing only; a code from the enabled authenticator.
                current_recovery_code:
                  type: string
                  description: Replacing only; an unused recovery code, instead of current_code.
      responses:
        "200":
          description: TOTP is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      x-ledger-access: session
      security:
        - sessionCookie: []
      x-ledger-recent-auth: true
      summary: Replace your recovery codes
      description: |
        Issues ten new recovery codes, shown only here; every earlier code
        stops working. Besides recent re-authentication, the body must carry
        a current code from the authenticator or an unused recovery code
        (decision D26-1a; see CurrentSecondFactor). 409 `conflict` when
        TOTP is not enabled. Audited (two_factor.recovery_codes_regenerated,
        verified_with).
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentSecondFactor"
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /occurrences:
    get:
      operationId: listOccurrences
      x-ledger-access: commitments:read
      summary: List the occurrences of a reporting month
      description: |
        The dated occurrences of every commitment in one month of the
        reporting time zone (decision D5), generated from the definitions
        (ADR-0027): a day past the end of a month falls on its last day, an
        annual February 29 falls on February 28 in common years, and a
        scheduled date before start_date or after end_date is not an
        occurrence. Reading a month first materialises every commitment
        through it; materialised months are never regenerated by a read, so
        repeated reads return the same occurrences. Each occurrence carries
        its payment state, derived when read from payment evidence and
        dates (decision D7, ADR-0031). Months more than 60 months after the
        current month are refused.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/LabelFilter"
        - name: month
          in: query
          required: true
          description: The reporting month, given once.
          schema:
            $ref: "#/components/schemas/YearMonth"
        - name: commitment_id
          in: query
          description: Only occurrences of these commitments (repeat for any of several).
          schema:
            $ref: "#/components/schemas/ID"
        - name: include_cancelled
          in: query
          description: |
            When true, also returns cancelled occurrences (decision D31),
            which are left out by default. They carry cancelled_at and
            cancelled_reason, have payment status cancelled and are never part
            of the monthly totals. Given both true and false it is a 400; the same
            value repeated is accepted.
          schema:
            type: boolean
      responses:
        "200":
          description: One page of occurrences ordered by due date, then ID.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Occurrence"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /occurrences/summary:
    get:
      operationId: getOccurrencesSummary
      x-ledger-access: commitments:read
      summary: Get the monthly view of one reporting month
      description: |
        Every occurrence of the month (the same ones, in the same order, as
        listOccurrences, but all of them in one response, not paged) with its
        derived payment state, and exact totals per currency (ADR-0034).
        Totals are computed on the server with exact decimals and are never
        summed across currencies: each currency has its own entry.

        due is the sum of the occurrence amounts; paid the sum of payment
        evidence in that currency; outstanding what is still owed (with an
        "unpaid" status override the evidence still counts in paid while
        outstanding is the full amount, so paid + outstanding can exceed due);
        overdue the
        part of outstanding on occurrences past their original due date (a
        documented grace period does not reduce it); overpaid evidence above
        an amount. They describe recorded commitments and recorded payments
        only: they are not a statement of money that is safe to spend.

        freshness says how current the view is. Statuses are derived on every
        read (computed_at, as_of). occurrences_changed_at is when the month's
        occurrences last changed. bank says whether a bank connection exists
        (available), how many, the worst freshness state among them and the
        newest successful fetch; it never reports a disconnected, failed or
        stale connection as fresh.

        Months more than 60 months after the current month are refused.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/LabelFilter"
        - name: month
          in: query
          required: true
          description: The reporting month, given once.
          schema:
            $ref: "#/components/schemas/YearMonth"
      responses:
        "200":
          description: The month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthSummary"
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getOccurrence
      x-ledger-access: commitments:read
      summary: Get an occurrence
      tags: [occurrences]
      responses:
        "200":
          description: The occurrence.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Error"
  /outlook:
    get:
      operationId: getOutlook
      x-ledger-access: commitments:read
      summary: Get the outlook against recorded commitments
      description: |
        Compares bank balances with the recorded commitments still due
        (ADR-0044). It is an outlook against recorded commitments only: not a
        forecast and never a statement of money that is safe to spend (see
        notice, which every presentation should show).

        currencies has one entry per currency, computed on the server with
        exact decimals and never summed across currencies. still_due is the
        outstanding amount of every occurrence from window.from (the month
        of the earliest commitment start, at most 240 months back) through
        window.through, exactly as the monthly view derives it: paid,
        cancelled and "not recorded" occurrences owe nothing. overdue is the
        part past its original due date (a documented grace period does not
        reduce it); upcoming the rest. balance is the sum of the counted
        balance of every account in that currency (the newest fetch, booked
        before expected before available; "other" balances, accounts without
        balances and accounts no longer reported are not counted) and
        balance_less_still_due is balance minus still_due; both are null
        when no account has a balance in the currency.

        Balances and accounts need the connections:read grant as well; without
        it balances.shown is false and only commitments are compared. Each
        account carries its data freshness (state, last success and error);
        stale_account_count says how many counted balances are not fresh.

        converted is a secondary aggregate in one reporting currency
        (currency, or reporting.currency when not given; null when neither).
        Each currency line is converted as a whole at the latest acceptable
        rate, rounded half-even to the reporting currency's minor units, and
        included lists the rate used with its provenance. A currency without
        an acceptable rate (stale or missing) is left out entirely and listed
        in excluded with the reason; complete is false then. Planned outflows
        are not part of Ledger yet (planned_outflows.included is false).
      tags: [outlook]
      parameters:
        - name: through
          in: query
          required: false
          description: "The last month whose commitments count; default the current month in the reporting time zone. At most 60 months ahead. A month before the current one is treated as the current month: every occurrence due up to today is always counted; window.through reports the month used."
          schema:
            $ref: "#/components/schemas/YearMonth"
        - name: currency
          in: query
          required: false
          description: Reporting currency of the converted aggregate; default reporting.currency.
          schema:
            $ref: "#/components/schemas/Currency"
        - name: bucket
          in: query
          required: false
          description: |
            Slice the outlook by a bucket (decision D12): only the commitments and the accounts in the bucket are counted, per currency, and
            converted only under the same conversion policy. The response then carries slice. It is a view, not an allocation: a bucket
            holds no money, each balance is the whole balance of an account in the bucket, and the figures are never money that is safe to
            spend. An archived bucket still slices. Needs the organisation:read grant as well; an unknown bucket is a validation error.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: The outlook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlook"
        default:
          $ref: "#/components/responses/Error"
  /auth/tokens:
    get:
      operationId: listMyTokens
      x-ledger-access: session
      security:
        - sessionCookie: []
      summary: List your API tokens
      description: |
        The signed-in user's API tokens in ID order, including expired and
        revoked ones (see status). Never includes the tokens themselves, only
        a hint (prefix, first and last characters).
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMyToken
      x-ledger-access: session-or-root-token
      x-ledger-recent-auth: true
      summary: Create an API token
      description: |
        Creates a token owned by the signed-in user and returns it once, in
        `secret`; it is never shown again (the response is `Cache-Control:
        no-store`). Send it as `Authorization: Bearer ldgr_…`.

        Give `grants` (at least one), or `root: true` for a root token, which
        holds every grant its owner's role holds, including grants added in
        later versions; the response then carries a `warning`. Grants the
        caller does not hold, or a root token requested by anyone who does
        not hold every grant, are 403 `forbidden` (no escalation). An
        unknown grant is 400. `expires_at` is optional; without it the
        token never expires.

        A token created by a token expires no later than the token that
        created it: a later or missing `expires_at` is capped, silently, at
        that token's expiry, and the response shows the expiry it got. A
        parent that never expires leaves the request as given.

        Requests made with a token skip two-factor and re-authentication;
        each state-changing one is audited (`token.write_used`). A token is
        limited by its owner's current role on every request.

        Callers: a signed-in session (with recent re-authentication), or a
        bearer **root token of the root account** (the first user created on
        the instance, normally by the bootstrap command; decision D25). Such a
        token creates tokens owned by the root account, bounded by that
        account's current role, and may itself ask for a root token. Every
        other API token is 403 `forbidden`. Audited (`token.created`, never
        the token; a token-created token's entry names the creating token in
        `parent_token_id` and as the actor).
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApiToken"
      responses:
        "201":
          description: Created. This is the only time the token is shown.
          headers:
            Location:
              description: The new token's URL under /auth/tokens.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        default:
          $ref: "#/components/responses/Error"
  /auth/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getMyToken
      x-ledger-access: session
      security:
        - sessionCookie: []
      summary: Get one of your API tokens
      description: Another user's token is 404.
      tags: [tokens]
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeMyToken
      x-ledger-access: session
      security:
        - sessionCookie: []
      summary: Revoke one of your API tokens
      description: |
        Revokes the token at once: its next request is 401. Revoking a
        revoked token changes nothing (204). Another user's token is 404.
        Audited (`token.revoked`).

        Cascades: every token created through this one, directly or through
        other tokens, that is not already revoked is revoked at once too, and
        audited as `token.revoked` with `cascaded_from` naming this token.
        Descendants that are already revoked are left alone. Tokens without a
        parent (made with a session or on the host) are never reached.

        With an API token, revoking a root token of the root account (which
        also ends its children) needs a root token of the root account:
        one such token may revoke another. Any other token, even one holding
        `tokens:write`, is refused with 403 `root_token_required`
        (decision D34). Sessions are unchanged. Revoking any other token is
        open to `tokens:write`.
      tags: [tokens]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /tokens:
    get:
      operationId: listTokens
      x-ledger-access: tokens:read
      summary: List every user's API tokens
      description: |
        All API tokens in ID order, including expired and revoked ones.
        Administrative. Never includes the tokens themselves.
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: owner_id
          in: query
          description: Only this user's tokens.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenPage"
        default:
          $ref: "#/components/responses/Error"
  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getToken
      x-ledger-access: tokens:read
      summary: Get any user's API token
      tags: [tokens]
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeToken
      x-ledger-access: tokens:write
      summary: Revoke any user's API token
      description: |
        Revokes the token at once: its next request is 401. Revoking a
        revoked token changes nothing (204). Audited (`token.revoked`).

        Cascades: every token created through this one, directly or through
        other tokens, that is not already revoked is revoked at once too, and
        audited as `token.revoked` with `cascaded_from` naming this token.
        Descendants that are already revoked are left alone. Tokens without a
        parent (made with a session or on the host) are never reached.
      tags: [tokens]
      responses:
        "204":
          description: Revoked.
        "403":
          description: "With an API token: code `root_token_required` when the token is a root token of the root account and the caller is not one (decision D34); also the usual authorization refusals."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}/manual-payments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: listManualPayments
      x-ledger-access: commitments:read
      summary: List an occurrence's manual payments
      description: Ordered by paid_on, then ID.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of manual payments.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManualPayment"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: recordManualPayment
      x-ledger-access: commitments:write
      summary: Record a manual payment
      description: |
        Records a payment the user made by hand. It is user data, kept apart
        from bank facts and from match links, and it is payment evidence: the
        occurrence's status is derived again (paid when the payments in its
        currency cover its amount, partially_paid below that), the
        occurrence becomes immutable to commitment edits, and the commitment
        can no longer be deleted. The amount must be positive and in the
        occurrence's currency (amounts are never converted); paid_on must
        not be after today in the reporting zone. Like every create it needs
        no version; the occurrence's version increases. Audited as
        manual_payment.recorded (identifier and currency, never the amount
        or note). Records are not edited: delete a mistaken one and record
        it again.
      tags: [occurrences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualPaymentInput"
      responses:
        "201":
          description: The recorded payment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: The new payment's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPayment"
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}/manual-payments/{payment_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
      - name: payment_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getManualPayment
      x-ledger-access: commitments:read
      summary: Get a manual payment
      tags: [occurrences]
      responses:
        "200":
          description: The payment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPayment"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteManualPayment
      x-ledger-access: commitments:write
      summary: Delete a manual payment
      description: |
        Soft-deletes the payment record (the row is kept, marked deleted, and
        no longer counts or lists); the occurrence's status is derived
        again from the evidence that remains and its version increases. A
        "paid" override stays recorded but has no effect without evidence
        (override.applied is false). Requires the payment's version in
        If-Match. Audited as manual_payment.deleted, with its amount.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The payment was deleted.
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}/status-override:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    put:
      operationId: setOccurrenceStatusOverride
      x-ledger-access: commitments:write
      summary: Set a manual status override
      description: |
        Overrides the derived status with a reason (decision D7). "paid"
        marks the occurrence settled although the counted evidence does not
        cover it (for example a payment in another currency, which is never
        converted); it needs payment evidence and is refused with 409
        payment_evidence_required without it. "unpaid" says the evidence
        does not settle it: the status follows the dates. An active
        override is replaced, and DELETE restores it. Requires the
        occurrence's version in If-Match or the body; the version increases.
        Audited as occurrence.status_overridden (status and previous status;
        the reason is not copied to the audit log).
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status:
                  $ref: "#/components/schemas/OverrideStatus"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The occurrence with its new payment state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: undoOccurrenceStatusOverride
      x-ledger-access: commitments:write
      summary: Undo the manual status override
      description: |
        The undo of the last override change: the active override is marked
        undone and the override it replaced, if any, becomes active again;
        otherwise the derived status applies. Repeating it walks further back.
        404 when no override is active. Requires the occurrence's version in
        If-Match; the version increases. Audited as
        occurrence.status_override_undone (undone and restored status).
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The occurrence with its restored payment state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches:
    get:
      operationId: listPaymentMatches
      x-ledger-access: commitments:read
      summary: List payment matches
      description: |
        Matches between bank transactions and occurrences (ADR-0035), ordered
        by ID (creation order), each with the bank fact it refers to and its
        history. Filter by transaction_id, occurrence_id, state or origin
        (repeat a filter for any of several values).
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/LabelFilter"
        - name: transaction_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: occurrence_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/MatchState"
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/MatchOrigin"
      responses:
        "200":
          description: One page of matches.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMatch"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPaymentMatch
      x-ledger-access: commitments:write
      summary: Match a bank transaction to an occurrence
      description: |
        Records the user's decision that amount of the bank transaction pays
        the occurrence: a confirmed match with origin user. One transaction
        can pay several occurrences and an occurrence can be paid in parts
        (decision D8 a). The transaction must be outgoing (409
        transaction_not_debit) and booked, still reported and not superseded
        (409 transaction_not_countable: a pending transaction can only be
        suggested). The amount must be in the currency of both the
        transaction and the occurrence (400 on amount.currency; nothing is
        converted). Confirmed allocations of one transaction never exceed its
        amount (409 transaction_over_allocated), a pair has at most one open
        match (409 duplicate_match), and the occurrence's payment evidence
        (manual payments included) never exceeds its amount unless
        allow_overpayment is true (409 occurrence_overpaid). The occurrence's
        status is derived again and its version increases. Audited as
        payment_match.confirmed. Suggestions are created by the matching
        engine (task X2), not through this operation.
      tags: [payment-matches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transaction_id, occurrence_id, amount]
              properties:
                transaction_id:
                  $ref: "#/components/schemas/ID"
                occurrence_id:
                  $ref: "#/components/schemas/ID"
                amount:
                  $ref: "#/components/schemas/PositiveMoney"
                allow_overpayment:
                  type: boolean
                  default: false
                  description: Allow the occurrence's payment evidence to exceed its amount; the excess shows as overpaid_amount.
                reason:
                  $ref: "#/components/schemas/MatchReason"
      responses:
        "201":
          description: The confirmed match.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: The new match's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getPaymentMatch
      x-ledger-access: commitments:read
      summary: Get a payment match
      tags: [payment-matches]
      responses:
        "200":
          description: The match with its bank fact and history.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: confirmPaymentMatch
      x-ledger-access: commitments:write
      summary: Confirm a suggested match
      description: |
        Confirms a suggestion (any origin; a model suggestion is only ever
        confirmed this way). The same checks as creating a match apply,
        including transaction_not_countable for a pending transaction.
        Requires the match's version in If-Match or the body. Audited as
        payment_match.confirmed.
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                allow_overpayment:
                  type: boolean
                  default: false
                  description: Allow the occurrence's payment evidence to exceed its amount; the excess shows as overpaid_amount.
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: rejectPaymentMatch
      x-ledger-access: commitments:write
      summary: Reject a suggested match
      description: |
        Records that the transaction does not pay the occurrence. The match
        stays listed as rejected (final); the pair can be suggested again.
        Audited as payment_match.rejected.
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/unmatch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: unmatchPaymentMatch
      x-ledger-access: commitments:write
      summary: Undo a confirmed match
      description: |
        The match was wrong: the transaction does not pay the occurrence. The
        match becomes rejected (final), stops being payment evidence, and the
        occurrence's status is derived again; its version increases. Audited as
        payment_match.unmatched.
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/correct:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: correctPaymentMatch
      x-ledger-access: commitments:write
      summary: Correct the allocated amount
      description: |
        Changes the amount of a suggested or confirmed match. A confirmed match
        is checked again with the new amount (transaction_over_allocated,
        occurrence_overpaid). The history keeps every amount. Audited as
        payment_match.corrected (never the amount).
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount:
                  $ref: "#/components/schemas/PositiveMoney"
                allow_overpayment:
                  type: boolean
                  default: false
                  description: Allow the occurrence's payment evidence to exceed its amount; the excess shows as overpaid_amount.
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/reverse:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: reversePaymentMatch
      x-ledger-access: commitments:write
      summary: Reverse a confirmed match
      description: |
        The match was right but the payment was reversed (bounced, refunded or
        returned): the match becomes reversed (final) and the occurrence
        reopens with the status it would have without it (decision D8 a). The
        occurrence keeps the reversed match as payment history. Audited as
        payment_match.reversed.
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/unconfirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: unconfirmPaymentMatch
      x-ledger-access: commitments:write
      summary: Take back a confirmation (undo)
      description: |
        Undo of a confirmation (decision D42 1a, ADR-0045): the match becomes
        a suggestion again, exactly as it was before it was confirmed. Its
        decision (decided_by, decided_at) and the tolerance it was confirmed
        within are cleared, its reason is the suggestion's again, it stops
        being payment evidence and the occurrence's status is derived again;
        its version increases. The reason given here is kept in the history
        entry (action unconfirmed). Audited as payment_match.unconfirmed.

        Only the person who confirmed it may: a token acts as its owner,
        whether called directly or through MCP; any other caller gets 403
        match_undo_not_decider, and a confirmation made by automation cannot
        be unconfirmed. Only inside the undo window, checked on the server:
        the confirmation is still the match's latest change, it is still the
        caller's latest match decision, and nothing else has changed the
        occurrence since (another match, a manual payment, a status override,
        a terms change). Otherwise 409 match_undo_window_closed: unmatch
        instead. A match created confirmed was never a suggestion: 409
        invalid_match_state.
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /payment-matches/{id}/confirm-replacing:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: confirmPaymentMatchReplacing
      x-ledger-access: commitments:write
      summary: Confirm a suggestion as the payment already recorded by hand
      description: |
        "This is the payment I recorded" (decision D45, ADR-0049): confirms a
        suggested match and, in the same write, marks the listed manual
        payments of the match's occurrence replaced by it. A replaced record
        is kept and still listed (replaced_by_match_id) but stops counting as
        payment evidence: the bank match pays the occurrence instead, so the
        payment never counts twice. The confirmation's checks then run
        against the evidence that remains: occurrence_overpaid unless
        allow_overpayment, and the tolerance applies only when bank matches
        alone remain (decision D41). The confirmation's history entry lists
        replaced_manual_payment_ids. Audited as payment_match.confirmed and,
        per record, manual_payment.replaced (with its amount).

        It is an ordinary confirmation otherwise: unconfirm inside the undo
        window (ADR-0045) makes it a suggestion again and the records count
        again, exactly as before (manual_payment.restored); so does an
        unmatch; a reversal leaves them replaced.

        Each record must be of the match's occurrence (409
        manual_payment_other_occurrence), in its currency (400
        validation_failed), not deleted and not already replaced by a match
        (409 manual_payment_not_replaceable); an unknown identifier is 400
        validation_failed. The match must be a suggestion (409
        invalid_match_state).

        The bank can re-report a payment under a new transaction identifier
        while an earlier match still replaces the record (that match is then
        held, ADR-0049 amendment A). Unmatch the earlier match first, which
        restores the record, then confirm the new transaction as replacing it.
        allow_overpayment is not the way: it counts the held record and the
        new match together and shows the excess as overpaid.
      tags: [payment-matches]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manual_payment_ids]
              properties:
                manual_payment_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/ID"
                  description: The manual payments of the match's occurrence that this bank payment is.
                allow_overpayment:
                  type: boolean
                  default: false
                  description: Allow the occurrence's remaining payment evidence to exceed its amount; the excess shows as overpaid_amount.
                reason:
                  $ref: "#/components/schemas/MatchReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The match after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatch"
        default:
          $ref: "#/components/responses/Error"
  /bank-applications:
    get:
      operationId: listBankApplications
      x-ledger-access: connections:read
      summary: List the configured provider applications
      description: |
        The banking-data provider applications this deployment is configured
        with, each with its mode (app or developer, as the provider documents
        them; neither is the sandbox), its environment, what accounts a
        connection can reach (account_access: all, or linked_only for a
        developer-mode application) and its capabilities. Credentials are
        never shown.
      tags: [bank-connections]
      responses:
        "200":
          description: The applications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankApplication"
        default:
          $ref: "#/components/responses/Error"
  /bank-applications/{application}/institutions:
    parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listBankInstitutions
      x-ledger-access: connections:read
      summary: List the banks an application offers in a country
      description: |
        Asks the provider which banks it offers for a country. A read: nothing
        is changed. Provider failures are reported with their kind
        (bank_unavailable and bank_rate_limited can be retried later; Retry-After
        says when, if the provider said).
      tags: [bank-connections]
      parameters:
        - name: country
          in: query
          required: true
          description: ISO 3166-1 alpha-2 code in capitals.
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
      responses:
        "200":
          description: The institutions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankInstitution"
        default:
          $ref: "#/components/responses/Error"
  /bank-connections:
    get:
      operationId: listBankConnections
      x-ledger-access: connections:read
      summary: List bank connections with their accounts and freshness
      description: |
        Every bank connection, oldest first, each with its accounts, the
        freshness of each account (when it last refreshed successfully and
        when it last tried), the latest balances Ledger holds (a balance is
        absent, never zero, when the bank reported none), the latest refresh run
        and, when background refresh is on, the schedule. Provider session
        references, authorisation codes, account handles and full account
        numbers are never returned.
      tags: [bank-connections]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of connections.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankConnection"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startBankConnection
      x-ledger-access: connections:write
      summary: Start connecting a bank
      description: |
        Records a pending connection and asks the provider to begin consent.
        Send the user to authorization_url; the bank sends them back to
        banking.redirect_url, whose page calls completeBankConnection. The call
        is never retried by Ledger. If the provider refuses, the connection stays
        visible with status failed. 409 bank_connect_unavailable means
        banking.redirect_url is not configured. Audited as
        bank_connection.started.
      tags: [bank-connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application, institution_id, country]
              properties:
                application:
                  type: string
                  maxLength: 64
                institution_id:
                  type: string
                  maxLength: 256
                country:
                  type: string
                  pattern: "^[A-Z]{2}$"
                psu_type:
                  type: string
                  enum: [personal, business]
                  default: personal
                valid_for_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Consent length asked for; the bank may grant less. Default is the longest allowed.
      responses:
        "201":
          description: The pending connection and where to send the user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConsentStart"
        default:
          $ref: "#/components/responses/Error"
  /bank-connections/complete:
    post:
      operationId: completeBankConnection
      x-ledger-access: connections:write
      summary: Finish a consent with what the bank's redirect returned
      description: |
        Called by the consent callback page with the state and code (or error)
        the bank returned. The state works once: a replay is 409
        consent_not_found; so is a state older than banking.consent_ttl, or one
        started by another user (it stays valid for them). The state is claimed
        before the bank is called, so of two completions only one reaches it. A
        refused or failed first consent leaves the
        connection failed; a failed reconnect leaves a connection that needed
        reconnecting still needing it. The code is never stored or logged. Audited
        as bank_connection.connected.
      tags: [bank-connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state:
                  type: string
                  maxLength: 256
                code:
                  type: string
                  maxLength: 4096
                error:
                  type: string
                  maxLength: 256
                  description: The provider's error code when the user cancelled or the bank refused. Send it instead of code.
      responses:
        "200":
          description: The connection, now active.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConnection"
        default:
          $ref: "#/components/responses/Error"
  /bank-connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getBankConnection
      x-ledger-access: connections:read
      summary: Get a bank connection
      tags: [bank-connections]
      responses:
        "200":
          description: The connection.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConnection"
        default:
          $ref: "#/components/responses/Error"
  /bank-connections/{id}/reconnect:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: reconnectBankConnection
      x-ledger-access: connections:write
      summary: Start a new consent for an existing connection
      description: |
        For a connection whose consent ended or was withdrawn (status
        reconnect_required), or to renew one early. The connection keeps its
        status and data until the new consent completes, so a cancelled reconnect
        loses nothing. 409 connection_not_active while the first consent is still
        pending. Audited as bank_connection.reconnect_started.
      tags: [bank-connections]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                valid_for_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
      responses:
        "200":
          description: The connection and where to send the user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConsentStart"
        default:
          $ref: "#/components/responses/Error"
  /bank-connections/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: refreshBankConnection
      x-ledger-access: connections:write
      summary: Refresh a connection now
      description: |
        Runs a refresh through the same engine as the background scheduler, so
        one connection is never refreshed twice at once (409 refresh_in_progress,
        with Retry-After: show it and try again shortly). The call answers 200
        with the connection even when the refresh failed: the last_refresh_run
        says how it ended and its error.kind tells what to do (reconnect_required:
        reconnect; retryable or rate_limited: try again later; permanent:
        retrying will not help). The wait is bounded below the server's write
        timeout; a refresh that is still going at the bound is not cancelled while
        the server runs: the answer is 200 with refresh_running true and the run
        goes on, so poll the connection until refresh_running is false. When the
        server shuts down, a run still going after the shutdown bound is cancelled
        and recorded as interrupted (outcome interrupted); the committed windows
        stay and a later refresh resumes them. A failed refresh never changes
        stored balances or transactions. After a refresh of the connection
        finished (any trigger, any outcome) another one on request is refused for
        banking.refresh.request_cooldown (default 5 minutes): 429 refresh_cooldown
        with Retry-After in seconds; the connection's refresh_available_at says
        when it is allowed again. The background scheduler is never held back.
        409 connection_not_active for a connection that is pending,
        disconnected, failed or needs a new consent. Audited as
        bank_connection.refresh_requested.
      tags: [bank-connections]
      responses:
        "200":
          description: The connection after the refresh.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConnection"
        "429":
          description: |
            refresh_cooldown: this connection was refreshed a moment ago. Retry-After
            says in seconds when a refresh on request is allowed again. Nothing was
            started or recorded. (bank_rate_limited is the bank asking for a pause.)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            dependency_unavailable: the server is shutting down and starts no new
            refresh. Try again once it is back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /bank-connections/{id}/disconnect:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: disconnectBankConnection
      x-ledger-access: connections:write
      summary: Disconnect a bank
      description: |
        Ends the provider session and marks the connection disconnected. Accounts,
        balances and transactions stay as history. A session the provider no
        longer knows counts as ended; if the provider cannot be reached nothing
        changes and the error says so. Requires the connection's version in
        If-Match or the body. Audited as bank_connection.disconnected.
      tags: [bank-connections]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The disconnected connection.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConnection"
        default:
          $ref: "#/components/responses/Error"
  /mcp:
    post:
      operationId: postMCP
      x-ledger-access: token
      security:
        - bearerAuth: []
      summary: Model Context Protocol endpoint (streamable HTTP)
      description: |
        The MCP server (ADR-0038): JSON-RPC 2.0 messages (one per request) over streamable
        HTTP, stateless, with plain JSON answers (no event stream, no
        session). Send `Authorization: Bearer <API token>`; sessions are
        refused with 403. A client lists the tools with `tools/list` and
        calls them with `tools/call`.

        Every tool maps to one operation of this API and runs through that
        operation's own route with the caller's token, so validation, grants
        and audit are the same as a direct call: a tool that needs
        `commitments:write` answers a token without it with a tool error
        (`isError`) naming the grant, and every state-changing call is
        recorded as `mcp.tool_called` (tool and outcome, never arguments)
        besides the `token.write_used` entry of the operation itself. A
        write made through `ledger mcp stdio` is recorded by the server as
        `mcp.tool_called` with outcome `requested` (the tool name comes
        from the client's `X-Ledger-MCP-Tool` header; the outcome is that of
        the operation).
        Tools are annotated read-only, write or destructive. Read-only
        context (the caller's identity and grants, the grant vocabulary and
        this API description) is offered as resources. Nothing secret is in a
        tool result or a resource.

        A JSON-RPC batch (a JSON array) is refused with 400 `validation`:
        it would carry many tool calls in one request and so get around the
        per-token rate limit. Send one message per request.

        Requests are limited per token (`mcp.requests_per_minute`,
        `mcp.burst`): more are 429 `rate_limited` with Retry-After. A body
        above `mcp.max_request_bytes` is 413. GET and DELETE are 405. With
        `mcp.enabled: false` the endpoint answers 404 `not_found`.
      tags: [mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: One JSON-RPC 2.0 request or notification of the Model Context Protocol (a batch array is refused with 400).
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
        "202":
          description: A notification or response was accepted; there is no body.
        default:
          $ref: "#/components/responses/Error"
  /payment-matching/runs:
    post:
      operationId: runPaymentMatching
      x-ledger-access: commitments:write
      summary: Run the automatic payment matching
      description: |
        Runs the automatic matching engine once (task X2, ADR-0039), the same
        run that follows every bank refresh that stored something. It pairs
        outgoing bank transactions with open occurrences of the same
        currency, an amount within 10% (or the commitment's match tolerance)
        and a date within 7 days of the due date. A pair is confirmed only
        when every safeguard of decision D9 passes: the exact amount (or short
        by at most the commitment's match_tolerance), a booked transaction,
        dated within 3 days of the due date (or, for an occurrence with an
        active deferral plan, of its planned date), the only candidate on both sides,
        and neither already assigned. Every other candidate becomes a
        suggestion (state suggested, origin auto_rule) whose reason lists the
        safeguards that failed; the description similarity is shown as a hint
        and never confirms. Pending transactions are only suggested. A pair a
        person rejected, unmatched or reversed is never suggested again, and
        the run never changes a match a person touched (decision D33); it only
        drops its own suggestions that are no longer candidates.

        Idempotent: a second run over unchanged data writes nothing. The
        matches are written and audited (payment_match.*) with the system as
        actor; the request itself is audited as payment_matching.run with the
        counts. Deterministic and offline: no bank or model is contacted.
      tags: [payment-matches]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: No options yet; send nothing or an empty object.
      responses:
        "200":
          description: What the run did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMatchingRun"
        default:
          $ref: "#/components/responses/Error"
  /merchants/sources:
    get:
      operationId: listMerchantSources
      x-ledger-access: merchants:read
      summary: The merchant-identification sources
      description: |
        Which sources identify merchants (task E2, ADR-0054; decision D15):
        the built-in curated mapping and the reuse of the person's confirmed
        mappings as suggestions, both local and always on, and a remote
        source that is off unless the operator enabled it. For each: whether
        it is on, what leaves the machine for a lookup (nothing for a local
        source), the attribution its licence requires next to identities it
        provided, whether its logo references are kept and how long its
        answers are kept. Show the attribution wherever an identity from that
        source (enrichment.source) is shown. Administrators only.
      tags: [merchants]
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/MerchantSource"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{id}/merchant:
    parameters:
      - name: id
        in: path
        required: true
        description: The bank transaction's ID.
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getTransactionMerchant
      x-ledger-access: merchants:read
      summary: A bank transaction's merchant
      description: |
        The merchant identity of a bank transaction (task E1, ADR-0051), resolved
        from the lookup source's enrichment and the person's decision, with both
        records kept apart in the answer. name and logo_ref are set only when
        the identity may be shown: the person confirmed or corrected it, or the
        source is reliable (confidence at or above the reliability threshold, a
        named default of 800 permille; decision D15 chose a local curated
        mapping plus the person's confirmations, offline). Everything else is explicit
        in state (uncertain, ambiguous, none, unavailable, not_looked_up,
        rejected) and fallback is true: use a neutral presentation. The bank's
        own description, counterparty and amount are never changed by merchant
        identity, and it never affects payment status. 404 for a transaction
        that does not exist. Administrators only (merchant names derive from
        bank text).
      tags: [merchants]
      responses:
        "200":
          description: The merchant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        default:
          $ref: "#/components/responses/Error"
  /transactions/{id}/merchant/review:
    parameters:
      - name: id
        in: path
        required: true
        description: The bank transaction's ID.
        schema:
          $ref: "#/components/schemas/ID"
    put:
      operationId: reviewTransactionMerchant
      x-ledger-access: merchants:write
      summary: Confirm, correct or reject a merchant
      description: |
        Records the person's decision about a transaction's merchant, replacing
        an earlier one: confirmed (the enrichment's identified name is right;
        409 nothing_to_confirm when there is none, for instance when it is
        ambiguous), corrected (name is the merchant) or rejected (there is no
        merchant to show). The decision is stored apart from the bank
        transaction and the enrichment, so a re-import or a new lookup does not
        remove it. When a pending transaction is booked under a new key, the
        decision made about the pending one carries over to the booking
        (review_inherited); a new decision on the booking replaces it. A confirmation that the source later contradicts (another
        name) stops applying and is reported as confirmation_outdated. Audited
        as merchant.confirmed, merchant.corrected or merchant.rejected (never
        with the name). Last write wins: there is no version check.
      tags: [merchants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [confirmed, corrected, rejected]
                name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 200
                  description: The merchant's name for corrected (or give merchant_id instead), refused for the others. Runs of white space are collapsed. The name resolves to the merchant record whose alias has its key, and a new record (with the name as its first alias) is made when none has.
                merchant_id:
                  oneOf:
                    - $ref: "#/components/schemas/ID"
                    - type: "null"
                  description: Corrects to an existing, active merchant record (409 merchant_archived for an archived one); the decision records its display name. Only for corrected, and not together with name.
      responses:
        "200":
          description: The merchant after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: clearTransactionMerchantReview
      x-ledger-access: merchants:write
      summary: Take a merchant decision back
      description: |
        Removes the person's decision, so the merchant resolves from the
        enrichment alone again. Audited as merchant.review_cleared.

        404 when the transaction has no decision of its own and inherits none.
        409 review_inherited when the only decision is inherited from the
        pending transaction this one superseded (review_inherited is true on
        the merchant): nothing is removed here. review.transaction_id names
        that pending transaction; clearing the decision there removes the
        inherited one from this transaction too.
      tags: [merchants]
      responses:
        "200":
          description: The merchant without the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        default:
          $ref: "#/components/responses/Error"
  /merchants:
    get:
      operationId: listMerchants
      x-ledger-access: merchants:read
      summary: List merchant records
      description: |
        Merchant records (task M1, ADR-0058, decision D-MER 1a): a stable id, the name to show and the
        alias names a transaction's merchant name is matched by. Decisions about transactions and
        organisation assignments to a merchant refer to its id, so they survive a rename or a new
        spelling. Active merchants only unless archived=true (which lists archived and merged ones too).
        Items come in ID order. Administrators only (names and aliases derive from bank text).
      tags: [merchants]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: archived
          in: query
          description: true includes archived and merged merchants.
          schema:
            type: boolean
      responses:
        "200":
          description: One page of merchants.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MerchantRecord"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMerchant
      x-ledger-access: merchants:write
      summary: Create a merchant record
      description: |
        Creates a merchant at version 1. The display name (trimmed, white space collapsed, Unicode
        NFC) is its first alias, and aliases adds more. An alias is matched by its key: NFC, white
        space collapsed, lower case; a key names one merchant at most (409 merchant_alias_taken,
        nothing is created). Identified enrichment answers whose name has one of the keys resolve to
        the new merchant. Audited (merchant.created with origin user, never a name).
      tags: [merchants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                aliases:
                  type: [array, "null"]
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
      responses:
        "201":
          description: The created merchant.
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        "409":
          description: merchant_alias_taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /merchants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getMerchant
      x-ledger-access: merchants:read
      summary: Get a merchant record
      description: A merchant with its aliases. A merged merchant is still found, archived, with merged_into naming the merchant it was merged into.
      tags: [merchants]
      responses:
        "200":
          description: The merchant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMerchant
      x-ledger-access: merchants:write
      summary: Rename a merchant
      description: |
        A JSON Merge Patch (RFC 7396) of display_name. The id never changes, so every decision and
        assignment follows the rename. The new name also becomes an alias unless the merchant has it
        already; when another merchant has it the rename is refused (409 merchant_alias_taken: merge
        the two instead). Requires the version in If-Match or the body; a stale version is a 409
        version_conflict with reconciliation. A merged merchant cannot change (409
        merchant_archived). The same name is a no-op. Audited (merchant.updated with fields).
      tags: [merchants]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  $ref: "#/components/schemas/Version"
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: The renamed merchant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        "409":
          description: version_conflict, merchant_alias_taken or merchant_archived (merged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMerchant
      x-ledger-access: merchants:write
      summary: Delete a merchant record
      description: |
        Deletes a merchant that no decision, organisation assignment or merged merchant refers to,
        with its aliases. A merchant that was itself merged into another cannot be deleted either, so
        merged ids keep resolving (409 merchant_in_use in both cases: archive or merge instead). Enrichment answers that
        resolved to it lose the reference (they are derived data). Requires If-Match. Audited
        (merchant.deleted).
      tags: [merchants]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "409":
          description: version_conflict or merchant_in_use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /merchants/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: archiveMerchant
      x-ledger-access: merchants:write
      summary: Archive a merchant record
      description: |
        Keeps the merchant with its aliases, decisions and assignments, and stops anything new from
        being attached to it by id (a correction naming it, an organisation assignment: 409
        merchant_archived). Its aliases still resolve names to it. Requires If-Match. Audited
        (merchant.archived).
      tags: [merchants]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The archived merchant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        "409":
          description: version_conflict or merchant_archived (merged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /merchants/{id}/unarchive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: unarchiveMerchant
      x-ledger-access: merchants:write
      summary: Unarchive a merchant record
      description: Makes the merchant usable again; a merged merchant stays archived (409 merchant_archived). Requires If-Match. Audited (merchant.unarchived).
      tags: [merchants]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The unarchived merchant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        "409":
          description: version_conflict or merchant_archived (merged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /merchants/{id}/aliases:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: addMerchantAlias
      x-ledger-access: merchants:write
      summary: Add a spelling to a merchant
      description: |
        Adds an alias: transactions whose merchant name has the same key (NFC, white space collapsed,
        lower case) resolve to this merchant and keep its decisions and assignments. A key the
        merchant already has is no change; another merchant's is 409 merchant_alias_taken. Identified
        enrichment answers with the name and no merchant yet now resolve to it. Raises the version.
        Audited (merchant.alias_added, never the alias).
      tags: [merchants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: The merchant with the alias.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        "409":
          description: merchant_alias_taken or merchant_archived (merged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /merchants/{id}/aliases/{alias_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
      - name: alias_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    delete:
      operationId: removeMerchantAlias
      x-ledger-access: merchants:write
      summary: Remove a spelling from a merchant
      description: |
        Removes one alias (404 when the merchant has no such alias). Decisions and assignments stay
        with the merchant; enrichment answers that resolved to it through that key lose the
        reference. Raises the version. Audited (merchant.alias_removed).
      tags: [merchants]
      responses:
        "200":
          description: The merchant without the alias.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRecord"
        "409":
          description: merchant_archived (merged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /merchants/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: mergeMerchants
      x-ledger-access: merchants:write
      summary: Merge another merchant into this one
      description: |
        Moves everything of the merchant named by merchant_id into this one in one transaction: its
        aliases, the decisions and enrichment answers that refer to it, and its organisation
        assignments. Where both have an assignment for the same slot (the category, or the same
        label), this merchant's stands unless the other's is the person's own and this one's is a
        rule's or a model's (counted in kept when not moved). The other merchant stays, archived,
        with merged_into set to this one; merchants merged into it earlier now point here. This
        merchant must be active (409 merchant_archived) and at the If-Match version; the other may be
        archived but not merged (409 merchant_archived). Merging a merchant into itself is a 400.
        Audited (merchant.merged with merged_from and the counts: aliases, decisions, enrichments,
        categories, labels, kept, and replaced automatic assignments).
      tags: [merchants]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [merchant_id]
              properties:
                merchant_id:
                  $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: The remaining merchant and what moved.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [merchant, moved, kept, replaced]
                properties:
                  merchant:
                    $ref: "#/components/schemas/MerchantRecord"
                  moved:
                    type: object
                    additionalProperties: false
                    required: [aliases, decisions, enrichments, categories, labels]
                    properties:
                      aliases:
                        type: integer
                        minimum: 0
                      decisions:
                        type: integer
                        minimum: 0
                      enrichments:
                        type: integer
                        minimum: 0
                      categories:
                        type: integer
                        minimum: 0
                      labels:
                        type: integer
                        minimum: 0
                  kept:
                    type: integer
                    minimum: 0
                    description: Assignments of the merged merchant not moved because this one had its own for the slot.
                  replaced:
                    type: integer
                    minimum: 0
                    description: Automatic (rule or model) assignments of this merchant dropped because the merged merchant had the person's own for the slot.
        "409":
          description: version_conflict or merchant_archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /rates:
    get:
      operationId: listRates
      x-ledger-access: rates:read
      summary: List cached exchange rates
      description: |
        The exchange rates Ledger has cached (task FX2c, ADR-0048), the ones its
        converted totals use. It reads the local cache only and never calls the
        rate provider. Each rate carries its provenance: the provider (the
        adapter, such as frankfurter), the source key (the publisher the
        provider names, such as ECB, or blended), the pair, the exact rate as
        published (`value`, a string, never rounded), its date, when Ledger last
        retrieved it (`retrieved_at`) and when it first received that value.

        `stale` applies decision D11: a rate is stale when Ledger last
        retrieved it 5 days (rates.stale_after) ago or longer
        (`not_retrieved_recently`), or when its date is more than that many
        whole days before today (`rate_date_too_old`). A stale rate is never
        used in a converted total. A rate dated before today is normal: a
        provider publishes on working days only, and the rate date says which
        day the rate is for (`date`). Rates stay listed, with their age, while the
        provider is disabled or unreachable.

        Ordered by provider, source, base currency and quote currency, then
        date newest first. A rate revised by the provider shows the value
        it replaced in `previous`.

        Administrators only (decision D-FX-R): the read-only role and tokens of
        a read-only owner get 403. Converted totals in the outlook and month
        views do not need this endpoint.
      tags: [rates]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: provider
          in: query
          description: Only rates of this provider adapter, for example frankfurter.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,31}$"
        - name: source
          in: query
          description: Only rates of this source key, exactly as listed, for example ECB.
          schema:
            type: string
            maxLength: 32
        - name: base
          in: query
          description: Only rates from this currency.
          schema:
            $ref: "#/components/schemas/Currency"
        - name: quote
          in: query
          description: Only rates to this currency.
          schema:
            $ref: "#/components/schemas/Currency"
        - name: date[gte]
          in: query
          description: Only rates dated on or after this date.
          schema:
            $ref: "#/components/schemas/Date"
        - name: date[lte]
          in: query
          description: Only rates dated on or before this date.
          schema:
            $ref: "#/components/schemas/Date"
      responses:
        "200":
          description: One page of cached rates.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CachedRate"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /rates/status:
    get:
      operationId: getRatesStatus
      x-ledger-access: rates:read
      summary: Exchange-rate provider and refresh status
      description: |
        Whether a rate provider is configured, which source it serves, the
        freshness policy (D11) and how the last refresh went. The provider is
        optional: this is reported here and in the
        ledger_rates_* metrics, and it never makes /readyz fail. The last run is
        what happened since the process started (null before the first run).
        Administrators only (decision D-FX-R), like the rates list.
      tags: [rates]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesStatus"
        default:
          $ref: "#/components/responses/Error"
  /rates/refreshes:
    post:
      operationId: refreshRates
      x-ledger-access: rates:write
      summary: Refresh the exchange rates now
      description: |
        Asks the rate provider for the latest rate from every currency in use
        (bank accounts, balances, commitments) to the reporting currency, and
        caches the answers: the same run the daily job makes. Administrators
        only (rates:write). It only ever adds to the cache.

        Bounded: the run stops when its time (below http.write_timeout) runs
        out, never overlaps another run (409 refresh_in_progress) and is
        limited to one a minute (429 rate_limited with Retry-After). A run
        that fails is still a 200: its `outcome` and `error` say how it ended
        (the provider's error kind and short code only), and the cache is
        left as it was. 409 rates_refresh_unavailable means no refresh can
        run: rates.enabled is false or no reporting currency is set. The
        request is audited as rates.refresh_requested.
      tags: [rates]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: No options; send nothing or an empty object.
      responses:
        "200":
          description: How the run ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesRefreshRun"
        default:
          $ref: "#/components/responses/Error"
  /settings:
    get:
      operationId: listSettings
      x-ledger-access: settings:read
      summary: List the runtime settings groups
      description: |
        The singleton runtime settings groups (ADR-0066) with their version,
        when they were last written (null while nothing was stored), whether any
        member is pinned by a configuration layer, and their apply state. Groups
        of the `integrations` grant (merchant_enrichment, pulse) are listed only to
        callers that also hold integrations:read. Always one page: the set is
        fixed. Keyed objects (decision providers and tasks), bank applications,
        consents and rules have routes of their own.
      tags: [settings]
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SettingsGroupSummary"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /settings/deployment:
    get:
      operationId: getDeploymentSettings
      x-ledger-access: settings:read
      summary: Deployment settings (read-only)
      description: |
        The configuration-only keys of ADR-0066 point 2 (database, listeners,
        timeouts, trusted proxies, log format, the key-encryption key and the
        keys that name a secret file) with the configuration layer each value
        comes from. They are never writable through the API. Secrets, secret-file
        paths and application identifiers are shown as set or unset only. The
        fixed policy constants (matching windows, outbox limits, refresh budget)
        are code, not configuration, and are not listed.
      tags: [settings]
      responses:
        "200":
          description: The deployment settings.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeploymentSetting"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /settings/{group}:
    parameters:
      - name: group
        in: path
        required: true
        description: A singleton settings group name.
        schema:
          $ref: "#/components/schemas/SettingsGroupName"
    get:
      operationId: getSettingsGroup
      x-ledger-access: settings:read
      summary: Get a settings group
      description: |
        The effective values of the group, with the version (also in ETag),
        the source of every member (default, api, or the configuration layer
        flag, environment, dotenv, yaml or file), the pinned members and the
        apply state. Precedence of a member's value, highest first: flags,
        environment, .env file, YAML file, the value stored through this API,
        the built-in default. A group always exists: until it is first written
        it is synthesised with version 1. Secrets are never returned; a secret
        member has read-only companions `<name>_set`, `<name>_set_at` and
        `<name>_source`. Groups of the `integrations` grant also need
        integrations:read. Unknown groups and keyed objects are 404.
      tags: [settings]
      responses:
        "200":
          description: The group.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsGroup"
        "403":
          description: The caller lacks the group's own grant (integrations:read for the integrations groups), besides the usual authorization refusals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettingsGroup
      x-ledger-access: settings:write
      summary: Change members of a settings group
      description: |
        A JSON Merge Patch (RFC 7396, ADR-0015) naming members exactly as the
        representation does (dotted names such as `refresh.interval` are flat
        members). A value sets the member; null removes the stored value, so
        the member falls back to configuration or the default. Needs the
        version in If-Match or the body; the first write to a group that has
        no stored row yet names version 1, and a concurrent first write loses
        with 409 version_conflict. An empty patch, or one that changes
        nothing, keeps the version and records nothing. The whole would-be
        configuration is validated with the rules startup uses (400
        validation_failed with one error per configuration key); the commit
        and its audit entry settings.updated (group and member names, never
        values) are one transaction. A member that a configuration layer sets
        is pinned: 409 setting_pinned names the keys and layers, never a value.
        Read-only members (version aside) are 400. Until the sign-in gate and
        sealed secrets land (task S2), every sensitive member and every secret
        is refused as not writable through the API yet (400), and so is the
        reporting zone until task S3 (reclassification, code
        reclassification_required). After the commit the group's component
        is notified; a failure to apply does not roll the setting back and is
        reported in apply_state. Groups of the `integrations` grant also need
        integrations:write.
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The group after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsGroup"
        "409":
          description: "Code `version_conflict` (stale version, with the current representation), `setting_pinned` (a named key is set by a configuration layer), `secret_unreadable` (a stored integration secret does not open with the current key; task S2) or `reclassification_required` (a zone change without reclassify: true; task S3)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: resetSettingsGroup
      x-ledger-access: settings:write
      summary: Reset a settings group to its defaults
      description: |
        Removes every stored member that no configuration layer pins, so each
        falls back to configuration or the default (the destroy of a Terraform
        settings resource). Stored values of pinned members are kept and apply
        again when the pin goes away. Needs If-Match. A group without a stored
        row changes nothing and keeps version 1. Audited as settings.reset
        (group and member names). The same gates as PATCH apply to stored
        sensitive members. The group stays: it always exists for the API.
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The group after the reset.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsGroup"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans:
    get:
      operationId: listDeferralPlans
      x-ledger-access: commitments:read
      summary: List deferral plans
      description: |
        Deferral plans (task DF1, ADR-0050), ordered by ID (creation order),
        active and undone, each with its adjustments and its occurrence's
        payment state today. Filter by occurrence_id, commitment_id, state
        (repeat a filter for any of several values) or planned_month (the
        month of the planned date, once).
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: occurrence_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: commitment_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/DeferralPlanState"
        - name: planned_month
          in: query
          schema:
            $ref: "#/components/schemas/YearMonth"
      responses:
        "200":
          description: One page of plans.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeferralPlan"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createDeferralPlan
      x-ledger-access: commitments:write
      summary: Defer an occurrence
      description: |
        Records the user's plan to pay an outstanding occurrence on a later
        date: within its month or in a later one. A plan is not payment,
        forgiveness or a creditor agreement unless its plan_type says so
        (creditor_agreed, documented_grace); it never changes the
        occurrence's due date, amount, payment evidence or status, so the
        occurrence stays outstanding and, past its original due date,
        overdue (decision D7). The monthly view plans its outstanding amount
        in the planned date's month instead of its own (never both). The
        occurrence must owe something (409 nothing_outstanding when paid or
        not recorded; 409 occurrence_cancelled when cancelled), have no
        active plan (409 deferral_plan_exists: revise or undo it), and the
        planned date must be after its due date and within the
        materialisation horizon (400 on planned_date). Audited as
        deferral_plan.created.
      tags: [deferral-plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [occurrence_id, plan_type, planned_date]
              properties:
                occurrence_id:
                  $ref: "#/components/schemas/ID"
                plan_type:
                  $ref: "#/components/schemas/DeferralPlanType"
                planned_date:
                  $ref: "#/components/schemas/Date"
                reason:
                  $ref: "#/components/schemas/DeferralReason"
      responses:
        "201":
          description: The new plan.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: The new plan's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getDeferralPlan
      x-ledger-access: commitments:read
      summary: Get a deferral plan
      tags: [deferral-plans]
      responses:
        "200":
          description: The plan with its adjustments.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: reviseDeferralPlan
      x-ledger-access: commitments:write
      summary: Revise a deferral plan
      description: |
        A JSON Merge Patch of plan_type, planned_date and reason (null
        clears the reason) on an active plan. The merged plan is checked as
        on creation against the occurrence as it is now (409
        nothing_outstanding once it is paid). An undone plan cannot change
        (409 deferral_plan_undone). Requires the version in If-Match or the
        body; a stale version is a 409 version_conflict with
        reconciliation. A patch that changes nothing answers the plan as it
        is. The revision is kept in the plan's history. Audited as
        deferral_plan.revised with the names of the changed fields.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plan_type:
                  $ref: "#/components/schemas/DeferralPlanType"
                planned_date:
                  $ref: "#/components/schemas/Date"
                reason:
                  $ref: "#/components/schemas/DeferralReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The revised plan.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}/undo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: undoDeferralPlan
      x-ledger-access: commitments:write
      summary: Undo a deferral plan
      description: |
        Ends an active plan: the occurrence's outstanding amount is planned
        in its own month again. Nothing about the occurrence or its payments
        changes. The plan and its history are kept (state undone) and never
        change again; the occurrence can be deferred anew. An optional
        reason is kept in the history. Refused with 409
        deferral_adjustments_unpaid while a fee or interest adjustment is
        still planned: mark it paid or remove it first, so a recorded fee never
        drops out of the planned totals. Requires the version in If-Match or
        the body. Audited as deferral_plan.undone.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  $ref: "#/components/schemas/DeferralReason"
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The undone plan.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: listDeferralPlanHistory
      x-ledger-access: commitments:read
      summary: List a deferral plan's history
      description: |
        Every change of the plan, oldest first: creation, revisions,
        adjustments added and removed, and the undo, each with the plan's
        type and planned date after it, who made it and how, and the reason
        recorded with it.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of history entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeferralPlanEvent"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}/adjustments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: addDeferralAdjustment
      x-ledger-access: commitments:write
      summary: Record a fee or charge on a deferral plan
      description: |
        Records an explicit fee, interest or other charge on an active plan
        (decision D14: a plan never adds one by itself). The amount is
        positive and in the plan's currency (400 on amount.currency; nothing
        is converted). It is added to the planned total of the plan's month
        while the occurrence still owes something; it never changes the
        occurrence's amount or what is outstanding. Requires the plan's
        version in If-Match or the body. Audited as
        deferral_plan.adjustment_added, without the amount or note.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, amount]
              properties:
                kind:
                  $ref: "#/components/schemas/DeferralAdjustmentKind"
                amount:
                  $ref: "#/components/schemas/PositiveMoney"
                note:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 500
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "201":
          description: The plan with the new adjustment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}/adjustments/{adjustment_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
      - name: adjustment_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    delete:
      operationId: removeDeferralAdjustment
      x-ledger-access: commitments:write
      summary: Remove an adjustment from a deferral plan
      description: |
        Removes an adjustment of an active plan: it is kept as history
        (removed_at) and no longer counts, whether or not it was marked paid. Removing it again is a 409
        deferral_adjustment_removed. A malformed adjustment_id is a 400. Requires the plan's version in
        If-Match. Audited as deferral_plan.adjustment_removed.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The plan after the removal.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}/adjustments/{adjustment_id}/paid:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
      - name: adjustment_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: markDeferralAdjustmentPaid
      x-ledger-access: commitments:write
      summary: Mark a deferral plan adjustment paid
      description: |
        Records that the person paid a fee or interest adjustment of an active
        plan (paid_at, paid_by). A recorded adjustment stays planned until it is
        marked paid or removed: paying the occurrence's principal does not
        settle it, and the marker is not payment evidence for the occurrence.
        Marking it again is a 409 deferral_adjustment_paid; a removed
        adjustment is a 409 deferral_adjustment_removed. Requires the plan's
        version in If-Match. Audited as deferral_plan.adjustment_paid, without
        amount or note.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The plan after marking the adjustment paid.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /deferral-plans/{id}/adjustments/{adjustment_id}/unpaid:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
      - name: adjustment_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: unmarkDeferralAdjustmentPaid
      x-ledger-access: commitments:write
      summary: Clear the paid marker of a deferral plan adjustment
      description: |
        Reverses marking an adjustment paid: it is planned again. An adjustment
        that is not marked paid is a 409 deferral_adjustment_not_paid. Requires
        the plan's version in If-Match. Audited as
        deferral_plan.adjustment_unpaid.
      tags: [deferral-plans]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The plan after clearing the marker.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferralPlan"
        default:
          $ref: "#/components/responses/Error"
  /categories:
    get:
      operationId: listCategories
      x-ledger-access: organisation:read
      summary: List categories
      description: |
        Categories (decision D12, ADR-0053): single-valued per object, with two levels (a category and its children). Archived ones are included unless archived=false.
        Items come in ID order (creation order).
      tags: [organisation]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: archived
          in: query
          description: Only archived (true) or only active (false) ones.
          schema:
            type: boolean
        - name: parent_id
          in: query
          description: Only the children of this category, or none for the top-level categories.
          schema:
            type: string
        - name: name[prefix]
          in: query
          description: Only names starting with this text, ignoring case.
          schema:
            type: string
      responses:
        "200":
          description: One page of categories.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganisationDefinition"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCategory
      x-ledger-access: organisation:write
      summary: Create a category
      description: |
        Creates a category at version 1. The name is trimmed and white space is
        collapsed; names are unique ignoring case among siblings (the top level counts as one parent), archived ones included
        (409 duplicate_name). Audited (organisation.definition_created with kind and
        via, never the name).
        A category with a parent_id becomes that category's child; the parent must be an
        active top-level category (a child cannot be a parent: 400 on parent_id; an
        archived parent: 409 definition_archived).
      tags: [organisation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                parent_id:
                  oneOf:
                    - $ref: "#/components/schemas/ID"
                    - type: "null"
      responses:
        "201":
          description: The created category.
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDefinition"
        "409":
          description: duplicate_name or definition_archived (the parent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getCategory
      x-ledger-access: organisation:read
      summary: Get a category
      tags: [organisation]
      responses:
        "200":
          description: The category.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDefinition"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCategory
      x-ledger-access: organisation:write
      summary: Rename or move a category
      description: |
        A JSON Merge Patch (RFC 7396) of the writable members: name, and parent_id (null makes it a top-level category). The id never
        changes, so every assignment follows a rename. An archived one may be
        renamed (that frees its name). The merged result is validated as a whole; a category with
        children cannot become a child. Requires the version in If-Match or the body;
        a stale version is a 409 version_conflict with reconciliation. A patch that changes
        nothing is a no-op. Audited (organisation.definition_updated with the names of the
        changed fields).
      tags: [organisation]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  $ref: "#/components/schemas/Version"
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                parent_id:
                  oneOf:
                    - $ref: "#/components/schemas/ID"
                    - type: "null"
      responses:
        "200":
          description: The changed category.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDefinition"
        "409":
          description: version_conflict, duplicate_name or definition_archived (the new parent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCategory
      x-ledger-access: organisation:write
      summary: Delete a category
      description: |
        Archive first: an archived category keeps every historical assignment. Deleting
        is for a category that nothing is assigned to; one that is still assigned is refused with
        409 definition_in_use unless reassign_to names an active category that the
        assignments move to (they become the person's own, origin user).
        A category with children is never deleted (409 conflict): delete or move the
        children first.
        Requires If-Match; a stale version is a 409 version_conflict. Audited
        (organisation.definition_deleted with kind, via and reassigned).
      tags: [organisation]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - name: reassign_to
          in: query
          description: The category the assignments move to.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [reassigned]
                properties:
                  reassigned:
                    type: integer
                    minimum: 0
                    description: How many assignments moved to the replacement.
        "409":
          description: version_conflict, definition_in_use, definition_archived (the replacement) or conflict (a category with children).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /categories/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
