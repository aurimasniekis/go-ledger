      operationId: setObjectCategory
      x-ledger-access: organisation:write
      summary: Set an object's category
      description: |
        Records the person's category (origin user), replacing any earlier one: a category is
        single-valued. A null category_id records that the person chose none. Rules and models
        never replace it, nor a "none" (the person's word stands through refreshes and automatic
        runs); DELETE hands the decision back. Last write wins (no If-Match); the audit log keeps
        the history (organisation.assignment_changed with change set or none, and the origin it
        replaced). An archived category is refused (409 definition_archived).
      tags: [organisation]
