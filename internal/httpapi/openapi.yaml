# Ledger Management API, version 1. This file is the contract (ADR-0011): it is
# written by hand, served at /api/v1/openapi.yaml and /api/v1/openapi.json, and
# TestOpenAPIContract fails when a registered /api/v1 route is missing here or a
# path here has no registered route. Change it in the same commit as the routes.
openapi: 3.1.1
info:
  title: Ledger Management API
  version: 1.0.0
  summary: Manage a personal Ledger instance.
  description: |
    Ledger shows paid, upcoming and overdue commitments and an outlook that
    compares commitments still due with bank balances. It is never a
    guarantee of money that is safe to spend.

    Conventions (ADR-0011):

    - **Base path** `/api/v1`. Backwards-incompatible changes get a new major
      version and base path; `info.version` follows semantic versioning.
    - **Identifiers** are ULIDs: 26 upper-case Crockford base32 characters,
      stable for the life of the object and never reused.
    - **Lists** return `{"items": [...], "next_cursor": "..."|null}`. Pass
      `limit` (1-200, default 50) and `cursor` (the previous
      `next_cursor`, valid only with the same filters). A walk is exact for
      items that existed when it began; items created during a walk may or
      may not appear (no snapshot; ID order holds to the millisecond). Filters are
      `field=value` (repeat for any of several values) and
      `field[op]=value` with `op` one of `prefix`, `gt`, `gte`, `lt`,
      `lte` where an endpoint documents it. Unknown parameters are rejected.
    - **Optimistic concurrency.** Mutable objects carry `version` (from 1)
      and the strong ETag `"<version>"`. Changing or deleting one requires
      that version in `If-Match` or, for a partial update, the body's
      `version` (DELETE: `If-Match` only): missing is 428, stale is 409
      `version_conflict` with `reconciliation` (the current version and,
      where allowed, the current object). `conflict` is any other 409.
    - **Partial updates** are JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017):
      `PATCH` with `Content-Type: application/merge-patch+json`; an absent
      member is unchanged, `null` clears an optional member, and nested
      objects merge member by member.
    - **Errors** use the `Error` envelope with a stable `code`.
    - **Access** (ADR-0021). Each operation states in `x-ledger-access`
      who may call it: `public` (no credentials), `authenticated` (any
      signed-in user or API token) or a grant `resource:action` such as
      `users:write`. A write grant also allows reading the same resource.
      No credentials, or wrong ones, is 401 `unauthenticated`; a missing
      grant is 403 `forbidden`. The `administrator` role holds every
      grant; `read-only` holds read on every resource that is not
      administrative and never a write. API tokens carry their own grants,
      limited by their owner's current role. `GET /grants` lists the
      vocabulary. `session` means a user signed in with the session
      cookie, acting on their own session, password or API tokens whatever their role;
      API tokens get 403 there.
    - **Sessions and CSRF** (ADR-0026). `POST /auth/sign-in` sets the
      `__Host-ledger_session` cookie (Secure, HttpOnly, SameSite=Strict) and returns
      a `csrf_token` (also from `GET /auth/session`). Every state-changing
      request made with the cookie must send it in `X-CSRF-Token` and come
      from Ledger's own origin, or it is 403 `csrf_failed`. Requests with
      an API token (`Authorization: Bearer`) need no CSRF token. Sessions
      end after an idle and an absolute timeout, on sign-out, when ended from
      another session, and (other sessions) when the password changes; the
      next request with an ended session is 401.
    - **Recent authentication.** Operations marked
      `x-ledger-recent-auth: true` (credential changes, user management;
      API token creation) need a password check within the
      re-authentication window when called with a session: otherwise 403
      `reauthentication_required`; confirm with
      `POST /auth/reauthenticate`. API tokens are exempt by design (their
      writes are audited as `token.write_used`).
    - **API tokens** (ADR-0029). Send `Authorization: Bearer ldgr_…`
      (`ldgr_` and 43 base62 characters). A request with an Authorization
      header is judged by it alone: a wrong, expired or revoked token is 401
      even with a valid session cookie. Tokens are created with a session
      (`POST /auth/tokens`) or on the host (`ledger token create`), shown
      once, and limited by their owner's current role on every request;
      revocation applies to the next request. Token requests skip
      two-factor and re-authentication, and each state-changing one is
      audited (`token.write_used`, `interactive_steps: skipped`).
    - **Two-factor authentication** (ADR-0030). A user may enrol a TOTP
      authenticator (RFC 6238: SHA-1, 6 digits, 30 s) under
      `/auth/two-factor`; enabling it returns recovery codes once. Sign-in
      then takes two steps: `POST /auth/sign-in` answers 202 with a
      challenge, and `POST /auth/sign-in/second-factor` takes a TOTP code
      or a recovery code and starts the session. When `auth.require_2fa`
      is on, a session whose user has no authenticator reaches only the
      operations marked `x-ledger-during-enrollment: true` (enrolment,
      the current session, re-authentication, sign-out); every other
      request is 403 `two_factor_enrollment_required`. API tokens skip
      interactive steps by design and are not affected.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
# Every operation needs a bearer API token or a session cookie, unless it
# says `security: []` (x-ledger-access: public).
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      x-ledger-access: public
      security: []
      summary: This document as JSON
      tags: [meta]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      x-ledger-access: public
      security: []
      summary: This document as YAML
      tags: [meta]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      x-ledger-access: authenticated
      summary: Who the request acts as
      description: The principal of the request and its effective grants, as evaluated for this request.
      tags: [access]
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        default:
          $ref: "#/components/responses/Error"
  /grants:
    get:
      operationId: getGrantVocabulary
      x-ledger-access: authenticated
      summary: The grant vocabulary and roles
      description: Every resource with its actions, and every role with the grants it holds. API tokens and MCP tools use the same grants.
      tags: [access]
      responses:
        "200":
          description: The vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantVocabulary"
        default:
          $ref: "#/components/responses/Error"
  /audit:
    get:
      operationId: listAuditEntries
      x-ledger-access: audit:read
      summary: List audit entries
      description: |
        The append-only audit log, oldest first (ID order). Administrators only.
        Entries record who did what to which object: sign-in successes and
        failures, two-factor changes, OIDC links, role changes, API token
        creation, revocation and write use, state-changing MCP calls (with the
        token's identity) and finance corrections. An entry has no free-form
        payload: `details` holds only the few non-secret fields its action
        declares. The attempted username of a failed sign-in is never recorded.
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: action
          in: query
          description: Only entries with these actions (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              maxLength: 64
        - name: action[prefix]
          in: query
          description: Only entries whose action starts with this text, for example `token.`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: actor_kind
          in: query
          description: Only entries by these kinds of actor (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AuditActorKind"
        - name: actor_user_id
          in: query
          description: Only entries by this user, or by a token this user owns.
          schema:
            $ref: "#/components/schemas/ID"
        - name: actor_token_id
          in: query
          description: Only entries made with this API token.
          schema:
            $ref: "#/components/schemas/ID"
        - name: target_type
          in: query
          schema:
            type: string
            maxLength: 32
        - name: target_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: at[gte]
          in: query
          description: Only entries at or after this time.
          schema:
            type: string
            format: date-time
        - name: at[lt]
          in: query
          description: Only entries before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One page of audit entries in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      x-ledger-access: users:read
      summary: List users
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          description: Only users with these roles (repeat for any of several).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Role"
        - name: disabled
          in: query
          description: Only disabled (true) or enabled (false) users.
          schema:
            type: string
            enum: ["true", "false"]
        - name: username[prefix]
          in: query
          description: Only users whose username starts with this text.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: One page of users in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      x-ledger-access: users:write
      x-ledger-recent-auth: true
      summary: Create a user
      description: |
        Creates an enabled user with a role. Audited (user.created). A taken
        username is a 409 conflict. Credentials (password, 2FA, OIDC link) are
        set up separately.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, role]
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                display_name:
                  description: Optional; null is the same as leaving it out.
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 100
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getUser
      x-ledger-access: users:read
      summary: Get a user
      tags: [users]
      responses:
        "200":
          description: The user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      x-ledger-access: users:write
      x-ledger-recent-auth: true
      summary: Change, disable or re-enable a user, or change their role
      description: |
        A JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017). display_name is
        optional (null clears it); username, role and disabled are required
        and cannot be null. Requires the version in If-Match or the body; a
        stale version is a 409 version_conflict with reconciliation. An empty
        patch is a no-op. Role changes (user.role_changed with from and to),
        disabling (user.disabled), re-enabling (user.enabled) and profile
        changes (user.updated) are audited. A change that would leave no
        enabled administrator is a 409 conflict. Users are never deleted:
        disable them instead, which keeps audit history and token ownership
        intact. A disabled user's sessions and tokens stop working on their
        next request.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                display_name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 100
                role:
                  $ref: "#/components/schemas/Role"
                disabled:
                  type: boolean
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The changed user.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /commitments:
    get:
      operationId: listCommitments
      x-ledger-access: commitments:read
      summary: List commitment definitions
      tags: [commitments]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          description: Only commitments of these kinds (repeat for any of several).
          schema:
            $ref: "#/components/schemas/CommitmentKind"
        - name: priority
          in: query
          description: Only commitments with these priorities (repeat for any of several).
          schema:
            $ref: "#/components/schemas/CommitmentPriority"
        - name: currency
          in: query
          description: Only commitments in these currencies (repeat for any of several).
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: One page of commitments in ID order.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Commitment"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCommitment
      x-ledger-access: commitments:write
      summary: Record a recurring commitment
      description: |
        Records a recurring commitment definition (ADR-0024). The definition
        is user data, kept apart from bank facts and from dated occurrences
        and payment state, which are derived from it. Every invalid field is
        reported: the first in field and message, all of them in errors.
        Audited (commitment.created with kind and currency).
      tags: [commitments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, amount, schedule, start_date]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  $ref: "#/components/schemas/CommitmentKind"
                amount:
                  $ref: "#/components/schemas/PositiveMoney"
                schedule:
                  $ref: "#/components/schemas/Schedule"
                start_date:
                  $ref: "#/components/schemas/Date"
                end_date:
                  description: The last day the commitment applies (inclusive); null for open-ended. Not before start_date.
                  oneOf:
                    - $ref: "#/components/schemas/Date"
                    - type: "null"
                priority:
                  description: Optional; null when not prioritised.
                  oneOf:
                    - $ref: "#/components/schemas/CommitmentPriority"
                    - type: "null"
                notes:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        default:
          $ref: "#/components/responses/Error"
  /commitments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getCommitment
      x-ledger-access: commitments:read
      summary: Get a commitment definition
      tags: [commitments]
      responses:
        "200":
          description: The commitment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCommitment
      x-ledger-access: commitments:write
      summary: Change a commitment definition
      description: |
        A JSON Merge Patch (RFC 7396, ADR-0015, ADR-0017) of the writable
        members. amount and schedule merge member by member, so
        {"schedule":{"day":20}} changes only the day; to switch a schedule
        between monthly and annual, send the whole schedule: every member of
        the new form, plus an explicit null for each member of the old form that
        does not apply (interval for monthly, month for annual). A member left
        out of the patch keeps its old value, so the nulls are required.
        end_date, priority and notes are optional (null clears them); name,
        kind, amount, schedule and start_date cannot be null. The merged
        result is validated as a whole and every invalid field is reported.
        Requires the version in If-Match or the body; a stale version is a
        409 version_conflict with reconciliation. An empty patch, or one
        that changes nothing, is a no-op. Audited (commitment.updated with
        the names of the changed fields).

        A change to amount, schedule, start_date or end_date also reaches
        the commitment's occurrences (decision D6, ADR-0027) in the same
        transaction, from effective_from forward: unpaid occurrences due on
        or after it are rewritten in place (same id), removed when the new
        terms no longer schedule that month, or added; unpaid occurrences
        due before it and every paid occurrence stay as they are. The one
        exception is a start_date or end_date change (decision D23): it
        always removes the unpaid occurrences left outside the new
        [start_date, end_date], whatever the effective date. Occurrences with
        payment evidence (a payment or a confirmed match) or a status override
        of any state are never removed; the audit counts the latter as
        kept_override. Without
        effective_from the change applies from today in the reporting time
        zone, so overdue unpaid occurrences keep their terms. Audited as
        occurrences.regenerated with the effective date and the counts
        created, updated, removed, kept_paid, kept_history and
        removed_out_of_range (the D23 removals).

        An effective_from after today is allowed and recorded as pending.
        Until that date passes, a later change to these terms whose effective
        date is earlier than the pending one is refused with 409
        pending_terms_change (field effective_from): the definition holds only
        the latest terms, so it would overwrite the older terms of the months
        in between. Retry with effective_from on or after the pending date. An
        edit effective on or after the pending date supersedes it.
      tags: [commitments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  $ref: "#/components/schemas/Version"
                effective_from:
                  description: |
                    Not a member of the commitment: the first date from which
                    changed terms reach occurrences. Defaults to today in the
                    reporting time zone. At most 60 months after the current
                    month.
                  allOf:
                    - $ref: "#/components/schemas/Date"
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                kind:
                  $ref: "#/components/schemas/CommitmentKind"
                amount:
                  $ref: "#/components/schemas/MoneyPatch"
                schedule:
                  $ref: "#/components/schemas/SchedulePatch"
                start_date:
                  $ref: "#/components/schemas/Date"
                end_date:
                  description: The last day the commitment applies (inclusive); null for open-ended. Not before start_date.
                  oneOf:
                    - $ref: "#/components/schemas/Date"
                    - type: "null"
                priority:
                  description: Optional; null when not prioritised.
                  oneOf:
                    - $ref: "#/components/schemas/CommitmentPriority"
                    - type: "null"
                notes:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: The changed commitment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        "409":
          description: |
            version_conflict (stale version, with reconciliation) or
            pending_terms_change (an earlier edit takes effect after this
            edit's effective_from).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCommitment
      x-ledger-access: commitments:write
      summary: Delete a commitment definition
      description: |
        Deletes the definition and its unpaid occurrences (derived data).
        Requires If-Match; a stale version is a 409 version_conflict.
        Audited (commitment.deleted). A commitment with an occurrence that
        has payment evidence (a manual payment, ADR-0031) cannot be deleted
        (409 conflict); set end_date to stop it instead.
      tags: [commitments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    put:
      operationId: setUserPassword
      x-ledger-access: users:write
      x-ledger-recent-auth: true
      summary: Set a user's password
      description: |
        Sets the user's password (minimum length in bytes, no composition
        rules) and ends every session of that user, except the caller's own
        current session when they set their own password. Audited
        (auth.password_changed with by and sessions_ended); the password is
        never recorded.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          description: The password was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSet"
        default:
          $ref: "#/components/responses/Error"
  /auth/sign-in:
    post:
      operationId: signIn
      x-ledger-access: public
      security: []
      summary: Sign in with a username and password
      description: |
        Starts a session: sets the `__Host-ledger_session` cookie (Secure, HttpOnly,
        SameSite=Strict, Path=/) and returns the session with its CSRF token.
        Every failure (unknown user, wrong password, no password set,
        disabled account) is the same 401 `invalid_credentials` after the
        same work. Too many failures for the username or from the client
        address within the window are 429 `rate_limited` with Retry-After.
        A browser request from another origin is 403 `csrf_failed`. Success
        and failure are audited; a failure never records the username.
        When `auth.password.enabled` is false, every request is 403
        `password_sign_in_disabled` before any check: sign in with
        `GET /auth/oidc/authorize`.

        When the user has TOTP enabled, a right password starts no session:
        the answer is 202 with a challenge for
        `POST /auth/sign-in/second-factor`, valid for five minutes. Only
        a complete sign-in clears the username's failure count.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 256
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "202":
          description: The password was right; a second factor must follow. No cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorChallenge"
        default:
          $ref: "#/components/responses/Error"
  /auth/sign-in/second-factor:
    post:
      operationId: signInSecondFactor
      x-ledger-access: public
      security: []
      summary: Complete a sign-in with a TOTP code or a recovery code
      description: |
        The second step of a sign-in for a user with TOTP enabled. Send the
        challenge from `POST /auth/sign-in` and exactly one of `code`
        (from the authenticator; accepted within one 30-second step either
        side, and only once) or `recovery_code` (consumed by its use). On
        success the session starts exactly as after a password-only sign-in.
        A wrong, malformed or reused code is 401 `invalid_second_factor` and
        counts towards the same per-username and per-address limits as a
        wrong password (429 `rate_limited` with Retry-After); a challenge
        takes at most five wrong codes. An unknown, expired or used-up
        challenge is 401 `unauthenticated`: sign in again. A browser
        request from another origin is 403 `csrf_failed`. Audited
        (auth.signin_succeeded and auth.signin_failed with method totp or
        recovery_code).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge]
              properties:
                challenge:
                  type: string
                  maxLength: 128
                code:
                  type: string
                  description: The 6-digit code from the authenticator.
                  examples: ["123456"]
                recovery_code:
                  type: string
                  format: password
                  description: One unused recovery code, with or without its dashes.
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        default:
          $ref: "#/components/responses/Error"
  /auth/sign-out:
    post:
      operationId: signOut
      x-ledger-access: session
      x-ledger-during-enrollment: true
      summary: End the current session
      description: Ends the session the request was made with and clears the cookie. Audited (auth.session_ended, reason signed_out).
      tags: [auth]
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      operationId: getCurrentSession
      x-ledger-access: session
      x-ledger-during-enrollment: true
      summary: The current session and its CSRF token
      tags: [auth]
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      operationId: listMySessions
      x-ledger-access: session
      summary: List your active sessions
      description: The signed-in user's sessions that have not ended, newest first. Never includes session tokens.
      tags: [auth]
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    delete:
      operationId: endMySession
      x-ledger-access: session
      summary: End one of your sessions
      description: |
        Ends the session; its next request is 401. Ending the current session
        signs out and clears the cookie. Another user's session is 404.
        Audited (auth.session_ended, reason terminated or signed_out).
      tags: [auth]
      responses:
        "204":
          description: Ended.
        default:
          $ref: "#/components/responses/Error"
  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      x-ledger-access: session
      x-ledger-during-enrollment: true
      summary: Confirm your password for sensitive actions
      description: |
        Checks the signed-in user's password again; when it matches, the
        session counts as recently authenticated until recent_auth_until. A
        wrong password is 403 `invalid_credentials` (the session stays
        valid) and counts towards the sign-in limits (429 with Retry-After).
        403 `password_sign_in_disabled` when `auth.password.enabled` is
        false: use `POST /auth/oidc/reauthenticate`. Audited
        (auth.reauthenticated, auth.reauthentication_failed).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated_at, recent_auth_until]
                properties:
                  authenticated_at:
                    type: string
                    format: date-time
                  recent_auth_until:
                    type: string
                    format: date-time
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    put:
      operationId: changeMyPassword
      x-ledger-access: session
      x-ledger-recent-auth: true
      summary: Change your password
      description: |
        Sets the signed-in user's password (minimum length in bytes, no
        composition rules) and ends every other session of the user; the
        current session stays. Audited (auth.password_changed, by self).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSet"
        default:
          $ref: "#/components/responses/Error"
  /auth/methods:
    get:
      operationId: getSignInMethods
      x-ledger-access: public
      security: []
      summary: Which sign-in methods are available
      description: |
        Tells the sign-in page what to offer: password sign-in (off when
        `auth.password.enabled` is false) and single sign-on with the
        configured OpenID Connect provider (ADR-0033).
      tags: [auth]
      responses:
        "200":
          description: The methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/authorize:
    get:
      operationId: startOIDCSignIn
      x-ledger-access: public
      security: []
      summary: Sign in with single sign-on (browser redirect)
      description: |
        Starts an authorization code flow with PKCE (S256), state and nonce,
        and redirects the browser (303) to the identity provider. The state
        is also set in the `__Host-ledger_oidc` cookie (Secure, HttpOnly,
        SameSite=Lax, ten minutes), which the callback must present. When
        single sign-on is not configured or the provider cannot be reached,
        the browser is sent to `/sign-in?oidc_error=not_configured` or
        `provider_unavailable` instead. Starts are limited per client address
        (20 a minute): beyond that the browser is sent to
        `/sign-in?oidc_error=rate_limited` with a Retry-After header, so a
        flood cannot push pending sign-ins out of the store. Never JSON.
      tags: [auth]
      parameters:
        - name: return_to
          in: query
          required: false
          description: A same-origin path to go to after signing in; anything else means /.
          schema:
            type: string
            maxLength: 512
      responses:
        "303":
          description: To the identity provider, or to the sign-in page with oidc_error.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      x-ledger-access: public
      security: []
      summary: Where the identity provider sends the browser back (browser redirect)
      description: |
        Completes a sign-in, link or re-authentication started by Ledger.
        The state must match a pending request (single use, ten minutes) and
        the `__Host-ledger_oidc` cookie. The code is redeemed with the PKCE
        verifier, and the ID token must pass: its signature against the
        provider's keys, issuer, an audience of exactly this client, azp
        when present, nonce, expiry, an iat within this request (with
        `auth.oidc.clock_skew`), a non-empty subject and, for
        re-authentication, a fresh auth_time. The account is found by the
        (issuer, subject) pair only, never by email address.

        Sign-in: an identity linked to no account is refused unless
        `auth.oidc.provisioning.enabled` is true. Success sets the session
        cookie (an ordinary session, method oidc) and redirects to the
        request's return path. With `auth.oidc.require_2fa` and TOTP
        enabled, it redirects to `/sign-in#second_factor=<challenge>` for
        `POST /auth/sign-in/second-factor`. A failure redirects to
        `/sign-in?oidc_error=<code>`: not_configured, invalid_state,
        access_denied, invalid_response, provider_unavailable, not_linked,
        sign_in_failed or internal_error.

        Link and re-authentication: redirect back to the return path with
        `oidc=linked` or `oidc=reauthenticated`, or with `oidc_error`
        (also already_linked, session_ended, identity_mismatch).

        Audited: auth.signin_succeeded and auth.signin_failed (method oidc;
        reasons identity_not_linked, invalid_credentials, account_disabled),
        oidc.linked, auth.reauthenticated and auth.reauthentication_failed;
        provisioning adds user.created. Never JSON.
      tags: [auth]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Signed in, linked or re-authenticated, or a failure; see the description.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The session cookie after a sign-in; always clears the single-sign-on cookie.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/link:
    get:
      operationId: getMyOIDCLink
      x-ledger-access: session
      summary: Your single-sign-on link
      description: Shown even when single sign-on is no longer configured, so a stale link stays visible.
      tags: [auth]
      responses:
        "200":
          description: The link, or linked false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCLink"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startOIDCLink
      x-ledger-access: session
      x-ledger-recent-auth: true
      summary: Link a single-sign-on identity to your account
      description: |
        Starts linking: returns the provider's authorization URL for the
        browser to visit, and sets the `__Host-ledger_oidc` cookie. The
        callback links the identity, keyed by issuer and subject, to this
        account if this session is still live. An account has one link: 409
        `conflict` when it already has one (unlink first), and the callback
        answers already_linked when the identity belongs to another account.
        Linking never disables password sign-in. 404 `not_found` when
        single sign-on is not configured; 503 when the provider is
        unavailable. Audited at the callback (oidc.linked, by self).
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnTo"
      responses:
        "200":
          description: Visit authorization_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationURL"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlinkMyOIDC
      x-ledger-access: session
      x-ledger-recent-auth: true
      summary: Remove your single-sign-on link
      description: |
        Needs another sign-in method to remain: 409 `conflict` unless the
        account has a password and password sign-in is enabled (the host
        command `ledger auth unlink-oidc` can always remove it). Sessions
        already started stay. 404 when there is no link. Audited
        (oidc.unlinked, by self).
      tags: [auth]
      responses:
        "204":
          description: Unlinked.
        default:
          $ref: "#/components/responses/Error"
  /auth/oidc/reauthenticate:
    post:
      operationId: startOIDCReauthentication
      x-ledger-access: session
      x-ledger-during-enrollment: true
      summary: Re-authenticate with the identity provider for sensitive actions
      description: |
        Returns the provider's authorization URL with prompt=login and
        max_age=0; the callback requires a fresh auth_time and the identity
        linked to this account, then counts the session as recently
        authenticated (as `POST /auth/reauthenticate` does with a
        password). The way to re-authenticate when password sign-in is
        disabled. 409 `conflict` when the account has no link; 404 when
        single sign-on is not configured.
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnTo"
      responses:
        "200":
          description: Visit authorization_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationURL"
        default:
          $ref: "#/components/responses/Error"
  /auth/recovery-sign-in:
    get:
      operationId: recoverySignInPage
      x-ledger-access: public
      security: []
      summary: Confirmation page of a recovery sign-in link (HTML)
      description: |
        Break-glass (decision D16): the link printed by the host command
        `ledger auth recovery-sign-in`. This request changes nothing, so a
        link previewer cannot use up the token: it answers a small HTML page
        whose button posts the token to the same path.
      tags: [auth]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "303":
          description: Signed in, or a failure.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: recoverySignIn
      x-ledger-access: public
      security: []
      summary: Use a one-time recovery sign-in link (browser redirect)
      description: |
        Sent by the confirmation page as a form post
        (application/x-www-form-urlencoded, field token). The token works
        once, expires (15 minutes by default), skips the second factor and
        works whether or not password sign-in is enabled. Success sets the
        session cookie (method recovery) and redirects to /; any failure
        redirects to `/sign-in?recovery_error=invalid_or_expired`. A
        cross-origin browser request is refused (403). Audited
        (auth.signin_succeeded and auth.signin_failed, method
        recovery_sign_in). Never JSON.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 128
      responses:
        "303":
          description: Signed in, or a failure.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor:
    get:
      operationId: getMyTwoFactor
      x-ledger-access: session
      x-ledger-during-enrollment: true
      summary: Your two-factor authentication status
      tags: [auth]
      responses:
        "200":
          description: The status. Never includes secrets or recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disableMyTwoFactor
      x-ledger-access: session
      x-ledger-recent-auth: true
      summary: Disable your two-factor authentication
      description: |
        Removes the authenticator and every recovery code. 409 `conflict`
        when TOTP is not enabled, or when `auth.require_2fa` is on (enrol a
        new authenticator to replace it instead; the host command
        `ledger auth reset-2fa` can still remove it). Audited
        (two_factor.disabled, by self).
      tags: [auth]
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor/totp:
    post:
      operationId: startTOTPEnrollment
      x-ledger-access: session
      x-ledger-recent-auth: true
      x-ledger-during-enrollment: true
      summary: Start enrolling a TOTP authenticator
      description: |
        Generates a new secret and returns it, with its otpauth:// URI for a
        QR code. This is the only time the secret is shown; it is stored
        encrypted. Confirm with a code from the authenticator within ten
        minutes (`POST /auth/two-factor/totp/confirm`). Starting again
        replaces an unconfirmed enrolment. An enabled authenticator keeps
        working until the new one is confirmed, so this also replaces one.
        503 `dependency_unavailable` when no key-encryption key is
        configured.
      tags: [auth]
      responses:
        "201":
          description: The enrolment was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor/totp/confirm:
    post:
      operationId: confirmTOTPEnrollment
      x-ledger-access: session
      x-ledger-recent-auth: true
      x-ledger-during-enrollment: true
      summary: Confirm a TOTP enrolment and receive recovery codes
      description: |
        Checks a code from the authenticator against the started enrolment.
        When it matches, TOTP is enabled (replacing an earlier
        authenticator), ten new recovery codes are returned (shown only
        here; earlier codes stop working) and every other session of the
        user ends; the current session stays and is no longer confined by
        `auth.require_2fa`. A wrong code is 400 `invalid_second_factor`;
        no started or an expired enrolment is 409 `conflict`. Audited
        (two_factor.enabled).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  examples: ["123456"]
      responses:
        "200":
          description: TOTP is enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /auth/two-factor/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      x-ledger-access: session
      x-ledger-recent-auth: true
      summary: Replace your recovery codes
      description: |
        Issues ten new recovery codes, shown only here; every earlier code
        stops working. 409 `conflict` when TOTP is not enabled. Audited
        (two_factor.recovery_codes_regenerated).
      tags: [auth]
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Error"
  /occurrences:
    get:
      operationId: listOccurrences
      x-ledger-access: commitments:read
      summary: List the occurrences of a reporting month
      description: |
        The dated occurrences of every commitment in one month of the
        reporting time zone (decision D5), generated from the definitions
        (ADR-0027): a day past the end of a month falls on its last day, an
        annual February 29 falls on February 28 in common years, and a
        scheduled date before start_date or after end_date is not an
        occurrence. Reading a month first materialises every commitment
        through it; materialised months are never regenerated by a read, so
        repeated reads return the same occurrences. Each occurrence carries
        its payment state, derived when read from payment evidence and
        dates (decision D7, ADR-0031). Months more than 60 months after the
        current month are refused.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: month
          in: query
          required: true
          description: The reporting month, given once.
          schema:
            $ref: "#/components/schemas/YearMonth"
        - name: commitment_id
          in: query
          description: Only occurrences of these commitments (repeat for any of several).
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: One page of occurrences ordered by due date, then ID.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Occurrence"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /occurrences/summary:
    get:
      operationId: getOccurrencesSummary
      x-ledger-access: commitments:read
      summary: Get the monthly view of one reporting month
      description: |
        Every occurrence of the month (the same ones, in the same order, as
        listOccurrences, but all of them in one response, not paged) with its
        derived payment state, and exact totals per currency (ADR-0034).
        Totals are computed on the server with exact decimals and are never
        summed across currencies: each currency has its own entry.

        due is the sum of the occurrence amounts; paid the sum of payment
        evidence in that currency; outstanding what is still owed (with an
        "unpaid" status override the evidence still counts in paid while
        outstanding is the full amount, so paid + outstanding can exceed due);
        overdue the
        part of outstanding on occurrences past their original due date (a
        documented grace period does not reduce it); overpaid evidence above
        an amount. They describe recorded commitments and recorded payments
        only: they are not a statement of money that is safe to spend.

        freshness says how current the view is. Statuses are derived on every
        read (computed_at, as_of). occurrences_changed_at is when the month's
        occurrences last changed. Bank data age is not exposed by this
        endpoint yet (bank.available is false).

        Months more than 60 months after the current month are refused.
      tags: [occurrences]
      parameters:
        - name: month
          in: query
          required: true
          description: The reporting month, given once.
          schema:
            $ref: "#/components/schemas/YearMonth"
      responses:
        "200":
          description: The month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthSummary"
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getOccurrence
      x-ledger-access: commitments:read
      summary: Get an occurrence
      tags: [occurrences]
      responses:
        "200":
          description: The occurrence.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Error"
  /auth/tokens:
    get:
      operationId: listMyTokens
      x-ledger-access: session
      summary: List your API tokens
      description: |
        The signed-in user's API tokens in ID order, including expired and
        revoked ones (see status). Never includes the tokens themselves, only
        a hint (prefix, first and last characters).
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMyToken
      x-ledger-access: session
      x-ledger-recent-auth: true
      summary: Create an API token
      description: |
        Creates a token owned by the signed-in user and returns it once, in
        `secret`; it is never shown again (the response is `Cache-Control:
        no-store`). Send it as `Authorization: Bearer ldgr_…`.

        Give `grants` (at least one), or `root: true` for a root token, which
        holds every grant its owner's role holds, including grants added in
        later versions; the response then carries a `warning`. Grants the
        caller does not hold, or a root token requested by anyone who does
        not hold every grant, are 403 `forbidden` (no escalation). An
        unknown grant is 400. `expires_at` is optional; without it the
        token never expires.

        Requests made with a token skip two-factor and re-authentication;
        each state-changing one is audited (`token.write_used`). A token is
        limited by its owner's current role on every request. API tokens
        cannot create tokens. Audited (`token.created`, never the token).
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApiToken"
      responses:
        "201":
          description: Created. This is the only time the token is shown.
          headers:
            Location:
              description: The new token's URL under /auth/tokens.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        default:
          $ref: "#/components/responses/Error"
  /auth/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getMyToken
      x-ledger-access: session
      summary: Get one of your API tokens
      description: Another user's token is 404.
      tags: [tokens]
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeMyToken
      x-ledger-access: session
      summary: Revoke one of your API tokens
      description: |
        Revokes the token at once: its next request is 401. Revoking a
        revoked token changes nothing (204). Another user's token is 404.
        Audited (`token.revoked`).
      tags: [tokens]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /tokens:
    get:
      operationId: listTokens
      x-ledger-access: tokens:read
      summary: List every user's API tokens
      description: |
        All API tokens in ID order, including expired and revoked ones.
        Administrative. Never includes the tokens themselves.
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: owner_id
          in: query
          description: Only this user's tokens.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenPage"
        default:
          $ref: "#/components/responses/Error"
  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getToken
      x-ledger-access: tokens:read
      summary: Get any user's API token
      tags: [tokens]
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeToken
      x-ledger-access: tokens:write
      summary: Revoke any user's API token
      description: |
        Revokes the token at once: its next request is 401. Revoking a
        revoked token changes nothing (204). Audited (`token.revoked`).
      tags: [tokens]
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}/manual-payments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: listManualPayments
      x-ledger-access: commitments:read
      summary: List an occurrence's manual payments
      description: Ordered by paid_on, then ID.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of manual payments.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManualPayment"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: recordManualPayment
      x-ledger-access: commitments:write
      summary: Record a manual payment
      description: |
        Records a payment the user made by hand. It is user data, kept apart
        from bank facts and from match links, and it is payment evidence: the
        occurrence's status is derived again (paid when the payments in its
        currency cover its amount, partially_paid below that), the
        occurrence becomes immutable to commitment edits, and the commitment
        can no longer be deleted. The amount must be positive and in the
        occurrence's currency (amounts are never converted); paid_on must
        not be after today in the reporting zone. Like every create it needs
        no version; the occurrence's version increases. Audited as
        manual_payment.recorded (identifier and currency, never the amount
        or note). Records are not edited: delete a mistaken one and record
        it again.
      tags: [occurrences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualPaymentInput"
      responses:
        "201":
          description: The recorded payment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: The new payment's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPayment"
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}/manual-payments/{payment_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
      - name: payment_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getManualPayment
      x-ledger-access: commitments:read
      summary: Get a manual payment
      tags: [occurrences]
      responses:
        "200":
          description: The payment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualPayment"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteManualPayment
      x-ledger-access: commitments:write
      summary: Delete a manual payment
      description: |
        Removes the payment record; the occurrence's status is derived
        again from the evidence that remains and its version increases. A
        "paid" override stays recorded but has no effect without evidence
        (override.applied is false). Requires the payment's version in
        If-Match. Audited as manual_payment.deleted.
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The payment was deleted.
        default:
          $ref: "#/components/responses/Error"
  /occurrences/{id}/status-override:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    put:
      operationId: setOccurrenceStatusOverride
      x-ledger-access: commitments:write
      summary: Set a manual status override
      description: |
        Overrides the derived status with a reason (decision D7). "paid"
        marks the occurrence settled although the counted evidence does not
        cover it (for example a payment in another currency, which is never
        converted); it needs payment evidence and is refused with 409
        payment_evidence_required without it. "unpaid" says the evidence
        does not settle it: the status follows the dates. An active
        override is replaced, and DELETE restores it. Requires the
        occurrence's version in If-Match or the body; the version increases.
        Audited as occurrence.status_overridden (status and previous status;
        the reason is not copied to the audit log).
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status:
                  $ref: "#/components/schemas/OverrideStatus"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                version:
                  $ref: "#/components/schemas/Version"
      responses:
        "200":
          description: The occurrence with its new payment state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: undoOccurrenceStatusOverride
      x-ledger-access: commitments:write
      summary: Undo the manual status override
      description: |
        The undo of the last override change: the active override is marked
        undone and the override it replaced, if any, becomes active again;
        otherwise the derived status applies. Repeating it walks further back.
        404 when no override is active. Requires the occurrence's version in
        If-Match; the version increases. Audited as
        occurrence.status_override_undone (undone and restored status).
      tags: [occurrences]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The occurrence with its restored payment state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Error"
tags:
  - name: meta
    description: The API description itself.
  - name: access
    description: Who the caller is and the grant vocabulary.
  - name: users
    description: User accounts and roles (administrative).
  - name: audit
    description: The append-only audit log (administrative, read-only).
  - name: commitments
    description: Recurring commitment definitions.
  - name: auth
    description: Sign-in, sessions, re-authentication and your own password.
  - name: occurrences
    description: Dated occurrences generated from commitment definitions, their payment state, manual payments and status overrides.
  - name: tokens
    description: API tokens (Authorization Bearer); your own, and everyone's for administrators.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token (ldgr_ followed by 43 characters) in Authorization Bearer. Which operations a token may call follows its grants; see x-ledger-access.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ledger_session
      description: The browser session cookie set by sign-in. State-changing requests made with it also send X-CSRF-Token.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page. Opaque; valid only with the same filters.
      schema:
        type: string
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      description: The ETag of the version this change is based on. Required for DELETE; for a PATCH it may be given as the body's version instead.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  headers:
    ETag:
      description: The object's version as a strong entity tag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    RequestID:
      description: The request ID, also in the error body.
      schema:
        type: string
  schemas:
    CommitmentKind:
      type: string
      enum: [service, server, domain, subscription, debt_repayment]
      description: What the commitment pays for. server covers servers and VPSs.
    CommitmentPriority:
      type: string
      enum: [essential, important, flexible]
      description: How important paying on time is (decision D14, three levels).
    Currency:
      type: string
      description: An ISO 4217 currency code, three upper-case letters.
      pattern: "^[A-Z]{3}$"
      examples: ["EUR"]
    Decimal:
      type: string
      description: An exact decimal number as a string, keeping its scale ("12.50"). Never a JSON number.
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      examples: ["12.50"]
    PositiveDecimal:
      type: string
      description: An exact decimal number as a string, greater than zero, keeping its scale ("12.50"). Never a JSON number.
      pattern: "^([1-9][0-9]*(\\.[0-9]+)?|0\\.[0-9]*[1-9][0-9]*)$"
      examples: ["12.50"]
    Money:
      type: object
      description: An exact amount of zero or more with its currency (ADR-0005), keeping its scale. It is never converted.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: An exact decimal number as a string, zero or more ("0.00", "12.50"). Never a JSON number.
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
        currency:
          $ref: "#/components/schemas/Currency"
    PositiveMoney:
      type: object
      description: An exact amount greater than zero with its currency (ADR-0005). It is never converted.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        currency:
          $ref: "#/components/schemas/Currency"
    MoneyPatch:
      type: object
      description: Merge-patch form of PositiveMoney, only in a commitment PATCH body. Members that are sent replace the stored ones; the merged amount is validated as a whole.
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        currency:
          $ref: "#/components/schemas/Currency"
    SchedulePatch:
      type: object
      description: |
        Merge-patch form of Schedule, only in a commitment PATCH body. No
        member is required; a member set to null is removed, which is how a
        schedule switches between monthly and annual. The merged schedule is
        validated as a whole against the Schedule schema.
      additionalProperties: false
      properties:
        version:
          type: integer
          const: 1
        frequency:
          type: string
          enum: [monthly, annual]
        interval:
          type: [integer, "null"]
          minimum: 1
          maximum: 120
        month:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        day:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
    Date:
      type: string
      format: date
      description: A calendar date, YYYY-MM-DD. A commitment's start_date must not be before 1900-01-01.
      examples: ["2026-11-20"]
    Schedule:
      description: |
        When a commitment falls due: a versioned schedule spec (ADR-0024).
        version is 1, the only version; a later version is added beside it,
        never by changing what version 1 means. Calendar rules (decision
        D6): a day past the end of a month falls on that month's last day,
        and an annual February 29 falls on February 28 in years that are not
        leap years. A monthly schedule counts its interval from the month of
        start_date.
      oneOf:
        - $ref: "#/components/schemas/MonthlySchedule"
        - $ref: "#/components/schemas/AnnualSchedule"
      discriminator:
        propertyName: frequency
        mapping:
          monthly: "#/components/schemas/MonthlySchedule"
          annual: "#/components/schemas/AnnualSchedule"
    MonthlySchedule:
      type: object
      additionalProperties: false
      required: [version, frequency, interval, day]
      properties:
        version:
          type: integer
          const: 1
        frequency:
          type: string
          const: monthly
        interval:
          type: integer
          minimum: 1
          maximum: 120
          description: Months between due dates (1 = every month, 3 = quarterly).
        day:
          type: integer
          minimum: 1
          maximum: 31
      examples:
        - {version: 1, frequency: monthly, interval: 1, day: 15}
    AnnualSchedule:
      type: object
      additionalProperties: false
      required: [version, frequency, month, day]
      properties:
        version:
          type: integer
          const: 1
        frequency:
          type: string
          const: annual
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: A day that exists in the month in a leap year.
      examples:
        - {version: 1, frequency: annual, month: 2, day: 29}
    Commitment:
      type: object
      description: A recurring commitment definition. Dated occurrences and payment state are not part of it.
      required: [id, name, kind, amount, schedule, start_date, end_date, priority, notes, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        kind:
          $ref: "#/components/schemas/CommitmentKind"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        schedule:
          $ref: "#/components/schemas/Schedule"
        start_date:
          $ref: "#/components/schemas/Date"
        end_date:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        priority:
          oneOf:
            - $ref: "#/components/schemas/CommitmentPriority"
            - type: "null"
        notes:
          type: [string, "null"]
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    YearMonth:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      description: A calendar month, YYYY-MM.
    Occurrence:
      type: object
      description: |
        One due date of a commitment, generated from its definition
        (ADR-0027). Paid occurrences (any payment evidence) never change;
        unpaid ones due on or after an edit's effective date follow the edit
        (version increases, id stays). The version also increases with every
        payment-state change (manual payment, override), so the ETag covers
        the payment state (ADR-0031).
      required: [id, commitment_id, month, due_date, amount, version, created_at, updated_at, payment]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        commitment_id:
          $ref: "#/components/schemas/ID"
        month:
          $ref: "#/components/schemas/YearMonth"
        due_date:
          $ref: "#/components/schemas/Date"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        payment:
          $ref: "#/components/schemas/PaymentState"
    MonthSummary:
      type: object
      description: The monthly view (ADR-0034).
      additionalProperties: false
      required: [month, as_of, items, totals, freshness]
      properties:
        month:
          $ref: "#/components/schemas/YearMonth"
        as_of:
          $ref: "#/components/schemas/Date"
        items:
          type: array
          description: Every occurrence of the month, by due date, then ID, each with its commitment's name.
          items:
            allOf:
              - $ref: "#/components/schemas/Occurrence"
              - type: object
                required: [commitment_name]
                properties:
                  commitment_name:
                    type: string
                    description: The name of the commitment the occurrence belongs to.
        totals:
          type: array
          description: One entry per currency present, sorted by currency code. Empty for an empty month.
          items:
            $ref: "#/components/schemas/MonthTotals"
        freshness:
          $ref: "#/components/schemas/MonthFreshness"
    MonthTotals:
      type: object
      description: Exact totals of the occurrences in one currency. Evidence in another currency is not converted or counted.
      additionalProperties: false
      required: [currency, due, paid, outstanding, overdue, overpaid, occurrence_count, overdue_count, unconverted_evidence_count]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        due:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        outstanding:
          $ref: "#/components/schemas/Money"
        overdue:
          $ref: "#/components/schemas/Money"
        overpaid:
          $ref: "#/components/schemas/Money"
        occurrence_count:
          type: integer
        overdue_count:
          type: integer
        unconverted_evidence_count:
          type: integer
          description: Occurrences with payment evidence in another currency, which no total includes.
    MonthFreshness:
      type: object
      additionalProperties: false
      required: [computed_at, occurrences_changed_at, bank]
      properties:
        computed_at:
          type: string
          format: date-time
        occurrences_changed_at:
          type: [string, "null"]
          format: date-time
          description: The newest update among the month's occurrences; null for an empty month.
        bank:
          type: object
          additionalProperties: false
          required: [available, note]
          properties:
            available:
              type: boolean
              description: Always false until bank freshness is exposed over the API.
            note:
              type: string
    PaymentStatus:
      type: string
      enum: [paid, partially_paid, upcoming, due, overdue]
      description: |
        Derived payment status (decision D7). paid: payment evidence in the
        occurrence's currency covers its amount, or an applied "paid"
        override. partially_paid: some, not all. Otherwise by date in the
        reporting zone: upcoming before the due date, due on it, overdue from
        the day after it. Overdue always counts from the original due date.
    OverrideStatus:
      type: string
      enum: [paid, unpaid]
    PaymentState:
      type: object
      description: |
        Derived when read from payment evidence (manual payments; confirmed
        bank-transaction allocations from task X1), dates and the manual
        override (ADR-0031). Only evidence in the occurrence's currency is
        counted; other currencies are listed in unconverted_currencies and
        never converted or summed.
      required: [status, derived_status, timing, paid_amount, outstanding_amount, overpaid_amount, unconverted_currencies, evidence_count, grace_until, within_grace, override]
      properties:
        status:
          $ref: "#/components/schemas/PaymentStatus"
        derived_status:
          description: The status from evidence and dates alone, before the override.
          allOf:
            - $ref: "#/components/schemas/PaymentStatus"
        timing:
          description: upcoming, due or overdue for an occurrence that is not paid (for partially_paid, its unpaid remainder); null when paid.
          type: [string, "null"]
          enum: [upcoming, due, overdue, null]
        paid_amount:
          description: The sum of the evidence in the occurrence's currency (zero when none).
          $ref: "#/components/schemas/Money"
        outstanding_amount:
          description: >-
            The amount less paid_amount, never below zero; zero when paid. Under an
            applied "unpaid" override it is the full amount (the evidence is declared
            not to settle the occurrence), so it is never zero while the status is not paid.
          $ref: "#/components/schemas/Money"
        overpaid_amount:
          description: paid_amount less the amount when positive, else zero. Informational; it does not change the status.
          $ref: "#/components/schemas/Money"
        unconverted_currencies:
          type: array
          description: Currencies of evidence not in the occurrence's currency; not counted.
          items:
            type: string
            pattern: "^[A-Z]{3}$"
        evidence_count:
          type: integer
          minimum: 0
        grace_until:
          description: |
            End of a documented grace period of an overdue occurrence, when
            one is known (task DF2; none is recorded yet). The occurrence is
            overdue either way.
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        within_grace:
          type: boolean
          description: True while an overdue occurrence is within its documented grace period.
        override:
          oneOf:
            - type: "null"
            - type: object
              required: [status, reason, set_at, applied, previous_status]
              properties:
                status:
                  $ref: "#/components/schemas/OverrideStatus"
                reason:
                  type: string
                set_at:
                  type: string
                  format: date-time
                applied:
                  type: boolean
                  description: False for a "paid" override whose evidence has since been removed; it then has no effect.
                previous_status:
                  description: The override this one replaced, which an undo restores; null for none.
                  oneOf:
                    - $ref: "#/components/schemas/OverrideStatus"
                    - type: "null"
    ManualPayment:
      type: object
      description: A payment recorded by hand for one occurrence (ADR-0031). User data, never a bank fact.
      required: [id, occurrence_id, amount, paid_on, note, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurrence_id:
          $ref: "#/components/schemas/ID"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        paid_on:
          $ref: "#/components/schemas/Date"
        note:
          type: [string, "null"]
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ManualPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, paid_on]
      properties:
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        paid_on:
          $ref: "#/components/schemas/Date"
        note:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
    Role:
      type: string
      enum: [administrator, read-only]
      description: A user's role. administrator holds every grant; read-only holds read on non-administrative resources only.
    Grant:
      type: string
      description: A grant, "resource:action". See GET /grants.
      pattern: "^[a-z][a-z0-9_]*:[a-z]+$"
      examples: ["users:read"]
    Username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9][a-z0-9._-]*$"
    User:
      type: object
      required: [id, username, display_name, role, disabled, disabled_at, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        disabled_at:
          type: [string, "null"]
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditActorKind:
      type: string
      enum: [user, token, system, anonymous]
      description: user is a signed-in user; token an API token (its owner is actor_user_id); system the server or a host command; anonymous nobody who could be identified.
    AuditEntry:
      type: object
      required: [id, action, actor_kind, actor_user_id, actor_token_id, target_type, target_id, at, details]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        action:
          type: string
          examples: ["user.role_changed"]
        actor_kind:
          $ref: "#/components/schemas/AuditActorKind"
        actor_user_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        actor_token_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        target_type:
          type: [string, "null"]
        target_id:
          type: [string, "null"]
        at:
          type: string
          format: date-time
        details:
          type: object
          description: Only the fields the action declares, as short text. Never a request body, a secret or a bank payload.
          additionalProperties:
            type: string
            maxLength: 256
    Principal:
      type: object
      required: [kind, user_id, token_id, role, grants]
      properties:
        kind:
          type: string
          enum: [user, token]
        user_id:
          $ref: "#/components/schemas/ID"
        token_id:
          description: Set for API tokens only.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        role:
          $ref: "#/components/schemas/Role"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
    GrantVocabulary:
      type: object
      required: [resources, roles]
      properties:
        resources:
          type: array
          items:
            type: object
            required: [name, description, actions, admin_only]
            properties:
              name:
                type: string
              description:
                type: string
              actions:
                type: array
                items:
                  type: string
                  enum: [read, write]
              admin_only:
                type: boolean
                description: Not readable by the read-only role.
        roles:
          type: array
          items:
            type: object
            required: [name, grants]
            properties:
              name:
                $ref: "#/components/schemas/Role"
              grants:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
    PasswordBody:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: At least the configured minimum length in bytes (auth.password.min_length), at most 1024 bytes; no composition rules.
    PasswordSet:
      type: object
      required: [sessions_ended]
      properties:
        sessions_ended:
          type: integer
          minimum: 0
          description: How many sessions the change ended.
    Session:
      type: object
      description: A sign-in session. Never includes its token.
      required: [id, current, created_at, last_seen_at, authenticated_at, idle_expires_at, expires_at, user_agent, address, method]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        current:
          type: boolean
          description: The session this request was made with.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once a minute (a quarter of the idle timeout when that is shorter).
        authenticated_at:
          type: string
          format: date-time
          description: The last authentication (sign-in, or re-authentication with a password or the identity provider).
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends unless it is used again.
        expires_at:
          type: string
          format: date-time
          description: When the session ends however much it is used (absolute timeout).
        user_agent:
          type: string
          maxLength: 256
        address:
          type: string
          maxLength: 64
          description: The client address at sign-in.
        method:
          type: string
          enum: [password, oidc, recovery]
          description: How the session started (password includes a second factor when the user has one; recovery is a host-issued recovery sign-in).
    CurrentSession:
      type: object
      required: [user_id, session, csrf_token, recent_auth_until, two_factor]
      properties:
        user_id:
          $ref: "#/components/schemas/ID"
        session:
          $ref: "#/components/schemas/Session"
        csrf_token:
          type: string
          description: Send it in X-CSRF-Token with every state-changing request made with the session cookie.
        recent_auth_until:
          type: [string, "null"]
          format: date-time
          description: When the last password check stops counting as recent; null when it already has.
        two_factor:
          type: object
          required: [enabled, required, enrollment_required]
          properties:
            enabled:
              type: boolean
            required:
              type: boolean
              description: auth.require_2fa.
            enrollment_required:
              type: boolean
              description: The session reaches only the operations marked x-ledger-during-enrollment until an authenticator is enrolled. Never true for an OIDC session unless auth.oidc.require_2fa is on.
    SignInMethods:
      type: object
      required: [password, oidc]
      properties:
        password:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: auth.password.enabled.
        oidc:
          type: object
          required: [enabled, name, authorize_url]
          properties:
            enabled:
              type: boolean
            name:
              type: [string, "null"]
              description: The provider's name to show (auth.oidc.name); null when single sign-on is off.
            authorize_url:
              type: [string, "null"]
              description: Where to send the browser to sign in; null when single sign-on is off.
    OIDCLink:
      type: object
      required: [configured, linked, provider, subject, email, created_at, last_used_at]
      properties:
        configured:
          type: boolean
          description: Single sign-on is configured now.
        linked:
          type: boolean
        provider:
          type: [string, "null"]
        subject:
          type: [string, "null"]
          description: The provider's stable identifier of the identity (with the issuer, the link's key).
        email:
          type: [string, "null"]
          description: The address the provider last reported; display only.
        created_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    AuthorizationURL:
      type: object
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          description: The identity provider's authorization URL; send the browser there.
    ReturnTo:
      type: object
      additionalProperties: false
      properties:
        return_to:
          type: string
          maxLength: 512
          description: A same-origin path to come back to (default /).
    SecondFactorChallenge:
      type: object
      required: [second_factor_required, challenge, expires_at, methods]
      properties:
        second_factor_required:
          type: boolean
          const: true
        challenge:
          type: string
          description: Send it to POST /auth/sign-in/second-factor. A secret; it starts a session with a valid code.
        expires_at:
          type: string
          format: date-time
        methods:
          type: array
          items:
            type: string
            enum: [totp, recovery_code]
    TwoFactorStatus:
      type: object
      required: [enabled, method, enabled_at, recovery_codes_remaining, required, pending_enrollment_until]
      properties:
        enabled:
          type: boolean
        method:
          type: [string, "null"]
          enum: [totp, null]
        enabled_at:
          type: [string, "null"]
          format: date-time
        recovery_codes_remaining:
          type: integer
          minimum: 0
        required:
          type: boolean
          description: auth.require_2fa.
        pending_enrollment_until:
          type: [string, "null"]
          format: date-time
          description: When a started, unconfirmed enrolment stops being confirmable; null when none is pending.
    TOTPEnrollment:
      type: object
      required: [secret, otpauth_uri, algorithm, digits, period, expires_at]
      properties:
        secret:
          type: string
          description: The base32 secret (no padding), shown only in this response.
        otpauth_uri:
          type: string
          description: otpauth://totp URI with the secret, issuer Ledger and the parameters, for a QR code.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
        expires_at:
          type: string
          format: date-time
          description: Confirm before this time.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Shown only in this response; each works once. Stored only as hashes.
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$"
        sessions_ended:
          type: integer
          minimum: 0
          description: Sessions of the user ended by enabling TOTP (confirmation only).
    ApiToken:
      type: object
      description: An API token. Never includes the token itself.
      required: [id, name, owner_id, root, grants, hint, prefix, last_chars, status, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
        owner_id:
          $ref: "#/components/schemas/ID"
        root:
          type: boolean
          description: A root token holds every grant its owner's role holds, now and in later versions.
        grants:
          type: array
          description: The token's own grants (empty for a root token). Requests get only those the owner's current role allows.
          items:
            $ref: "#/components/schemas/Grant"
        hint:
          type: string
          description: The prefix, first and last four random characters, to recognise the token.
          examples: ["ldgr_AbCd…wXyZ"]
        prefix:
          type: string
          description: "\"ldgr_\" and the first four random characters."
        last_chars:
          type: string
          description: The last four characters.
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null when the token never expires.
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.
        revoked_at:
          type: [string, "null"]
          format: date-time
    ApiTokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          type: [string, "null"]
    NewApiToken:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        grants:
          type: array
          description: The grants the token holds; each must be one you hold. Leave empty for a root token.
          items:
            $ref: "#/components/schemas/Grant"
        root:
          type: boolean
          default: false
          description: Ask explicitly for a root token (administrators only).
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional; in the future. Without it the token never expires.
    CreatedApiToken:
      type: object
      required: [secret, token, warning]
      properties:
        secret:
          type: string
          description: The token. Shown only in this response; Ledger keeps only its hash.
          pattern: "^ldgr_[0-9A-Za-z]{43}$"
        token:
          $ref: "#/components/schemas/ApiToken"
        warning:
          type: [string, "null"]
          description: What a root token can do; null for other tokens.
    ID:
      type: string
      description: A ULID.
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      examples: ["01JD3Y4C8V9M2Q7W5R6T0XZBNA"]
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Optimistic-concurrency version; incremented by every change.
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable code. The set only grows.
          enum:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - version_conflict
            - unsupported_media_type
            - payload_too_large
            - precondition_required
            - rate_limited
            - internal_error
            - dependency_unavailable
            - invalid_credentials
            - csrf_failed
            - reauthentication_required
            - pending_terms_change
            - two_factor_enrollment_required
            - invalid_second_factor
            - password_sign_in_disabled
        message:
          type: string
        field:
          type: string
          description: The request field or parameter the error is about.
        errors:
          type: array
          description: Every invalid field, when a validation found more than one problem (field and message repeat the first). Nested members are named with dots, for example schedule.day or amount.currency.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        request_id:
          type: string
        reconciliation:
          $ref: "#/components/schemas/Reconciliation"
    Reconciliation:
      type: object
      description: Sent with a version conflict (409).
      required: [current_version]
      properties:
        current_version:
          $ref: "#/components/schemas/Version"
        current:
          type: object
          description: The object as it is now, when the caller may read it.
  responses:
    Error:
      description: An error. 405 responses carry Allow; 409 conflicts carry ETag and reconciliation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
