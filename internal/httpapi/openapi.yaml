        "200":
          description: The assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectAssignments"
        "409":
          description: definition_archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: resetObjectCategory
      x-ledger-access: organisation:write
      summary: Forget the person's category choice
      description: |
        Removes the object's own category row (a category or "none"), so a rule or a model may assign
        again, and a pending transaction's assignment applies again to its booking. 404 when the
        object has no category. 409 review_inherited when the category is only inherited from the pending
        transaction it replaces: reset it there. Audited (organisation.assignment_changed, change reset).
