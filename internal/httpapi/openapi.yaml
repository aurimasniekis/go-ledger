        schema:
          type: string
          enum: [transaction, commitment, account, merchant]
      - name: object_id
        in: path
        required: true
        description: |
          The object's identifier; for a merchant its merchant record's id (ADR-0058, decision D-MER 1a;
          a name is no longer accepted). For a merchant every route here also needs the merchants grant
          (merchants:read to read, merchants:write to change; administrators only), 403 otherwise; an
          archived or merged merchant gets nothing new (409 merchant_archived).
        schema:
          type: string
