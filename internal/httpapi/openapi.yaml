# Ledger Management API, version 1. This file is the contract (ADR-0011): it is
# written by hand, served at /api/v1/openapi.yaml and /api/v1/openapi.json, and
# TestOpenAPIContract fails when a registered /api/v1 route is missing here or a
# path here has no registered route. Change it in the same commit as the routes.
openapi: 3.1.1
info:
  title: Ledger Management API
  version: 1.0.0
  summary: Manage a personal Ledger instance.
  description: |
    Ledger shows paid, upcoming and overdue commitments and an outlook that
    compares commitments still due with bank balances. It is never a
    guarantee of money that is safe to spend.

    Conventions (ADR-0011):

    - **Base path** `/api/v1`. Backwards-incompatible changes get a new major
      version and base path; `info.version` follows semantic versioning.
    - **Identifiers** are ULIDs: 26 upper-case Crockford base32 characters,
      stable for the life of the object and never reused.
    - **Lists** return `{"items": [...], "next_cursor": "..."|null}`. Pass
      `limit` (1-200, default 50) and `cursor` (the previous
      `next_cursor`, valid only with the same filters). Filters are
      `field=value` (repeat for any of several values) and
      `field[op]=value` with `op` one of `prefix`, `gt`, `gte`, `lt`,
      `lte` where an endpoint documents it. Unknown parameters are rejected.
    - **Optimistic concurrency.** Mutable objects carry `version` (from 1)
      and the strong ETag `"<version>"`. Changing or deleting one requires
      that version in `If-Match` or the body's `version`: missing is 428, stale
      is 409 with `reconciliation` (the current version and, where allowed,
      the current object).
    - **Errors** use the `Error` envelope with a stable `code`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
paths:
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      summary: This document as JSON
      tags: [meta]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      summary: This document as YAML
      tags: [meta]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
tags:
  - name: meta
    description: The API description itself.
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page. Opaque; valid only with the same filters.
      schema:
        type: string
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      description: The ETag of the version this change is based on. Required unless the body carries version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  headers:
    ETag:
      description: The object's version as a strong entity tag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    RequestID:
      description: The request ID, also in the error body.
      schema:
        type: string
  schemas:
    ID:
      type: string
      description: A ULID.
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      examples: ["01JD3Y4C8V9M2Q7W5R6T0XZBNA"]
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Optimistic-concurrency version; incremented by every change.
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable code. The set only grows.
          enum:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - payload_too_large
            - precondition_required
            - rate_limited
            - internal_error
            - dependency_unavailable
        message:
          type: string
        field:
          type: string
          description: The request field or parameter the error is about.
        request_id:
          type: string
        reconciliation:
          $ref: "#/components/schemas/Reconciliation"
    Reconciliation:
      type: object
      description: Sent with a version conflict (409).
      required: [current_version]
      properties:
        current_version:
          $ref: "#/components/schemas/Version"
        current:
          type: object
          description: The object as it is now, when the caller may read it.
  responses:
    Error:
      description: An error. 405 responses carry Allow; 409 conflicts carry ETag and reconciliation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
