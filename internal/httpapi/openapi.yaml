              description: "Configuration key `events.pulse.source`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "name":
              type: string
              description: "Configuration key `events.pulse.name`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
    SettingsMcp:
      description: |
        Runtime settings group `mcp` (grant settings): the effective value of every member as a top-level member, then the read-only members below. Members that are not settings are read-only.
      allOf:
        - $ref: "#/components/schemas/SettingsGroupMeta"
        - type: object
          properties:
            "enabled":
              type: boolean
              description: "Configuration key `mcp.enabled`."
            "requests_per_minute":
              type: integer
              description: "Configuration key `mcp.requests_per_minute`."
            "burst":
              type: integer
              description: "Configuration key `mcp.burst`."
            "max_request_bytes":
              type: integer
              description: "Configuration key `mcp.max_request_bytes`."
    SettingsLogging:
      description: |
        Runtime settings group `logging` (grant settings): the effective value of every member as a top-level member, then the read-only members below. Members that are not settings are read-only.
      allOf:
        - $ref: "#/components/schemas/SettingsGroupMeta"
        - type: object
          properties:
            "level":
              type: string
              enum: ["debug", "info", "warn", "error"]
              description: "Configuration key `log.level`."
    SettingsAlerts:
      description: |
        Runtime settings group `alerts` (grant settings): the effective value of every member as a top-level member, then the read-only members below. Members that are not settings are read-only.
      allOf:
        - $ref: "#/components/schemas/SettingsGroupMeta"
        - type: object
          properties:
            "channels":
              type: array
              items:
                type: string
              description: "Configuration key `alerts.channels`. Sensitive: refused through the API until the sign-in gate lands (task S2)."
            "consent_horizon_days":
              type: integer
              description: "Configuration key `alerts.consent_horizon_days`."
            "interval":
              type: string
              description: "Configuration key `alerts.interval`. A duration with a unit, such as 30s or 6h."
    CachedRate:
      type: object
      description: One cached exchange rate with its provenance, freshness and revision (FX2c, ADR-0048). One unit of base is worth value units of quote. The fields shared with ExchangeRate have the same meaning.
      required: [provider, source, base, quote, value, date, retrieved_at, first_retrieved_at, confirmed_through, stale, stale_reason, previous]
      properties:
        provider:
          type: string
          description: The adapter that retrieved the rate, such as frankfurter.
        source:
          type: string
          description: The publisher the provider names (ECB, ...), or blended. Rates of different sources are never mixed.
        base:
          $ref: "#/components/schemas/Currency"
        quote:
          $ref: "#/components/schemas/Currency"
        value:
          $ref: "#/components/schemas/PositiveDecimal"
        date:
          description: The day the provider says the rate is for (a working day for ECB).
          $ref: "#/components/schemas/Date"
        retrieved_at:
          type: string
          format: date-time
          description: The last time the provider returned this rate for this date.
        first_retrieved_at:
          type: string
          format: date-time
          description: When Ledger first received this value.
        confirmed_through:
          description: The latest date up to which a retrieval confirmed this is the rate that applies.
          $ref: "#/components/schemas/Date"
        stale:
          type: boolean
          description: Decision D11, evaluated now. A stale rate is never used in a converted total.
        stale_reason:
          description: Why the rate is stale; null when it is not.
          oneOf:
            - type: string
              enum: [not_retrieved_recently, rate_date_too_old]
            - type: "null"
        previous:
          description: The value the provider revised away, when it did; null otherwise.
          oneOf:
            - type: object
              required: [value, revised_at]
              properties:
                value:
                  $ref: "#/components/schemas/PositiveDecimal"
                revised_at:
                  type: string
                  format: date-time
            - type: "null"
    RatesRefreshRun:
      type: object
      description: One exchange-rate refresh run.
      required: [trigger, started_at, finished_at, outcome, currencies_refreshed, error]
      properties:
        trigger:
          type: string
          enum: [scheduled, manual]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [succeeded, partial, failed]
          description: succeeded when every currency was refreshed; partial when some were before a failure; failed when none were.
        currencies_refreshed:
          type: integer
          minimum: 0
        error:
          description: The first failure; null on success. Kind and a short code only, never a URL or a provider message.
          oneOf:
            - type: object
              required: [kind, code]
              properties:
                kind:
                  type: string
                  enum: [unavailable, rate_limited, permanent, internal]
                code:
                  type: string
            - type: "null"
    RatesStatus:
      type: object
      required: [enabled, provider, source, reporting_currency, refresh_available, refresh_interval_seconds, refresh_after_seconds, stale_after_days, last_run, last_success_at, as_of]
      properties:
        enabled:
          type: boolean
          description: A rate provider is configured (rates.enabled). When false the rates listed were cached while it was on, and nothing refreshes them.
        provider:
          type: string
        source:
          type: string
        reporting_currency:
          description: The currency rates are fetched to; null when reporting.currency is not set.
          oneOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
        refresh_available:
          type: boolean
          description: A refresh job exists (enabled and a reporting currency), so POST /rates/refreshes can run.
        refresh_interval_seconds:
          type: integer
        refresh_after_seconds:
          type: integer
          description: A rate retrieved more recently than this is used without asking the provider.
        stale_after_days:
          type: integer
          description: Decision D11, 5 by default.
        last_run:
          description: The most recent finished run since the process started; null before the first.
          oneOf:
            - $ref: "#/components/schemas/RatesRefreshRun"
            - type: "null"
        last_success_at:
          type: [string, "null"]
          format: date-time
          description: When a run last refreshed every currency since the process started.
        as_of:
          type: string
          format: date-time
    Principal:
      type: object
      required: [kind, user_id, token_id, role, grants]
      properties:
        kind:
          type: string
          enum: [user, token]
        user_id:
          $ref: "#/components/schemas/ID"
        token_id:
          description: Set for API tokens only.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        role:
          $ref: "#/components/schemas/Role"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
    GrantVocabulary:
      type: object
      required: [resources, roles]
      properties:
        resources:
          type: array
          items:
            type: object
            required: [name, description, actions, admin_only]
            properties:
              name:
                type: string
              description:
                type: string
              actions:
                type: array
                items:
                  type: string
                  enum: [read, write]
              admin_only:
                type: boolean
                description: Not readable by the read-only role.
        roles:
          type: array
          items:
            type: object
            required: [name, grants]
            properties:
              name:
                $ref: "#/components/schemas/Role"
              grants:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
    PasswordBody:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: At least the configured minimum length in bytes (auth.password.min_length), at most 1024 bytes; no composition rules.
    PasswordSet:
      type: object
      required: [sessions_ended]
      properties:
        sessions_ended:
          type: integer
          minimum: 0
          description: How many sessions the change ended.
    Session:
      type: object
      description: A sign-in session. Never includes its token.
      required: [id, current, created_at, last_seen_at, authenticated_at, idle_expires_at, expires_at, user_agent, address, method]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        current:
          type: boolean
          description: The session this request was made with.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once a minute (a quarter of the idle timeout when that is shorter).
        authenticated_at:
          type: string
          format: date-time
          description: The last authentication (sign-in, or re-authentication with a password or the identity provider).
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends unless it is used again.
        expires_at:
          type: string
          format: date-time
          description: When the session ends however much it is used (absolute timeout).
        user_agent:
          type: string
          maxLength: 256
        address:
          type: string
          maxLength: 64
          description: The client address at sign-in.
        method:
          type: string
          enum: [password, oidc, recovery]
          description: How the session started (password includes a second factor when the user has one; recovery is a host-issued recovery sign-in).
    CurrentSession:
      type: object
      required: [user_id, session, csrf_token, recent_auth_until, two_factor]
      properties:
        user_id:
          $ref: "#/components/schemas/ID"
        session:
          $ref: "#/components/schemas/Session"
        csrf_token:
          type: string
          description: Send it in X-CSRF-Token with every state-changing request made with the session cookie.
        recent_auth_until:
          type: [string, "null"]
          format: date-time
          description: When the last password check stops counting as recent; null when it already has.
        two_factor:
          type: object
          required: [enabled, required, enrollment_required]
          properties:
            enabled:
              type: boolean
            required:
              type: boolean
              description: auth.require_2fa.
            enrollment_required:
              type: boolean
              description: The session reaches only the operations marked x-ledger-during-enrollment until an authenticator is enrolled. Never true for an OIDC session unless auth.oidc.require_2fa is on.
    SignInMethods:
      type: object
      required: [password, oidc]
      properties:
        password:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: auth.password.enabled.
        oidc:
          type: object
          required: [enabled, name, authorize_url]
          properties:
            enabled:
              type: boolean
            name:
              type: [string, "null"]
              description: The provider's name to show (auth.oidc.name); null when single sign-on is off.
            authorize_url:
              type: [string, "null"]
              description: Where to send the browser to sign in; null when single sign-on is off.
    OIDCLink:
      type: object
      required: [configured, linked, provider, subject, email, created_at, last_used_at]
      properties:
        configured:
          type: boolean
          description: Single sign-on is configured now.
        linked:
          type: boolean
        provider:
          type: [string, "null"]
        subject:
          type: [string, "null"]
          description: The provider's stable identifier of the identity (with the issuer, the link's key).
        email:
          type: [string, "null"]
          description: The address the provider last reported; display only.
        created_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    AuthorizationURL:
      type: object
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          description: The identity provider's authorization URL; send the browser there.
    ReturnTo:
      type: object
      additionalProperties: false
      properties:
        return_to:
          type: string
          maxLength: 512
          description: A same-origin path to come back to (default /).
    SecondFactorChallenge:
      type: object
      required: [second_factor_required, challenge, expires_at, methods]
      properties:
        second_factor_required:
          type: boolean
          const: true
        challenge:
          type: string
          description: Send it to POST /auth/sign-in/second-factor. A secret; it starts a session with a valid code.
        expires_at:
          type: string
          format: date-time
        methods:
          type: array
          items:
            type: string
            enum: [totp, recovery_code]
    TwoFactorStatus:
      type: object
      required: [enabled, method, enabled_at, recovery_codes_remaining, required, pending_enrollment_until]
      properties:
        enabled:
          type: boolean
        method:
          type: [string, "null"]
          enum: [totp, null]
        enabled_at:
          type: [string, "null"]
          format: date-time
        recovery_codes_remaining:
          type: integer
          minimum: 0
        required:
          type: boolean
          description: auth.require_2fa.
        pending_enrollment_until:
          type: [string, "null"]
          format: date-time
          description: When a started, unconfirmed enrolment stops being confirmable; null when none is pending.
    TOTPEnrollment:
      type: object
      required: [secret, otpauth_uri, algorithm, digits, period, expires_at]
      properties:
        secret:
          type: string
          description: The base32 secret (no padding), shown only in this response.
        otpauth_uri:
          type: string
          description: otpauth://totp URI with the secret, issuer Ledger and the parameters, for a QR code.
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        period:
          type: integer
          const: 30
        expires_at:
          type: string
          format: date-time
          description: Confirm before this time.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Shown only in this response; each works once. Stored only as hashes.
          items:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$"
        sessions_ended:
          type: integer
          minimum: 0
          description: Sessions of the user ended by enabling TOTP (confirmation only).
    ApiToken:
      type: object
      description: An API token. Never includes the token itself.
      required: [id, name, owner_id, root, grants, hint, prefix, last_chars, status, created_at, expires_at, last_used_at, revoked_at, parent_token_id]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          minLength: 1
          maxLength: 100
        owner_id:
          $ref: "#/components/schemas/ID"
        root:
          type: boolean
          description: A root token holds every grant its owner's role holds, now and in later versions.
        grants:
          type: array
          description: The token's own grants (empty for a root token). Requests get only those the owner's current role allows.
          items:
            $ref: "#/components/schemas/Grant"
        hint:
          type: string
          description: The prefix, first and last four random characters, to recognise the token.
          examples: ["ldgr_AbCd…wXyZ"]
        prefix:
          type: string
          description: "\"ldgr_\" and the first four random characters."
        last_chars:
          type: string
          description: The last four characters.
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null when the token never expires.
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.
        revoked_at:
          type: [string, "null"]
          format: date-time
        parent_token_id:
          type: [string, "null"]
          description: The token that created this one through the API (a root token of the root account, or a token it created); null for tokens made on the host or by bootstrap, and for tokens created before parents were recorded.
    ApiTokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        next_cursor:
          type: [string, "null"]
    CurrentSecondFactor:
      type: object
      additionalProperties: false
      description: |
        The current second factor that replacing, disabling or regenerating
        two-factor authentication needs while TOTP is enabled (decision
        D26-1a), on top of recent re-authentication and whatever the session
        method (password or OIDC): exactly one of a code from the enabled
        authenticator or an unused recovery code. Missing (or both) is 400
        `validation_failed` on `current_code`; a wrong, reused or malformed
        one is 400 `invalid_second_factor` on the field given, counts in the
        sign-in limits (429 `rate_limited` once blocked) and is audited
        (auth.reauthentication_failed). A TOTP code is used up; a recovery
        code is consumed.
      properties:
        current_code:
          type: string
          examples: ["123456"]
        current_recovery_code:
          type: string
          examples: ["ABCD-EFGH-JKMN-PQRS"]
    NewApiToken:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        grants:
          type: array
          description: The grants the token holds; each must be one you hold. Leave empty for a root token.
          items:
            $ref: "#/components/schemas/Grant"
        root:
          type: boolean
          default: false
          description: Ask explicitly for a root token (administrators only).
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional; in the future. Without it the token never expires. Capped at the expiry of the token creating it, when that one expires.
    CreatedApiToken:
      type: object
      required: [secret, token, warning]
      properties:
        secret:
          type: string
          description: The token. Shown only in this response; Ledger keeps only its hash.
          pattern: "^ldgr_[0-9A-Za-z]{43}$"
        token:
          $ref: "#/components/schemas/ApiToken"
        warning:
          type: [string, "null"]
          description: What a root token can do; null for other tokens.
    ID:
      type: string
      description: A ULID.
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
      examples: ["01JD3Y4C8V9M2Q7W5R6T0XZBNA"]
    OrganisationDefinition:
      type: object
      description: |
        A category, label or bucket (decision D12, ADR-0053). Names are free text: never an identifier.
        A bucket groups commitments and accounts to slice the outlook and never holds or allocates money.
      required: [id, kind, name, parent_id, archived, archived_at, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          type: string
          enum: [category, label, bucket]
        name:
          type: string
        parent_id:
          description: A category's parent (two levels only); null for a top-level category, a label and a bucket.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        archived:
          type: boolean
        archived_at:
          type: [string, "null"]
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganisationActor:
      type: object
      required: [kind, user_id, via]
      properties:
        kind:
          type: string
          enum: [user, token, system]
        user_id:
          type: [string, "null"]
        via:
          type: [string, "null"]
          enum: [session, token, mcp, system, null]
    AssignmentOrigin:
      type: string
      enum: [user, rule, model]
      description: Who made the assignment. The person's word outranks a rule's, which outranks a model's; nothing automatic replaces a user assignment.
    CategoryAssignment:
      type: object
      required: [category, origin, source, by, at, inherited]
      properties:
        category:
          description: The category; null when the person explicitly chose none.
          oneOf:
            - $ref: "#/components/schemas/OrganisationDefinition"
            - type: "null"
        origin:
          $ref: "#/components/schemas/AssignmentOrigin"
        source:
          type: [string, "null"]
          description: The rule or provider/model of an automatic origin; null for user.
        by:
          $ref: "#/components/schemas/OrganisationActor"
        at:
          type: string
          format: date-time
        inherited:
          type: boolean
          description: True when this is the assignment of the pending transaction this one superseded.
    LabelAssignment:
      type: object
      required: [label, origin, source, by, at, inherited]
      properties:
        label:
          $ref: "#/components/schemas/OrganisationDefinition"
        origin:
          $ref: "#/components/schemas/AssignmentOrigin"
        source:
          type: [string, "null"]
        by:
          $ref: "#/components/schemas/OrganisationActor"
        at:
          type: string
          format: date-time
        inherited:
          type: boolean
    ObjectAssignments:
      type: object
      required: [object_type, object_id, category, labels, removed_labels, buckets]
      properties:
        object_type:
          type: string
          enum: [transaction, commitment, account, merchant]
        object_id:
          type: string
        category:
          oneOf:
            - $ref: "#/components/schemas/CategoryAssignment"
            - type: "null"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelAssignment"
        removed_labels:
          type: array
          description: Labels the person took off; automatic runs do not add them back.
          items:
            $ref: "#/components/schemas/LabelAssignment"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationDefinition"
    BucketMember:
      type: object
      required: [object_type, object_id, added_by, added_at]
      properties:
        object_type:
          type: string
          enum: [commitment, account]
        object_id:
          $ref: "#/components/schemas/ID"
        added_by:
          $ref: "#/components/schemas/OrganisationActor"
        added_at:
          type: string
          format: date-time
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Optimistic-concurrency version; incremented by every change.
    BankApplication:
      type: object
      required: [provider, name, mode, environment, account_access, capabilities]
      properties:
        provider: {type: string}
        name: {type: string, description: The operator's name for the application; connections record it.}
        mode: {type: string, enum: [app, developer], description: "The provider's mode terminology, not production versus sandbox."}
        environment: {type: string, enum: [production, sandbox]}
        account_access:
          type: string
          enum: [all, linked_only]
          description: all reaches every account the user consents to; linked_only only accounts linked to the application at the provider.
        capabilities:
          type: object
          required: [balance_types, pending_transactions, max_consent_validity_days, max_history_days, background_fetches_per_day]
          description: Zero means not known, never none.
          properties:
            balance_types:
              type: array
              items: {type: string, enum: [booked, available, expected, other]}
            pending_transactions: {type: boolean}
            max_consent_validity_days: {type: integer}
            max_history_days: {type: integer}
            background_fetches_per_day: {type: integer}
    BankInstitution:
      type: object
      required: [id, name, country, max_consent_validity_days]
      properties:
        id: {type: string}
        name: {type: string}
        country: {type: string}
        max_consent_validity_days: {type: integer}
    BankError:
      type: object
      required: [kind, code]
      description: Why a refresh or an account's last attempt failed. No payload.
      properties:
        kind:
          type: string
          enum: [reconnect_required, rate_limited, retryable, permanent, canceled]
          description: reconnect_required needs a new consent; rate_limited and retryable can be retried later; permanent cannot be fixed by retrying.
        code: {type: string, description: The provider's error code; may be empty.}
    BankFreshness:
      type: object
      required: [state, stale, last_success_at, last_attempt_at, last_error, notice_code]
      properties:
        state:
          type: string
          enum: [fresh, stale, failed, reconnect_required, disconnected, never_refreshed]
        stale: {type: boolean}
        last_success_at: {type: [string, "null"], format: date-time}
        last_attempt_at: {type: [string, "null"], format: date-time}
        last_error:
          oneOf:
            - $ref: "#/components/schemas/BankError"
            - type: "null"
        notice_code:
          type: [string, "null"]
          description: A note about the last refresh, such as transactions_rejected.
    BankAccount:
      type: object
      required: [id, name, product, currency, identifier_hint, no_longer_reported, transactions_through, freshness, balances]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        product: {type: string}
        currency: {type: string, description: ISO 4217, or XXX when the bank reports the account in several currencies.}
        identifier_hint:
          type: [string, "null"]
          description: The last four characters of the account number; never the whole number.
        no_longer_reported: {type: boolean}
        transactions_through: {type: [string, "null"], format: date}
        freshness: {$ref: "#/components/schemas/BankFreshness"}
        balances:
          type: array
          description: The latest balance of each type the bank reported, with when Ledger obtained it. Empty when none was ever reported.
          items:
            type: object
            required: [type, amount, reference_date, obtained_at]
            properties:
              type: {type: string, enum: [booked, available, expected, other]}
              amount: {$ref: "#/components/schemas/Money"}
              reference_date: {type: [string, "null"], format: date}
              obtained_at: {type: string, format: date-time}
    BankConnection:
      type: object
      required: [id, provider, application, mode, environment, account_access, institution, status, needs_reconnect, freshness, consent_granted_at, consent_valid_until, consent_expires_soon, last_error, accounts, last_refresh_run, refresh_running, refresh_available_at, schedule, as_of, version, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        provider: {type: string}
        application: {type: string}
        mode: {type: string, enum: [app, developer]}
        environment: {type: string, enum: [production, sandbox]}
        account_access: {type: string, enum: [all, linked_only]}
        institution:
          type: object
          required: [id, name, country]
          properties:
            id: {type: string}
            name: {type: string}
            country: {type: string}
        status:
          type: string
          enum: [pending, active, reconnect_required, failed, disconnected]
        needs_reconnect:
          type: boolean
          description: True only when a new consent is the way forward (status reconnect_required). Never true for a retryable failure.
        freshness:
          type: string
          enum: [fresh, stale, failed, reconnect_required, disconnected, never_refreshed]
          description: The worst freshness among the connection's accounts, or the connection's own state when it has none.
        consent_granted_at: {type: [string, "null"], format: date-time}
        consent_valid_until: {type: [string, "null"], format: date-time}
        consent_expires_soon: {type: boolean, description: An active consent ends within 14 days.}
        previous_session_end_failed: {type: boolean, description: "Only in the answer of completeBankConnection, and only when true: the reconnect replaced a provider session that could not be ended, so it may still be live at the bank (audited as bank_connection.session_end_failed)."}
        last_error:
          oneOf:
            - $ref: "#/components/schemas/BankError"
            - type: "null"
        accounts:
          type: array
          items: {$ref: "#/components/schemas/BankAccount"}
        last_refresh_run:
          oneOf:
            - $ref: "#/components/schemas/BankRefreshRun"
            - type: "null"
        refresh_running:
          type: boolean
          description: True while a refresh is still going on in the background (the last run is running, or a refresh just requested outlived the wait). Poll the connection until it is false.
        refresh_available_at:
          description: While in the future, a refresh on request is refused (429 refresh_cooldown) until this time, counted from when the last refresh finished. Null when a refresh on request is allowed now.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        schedule:
          description: The background scheduler's view; null when background refresh is off or has not seen the connection yet.
          oneOf:
            - type: object
              required: [state, next_attempt_at, consecutive_failures]
              properties:
                state:
                  type: string
                  enum: [waiting, due, running, backoff, rate_limited, budget_exhausted, not_active, no_provider]
                next_attempt_at: {type: [string, "null"], format: date-time}
                consecutive_failures: {type: integer}
            - type: "null"
        as_of: {type: string, format: date-time, description: When the freshness was computed.}
        version: {$ref: "#/components/schemas/Version"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BankRefreshRun:
      type: object
      required: [id, started_at, finished_at, outcome, error, accounts_failed, transactions_inserted, transactions_rejected]
      properties:
        id: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        outcome: {type: string, enum: [running, succeeded, partial, failed, interrupted]}
        error:
          oneOf:
            - $ref: "#/components/schemas/BankError"
            - type: "null"
        accounts_failed: {type: integer}
        transactions_inserted: {type: integer}
        transactions_rejected: {type: integer}
    BankConsentStart:
      type: object
      required: [connection, authorization_url]
      properties:
        connection: {$ref: "#/components/schemas/BankConnection"}
        authorization_url:
          type: string
          description: The bank's or provider's page to send the user to. Open it in the browser; it is not an API call.
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable code. The set only grows.
          enum:
            - validation_failed
            - setting_pinned
            - secret_unreadable
            - reclassification_required
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - version_conflict
            - unsupported_media_type
            - payload_too_large
            - precondition_required
            - rate_limited
            - internal_error
            - dependency_unavailable
            - invalid_credentials
            - csrf_failed
            - reauthentication_required
            - root_token_required
            - pending_terms_change
            - two_factor_enrollment_required
            - invalid_second_factor
            - payment_evidence_required
            - occurrence_cancelled
            - transaction_not_countable
            - transaction_not_debit
            - transaction_over_allocated
            - bank_reconnect_required
            - bank_unavailable
            - bank_rate_limited
            - bank_request_rejected
            - connection_not_active
            - refresh_in_progress
            - refresh_cooldown
            - consent_not_found
            - bank_connect_unavailable
            - occurrence_overpaid
            - duplicate_match
            - invalid_match_state
            - match_undo_not_decider
            - match_undo_window_closed
            - manual_payment_other_occurrence
            - manual_payment_not_replaceable
            - nothing_to_confirm
            - review_inherited
            - password_sign_in_disabled
            - rates_refresh_unavailable
            - nothing_outstanding
            - deferral_plan_exists
            - deferral_plan_undone
            - deferral_adjustment_removed
            - deferral_adjustment_paid
            - deferral_adjustment_not_paid
            - deferral_adjustments_unpaid
            - deferral_plan_currency
            - definition_archived
            - definition_in_use
            - duplicate_name
            - merchant_alias_taken
            - merchant_archived
            - merchant_in_use
            - suggestion_not_pending
            - not_reversible
            - assignment_changed
            - nothing_to_apply
            - wrong_task
            - alert_not_open
        message:
          type: string
        field:
          type: string
          description: The request field or parameter the error is about.
        errors:
          type: array
          description: Every invalid field, when a validation found more than one problem (field and message repeat the first). Nested members are named with dots, for example schedule.day or amount.currency.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        request_id:
          type: string
        reconciliation:
          $ref: "#/components/schemas/Reconciliation"
    ModelRef:
      type: object
      description: The provider and model that said something.
      required: [provider, model, label]
      properties:
        provider:
          type: string
        model:
          type: string
        label:
          type: string
          description: provider/model, the text to show after "suggested by".
    Suggestion:
      type: object
      description: |
        A model suggestion (task L6c, ADR-0065). It is never a bank fact, an assignment, a match or a payment. Only the model's validated
        answer is stored (choice identifiers and the model's own confidence), never the request or bank text.
      required: [id, task, object_type, object_id, state, suggested_by, provenance, response_id, decision, auto_apply, reversal, created_at, decided_at, version]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        task:
          type: string
          enum: [categorisation, label_suggestion]
        object_type:
          type: string
          enum: [transaction, commitment, account, merchant]
        object_id:
          $ref: "#/components/schemas/ID"
        state:
          type: string
          enum: [pending, accepted, rejected, superseded, reverted]
        suggested_by:
          $ref: "#/components/schemas/ModelRef"
        provenance:
          type: string
          description: '"suggested by provider/model".'
        response_id:
          type: [string, "null"]
          description: The provider's own response identifier, when it gave one.
        decision:
          type: object
          required: [choice, choices, confidence]
          properties:
            choice:
              description: The category the model chose (categorisation); null when it chose none.
              oneOf:
                - $ref: "#/components/schemas/ID"
                - type: "null"
            choices:
              type: array
              description: The labels the model chose (label suggestions).
              items:
                $ref: "#/components/schemas/ID"
            confidence:
              type: [string, "null"]
              description: The model's own confidence as a decimal string from 0 to 1. It is not proof of anything.
        auto_apply:
          type: boolean
          description: True when the suggestion was applied automatically as a model-origin assignment; only these can be reverted.
        reversal:
          description: Set when a person took back an auto-applied suggestion (state reverted).
          oneOf:
            - type: "null"
            - type: object
              required: [by, at]
              properties:
                by:
                  $ref: "#/components/schemas/OrganisationActor"
                at:
                  type: string
                  format: date-time
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    Alert:
      type: object
      description: An in-app alert. message is Ledger's own deterministic text; model_text is optional, labelled extra wording.
      required: [id, kind, object_type, object_id, facts, message, model_text, state, created_at, closed_at, version]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          type: string
          enum: [consent_expiring, commitment_amount_changed, unmatched_overdue]
        object_type:
          type: string
          enum: [bank_connection, commitment, occurrence]
        object_id:
          type: string
        facts:
          type: object
          description: Exact values as text, with their currencies (a currency change is shown as itself, never converted).
          additionalProperties:
            type: string
        message:
          type: string
        model_text:
          description: Optional wording a model wrote for the alert, with the provider and model that wrote it; null when none.
          oneOf:
            - type: "null"
            - type: object
              required: [text, provider, model, label, provenance]
              properties:
                text:
                  type: string
                provider:
                  type: string
                model:
                  type: string
                label:
                  type: string
                provenance:
                  type: string
        state:
          type: string
          enum: [open, dismissed, resolved]
        created_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
    Reconciliation:
      type: object
      description: Sent with a version conflict (409).
      required: [current_version]
      properties:
        current_version:
          $ref: "#/components/schemas/Version"
        current:
          type: object
          description: The object as it is now, when the caller may read it.
  responses:
    Error:
      description: An error. 405 responses carry Allow; 409 conflicts carry ETag and reconciliation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
