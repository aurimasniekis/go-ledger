        "200":
          description: The assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectAssignments"
        "409":
          description: definition_archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeObjectLabel
      x-ledger-access: organisation:write
      summary: Take a label off an object
      description: |
        Removes the label and remembers that the person did (removed_labels), so rules and models do
        not add it back. 404 when the object does not have the label. Audited
        (organisation.assignment_changed, kind label, change removed).
      tags: [organisation]
      responses:
        "200":
          description: The assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectAssignments"
        default:
          $ref: "#/components/responses/Error"
  /suggestions:
    get:
      operationId: listSuggestions
      x-ledger-access: decisions:read
      summary: List model suggestions
      description: |
        Suggestions a model made for categorising an object or labelling it (task L6c, ADR-0065), oldest first (ID order).
        A suggestion is model output kept apart from assignments: it assigns nothing until a person accepts or corrects it
        (or, for categorisation with auto_apply on, until it was applied automatically as a model-origin assignment that
        any person or rule outranks). state is pending, accepted, rejected (a correction is a rejection with the person's
        own answer), superseded or reverted (an auto-applied suggestion whose effect was taken back). Every suggestion names
        the provider and model that said it (suggested_by) and keeps them when it is accepted. Suggestions made for the
        alerts task are not queued: their text is attached to the alert as model_text.
      tags: [decisions]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only suggestions in these states (any of them). accepted excludes reverted ones.
          schema:
            type: array
            items:
              type: string
              enum: [pending, accepted, rejected, superseded, reverted]
          style: form
          explode: true
        - name: task
          in: query
          description: Only suggestions of these tasks.
          schema:
            type: array
            items:
              type: string
              enum: [categorisation, label_suggestion]
          style: form
          explode: true
        - name: object_type
          in: query
          description: Only suggestions about this kind of object.
          schema:
            type: string
            enum: [transaction, commitment, account, merchant]
        - name: object_id
          in: query
          description: Only suggestions about this object.
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: One page of suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suggestion"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getSuggestion
      x-ledger-access: decisions:read
      summary: Get a suggestion
      tags: [decisions]
      responses:
        "200":
          description: The suggestion.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: acceptSuggestion
      x-ledger-access: decisions:write
      summary: Accept a suggestion
      description: |
        Applies a pending suggestion as the person's own decision (a user-origin assignment, which no rule, model or refresh replaces) and
        marks it accepted. The suggestion keeps the provider and model that said it. The object and the category or labels are checked
        again: an archived definition is 409 definition_archived and a vanished object is 404, and the suggestion stays pending.
        A state moves once (409 suggestion_not_pending). A suggestion that holds no choice is 409 nothing_to_apply: reject it or correct it.
        Needs organisation:write too (and merchants:write for a merchant). Audited (decision_suggestion.accepted, plus the organisation
        store's own assignment event).
      tags: [decisions]
      responses:
        "200":
          description: The suggestion after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "403":
          description: "forbidden, including a caller without organisation:write (and merchants:write for a merchant), because this writes an assignment."
        "409":
          description: "suggestion_not_pending, nothing_to_apply or definition_archived."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}/correct:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: correctSuggestion
      x-ledger-access: decisions:write
      summary: Correct a suggestion
      description: |
        Applies the person's own answer instead of the model's and marks the suggestion rejected (the person disagreed); the model is not asked
        about the object again. For a categorisation give category_id (an active category, or null to record that the object has no category);
        for a label suggestion give label_ids (all are added in one transaction or none). Fields of the other task are refused.
        Needs organisation:write too (and merchants:write for a merchant). Audited (decision_suggestion.corrected).
      tags: [decisions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                category_id:
                  description: "For a categorisation only: the category the person chooses, or null for no category. Required for a categorisation."
                  oneOf:
                    - $ref: "#/components/schemas/ID"
                    - type: "null"
                label_ids:
                  description: "For a label suggestion only: the labels the person adds (1 to 50). Required for a label suggestion."
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: The suggestion after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "403":
          description: "forbidden, including a caller without organisation:write (and merchants:write for a merchant), because this writes an assignment."
        "409":
          description: "suggestion_not_pending or definition_archived."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: rejectSuggestion
      x-ledger-access: decisions:write
      summary: Reject a suggestion
      description: |
        Turns a pending suggestion down. Nothing is assigned and the model is not asked about the object again. A state moves once
        (409 suggestion_not_pending). Audited (decision_suggestion.rejected).
      tags: [decisions]
      responses:
        "200":
          description: The suggestion after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "403":
          description: forbidden
        "409":
          description: "suggestion_not_pending."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: revertSuggestion
      x-ledger-access: decisions:write
      summary: Revert an auto-applied suggestion
      description: |
        Takes back a categorisation that was applied automatically: the model-origin category is removed (the person's reset, audited by the
        organisation store) and the reversal is recorded, so the suggestion now reads reverted and the model is not asked again. It is allowed
        only while the object's category is still exactly the model-origin one this suggestion wrote; a later decision by a person or a rule is
        never undone (409 not_reversible). A suggestion that was not auto-applied, or was already reverted, is also 409 not_reversible.
        Needs organisation:write too (and merchants:write for a merchant). Audited (decision_suggestion.reverted).
      tags: [decisions]
      responses:
        "200":
          description: The suggestion after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "403":
          description: "forbidden, including a caller without organisation:write (and merchants:write for a merchant), because this writes an assignment."
        "409":
          description: "not_reversible (not auto-applied, already reverted, or the category has changed since) or assignment_changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /alerts:
    get:
      operationId: listAlerts
      x-ledger-access: decisions:read
      summary: List in-app alerts
      description: |
        Alerts Ledger raised itself (task L6c, ADR-0065): a bank consent about to expire, a commitment whose amount changed, an overdue
        occurrence with no matching payment. Oldest first (ID order). state shows whether an alert is open, dismissed (a person closed it
        and it stays closed) or resolved (the condition stopped holding). message is Ledger's own wording of the facts; model_text is
        optional extra wording a model wrote, labelled with its provider and model, never a replacement.
      tags: [decisions]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only alerts in these states (any of them).
          schema:
            type: array
            items:
              type: string
              enum: [open, dismissed, resolved]
          style: form
          explode: true
        - name: kind
          in: query
          description: Only alerts of these kinds.
          schema:
            type: array
            items:
              type: string
              enum: [consent_expiring, commitment_amount_changed, unmatched_overdue]
          style: form
          explode: true
        - name: object_type
          in: query
          schema:
            type: string
            enum: [bank_connection, commitment, occurrence]
        - name: object_id
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: One page of alerts.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
  /alerts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      operationId: getAlert
      x-ledger-access: decisions:read
      summary: Get an alert
      tags: [decisions]
      responses:
        "200":
          description: The alert.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        default:
          $ref: "#/components/responses/Error"
  /alerts/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    post:
      operationId: dismissAlert
      x-ledger-access: decisions:write
      summary: Dismiss an alert
      description: |
        Closes an open alert as dismissed. A dismissal sticks: the same situation (the same key: expiry date, new amount or due date) is not raised
        again. An alert that is already dismissed or resolved is 409 alert_not_open. Audited (alert.closed with how=dismissed).
      tags: [decisions]
      responses:
        "200":
          description: The alert, now dismissed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "409":
          description: "alert_not_open."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
tags:
  - name: mcp
    description: Model Context Protocol server.
  - name: meta
    description: The API description itself.
  - name: access
    description: Who the caller is and the grant vocabulary.
  - name: users
    description: User accounts and roles (administrative).
  - name: audit
    description: The append-only audit log (administrative, read-only).
  - name: commitments
    description: Recurring commitment definitions.
  - name: decisions
    description: Model suggestions to review (accept, correct, reject, revert) with the provider and model that said them, and in-app alerts (administrators).
  - name: deferral-plans
    description: Plans to pay an outstanding occurrence later (personal, creditor-agreed or documented grace), with revisions, undo, explicit fees and history. Never payment.
  - name: auth
    description: Sign-in, sessions, re-authentication and your own password.
  - name: occurrences
    description: Dated occurrences generated from commitment definitions, their payment state, manual payments and status overrides.
  - name: bank-connections
    description: Connecting banks, consent, reconnecting, refreshing on request, and each account's freshness.
  - name: merchants
    description: Merchant identity of bank transactions, the enrichment, and confirming, correcting or rejecting it (administrators).
  - name: organisation
    description: Categories (two levels, single-valued), labels (flat, many-valued) and buckets (groupings of commitments and accounts), and assigning them to transactions, commitments, accounts and merchants, with the origin of every assignment.
  - name: outlook
    description: The outlook against recorded commitments, compared with bank balances; never money that is safe to spend.
  - name: payment-matches
    description: Links between bank transactions and occurrences (allocations), with suggestions, confirmations, corrections, unmatching, reversal and the undo of a confirmation (unconfirm).
  - name: rates
    description: Cached exchange rates with provenance and freshness, and refreshing them on request (administrators).
  - name: settings
    description: "Runtime settings (ADR-0066): effective values with their source, the read-only deployment settings, and changing what no configuration layer pins (administrators)."
  - name: tokens
    description: API tokens (Authorization Bearer); your own, and everyone's for administrators.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token (ldgr_ followed by 43 characters) in Authorization Bearer. Which operations a token may call follows its grants; see x-ledger-access.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ledger_session
      description: The browser session cookie set by sign-in. State-changing requests made with it also send X-CSRF-Token.
  parameters:
    CategoryFilter:
      name: category_id
      in: query
      required: false
      description: |
        Only objects whose effective category is this one or one of its children (repeat for any of several). A category groups; it allocates no
        money. Combined with label_id, an object must satisfy both. Needs the organisation:read grant as well as the endpoint's own. For
        occurrences, the month view and its totals, the category is the commitment's; for payment matches it is the transaction's, including
        what it inherits from the pending transaction it replaced. An unknown category is a validation error. A filter that matches more than
        5000 objects is refused: narrow it.
      schema:
        $ref: "#/components/schemas/ID"
    LabelFilter:
      name: label_id
      in: query
      required: false
      description: |
        Only objects carrying this label (repeat for any of several). Labels group; they allocate no money. Combined with category_id, an
        object must satisfy both. Needs the organisation:read grant as well as the endpoint's own. Same object rules and limits as category_id.
      schema:
        $ref: "#/components/schemas/ID"
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page. Opaque; valid only with the same filters.
      schema:
        type: string
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      description: The ETag of the version this change is based on. Required for DELETE; for a PATCH it may be given as the body's version instead.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  headers:
    ETag:
      description: The object's version as a strong entity tag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    RequestID:
      description: The request ID, also in the error body.
      schema:
        type: string
  schemas:
    CommitmentKind:
      type: string
      enum: [service, server, domain, subscription, debt_repayment]
      description: What the commitment pays for. server covers servers and VPSs.
    CommitmentPriority:
      type: string
      enum: [essential, important, flexible]
      description: How important paying on time is (decision D14, three levels).
    Currency:
      type: string
      description: An ISO 4217 currency code, three upper-case letters.
      pattern: "^[A-Z]{3}$"
      examples: ["EUR"]
    Decimal:
      type: string
      description: An exact decimal number as a string, keeping its scale ("12.50"). Never a JSON number.
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      examples: ["12.50"]
    PositiveDecimal:
      type: string
      description: An exact decimal number as a string, greater than zero, keeping its scale ("12.50"). Never a JSON number.
      pattern: "^([1-9][0-9]*(\\.[0-9]+)?|0\\.[0-9]*[1-9][0-9]*)$"
      examples: ["12.50"]
    Money:
      type: object
      description: An exact amount of zero or more with its currency (ADR-0005), keeping its scale. It is never converted.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: An exact decimal number as a string, zero or more ("0.00", "12.50"). Never a JSON number.
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
        currency:
          $ref: "#/components/schemas/Currency"
    PositiveMoney:
      type: object
      description: An exact amount greater than zero with its currency (ADR-0005). It is never converted.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        currency:
          $ref: "#/components/schemas/Currency"
    MoneyPatch:
      type: object
      description: Merge-patch form of PositiveMoney, only in a commitment PATCH body. Members that are sent replace the stored ones; the merged amount is validated as a whole.
      additionalProperties: false
      properties:
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        currency:
          $ref: "#/components/schemas/Currency"
    SchedulePatch:
      type: object
      description: |
        Merge-patch form of Schedule, only in a commitment PATCH body. No
        member is required; a member set to null is removed, which is how a
        schedule switches between monthly and annual. The merged schedule is
        validated as a whole against the Schedule schema.
      additionalProperties: false
      properties:
        version:
          type: integer
          const: 1
        frequency:
          type: string
          enum: [monthly, annual]
        interval:
          type: [integer, "null"]
          minimum: 1
          maximum: 120
        month:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        day:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
    Date:
      type: string
      format: date
      description: A calendar date, YYYY-MM-DD. A commitment's start_date must not be before 1900-01-01.
      examples: ["2026-11-20"]
    Schedule:
      description: |
        When a commitment falls due: a versioned schedule spec (ADR-0024).
        version is 1, the only version; a later version is added beside it,
        never by changing what version 1 means. Calendar rules (decision
        D6): a day past the end of a month falls on that month's last day,
        and an annual February 29 falls on February 28 in years that are not
        leap years. A monthly schedule counts its interval from the month of
        start_date.
      oneOf:
        - $ref: "#/components/schemas/MonthlySchedule"
        - $ref: "#/components/schemas/AnnualSchedule"
      discriminator:
        propertyName: frequency
        mapping:
          monthly: "#/components/schemas/MonthlySchedule"
          annual: "#/components/schemas/AnnualSchedule"
    MonthlySchedule:
      type: object
      additionalProperties: false
      required: [version, frequency, interval, day]
      properties:
        version:
          type: integer
          const: 1
        frequency:
          type: string
          const: monthly
        interval:
          type: integer
          minimum: 1
          maximum: 120
          description: Months between due dates (1 = every month, 3 = quarterly).
        day:
          type: integer
          minimum: 1
          maximum: 31
      examples:
        - {version: 1, frequency: monthly, interval: 1, day: 15}
    AnnualSchedule:
      type: object
      additionalProperties: false
      required: [version, frequency, month, day]
      properties:
        version:
          type: integer
          const: 1
        frequency:
          type: string
          const: annual
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: A day that exists in the month in a leap year.
      examples:
        - {version: 1, frequency: annual, month: 2, day: 29}
    Commitment:
      type: object
      description: A recurring commitment definition. Dated occurrences and payment state are not part of it.
      required: [id, name, kind, amount, schedule, start_date, end_date, priority, notes, match_tolerance, leeway, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        kind:
          $ref: "#/components/schemas/CommitmentKind"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        schedule:
          $ref: "#/components/schemas/Schedule"
        start_date:
          $ref: "#/components/schemas/Date"
        end_date:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        priority:
          oneOf:
            - $ref: "#/components/schemas/CommitmentPriority"
            - type: "null"
        notes:
          type: [string, "null"]
        match_tolerance:
          description: |
            Optional; null for none. How far a booked bank payment may fall
            short of amount and still be confirmed automatically by the matching
            engine (decision D9, ADR-0039); without one only the exact amount
            confirms automatically. Zero or more, in the commitment's currency.
            A payment above amount is never confirmed automatically (it would
            overpay).
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        leeway:
          description: |
            Optional; null when nothing is recorded, which is not the same as the
            explicit kinds unknown (the user does not know) and none (the user states
            there is no grace). What the user knows about the grace the creditor
            allows after a due date (decision D14, ADR-0052): entered by the user only,
            never inferred from payment history, bank data or model output, with no
            default length. It only annotates an overdue occurrence; it never moves a
            due date or hides an obligation.
          oneOf:
            - $ref: "#/components/schemas/Leeway"
            - type: "null"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Leeway:
      type: object
      description: |
        What the user recorded about a commitment's grace period (task DF2,
        ADR-0052). Every member is present, null when not given. kind unknown
        and kind none carry neither days nor until and are never read as zero
        days. A period counts days from each occurrence's due date; a deadline
        covers the occurrences due on or before until.
      required: [kind, days, until, conditions, consequences, source]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [unknown, none, period, deadline]
        days:
          description: Required for kind period (1 to 365), null otherwise.
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        until:
          description: Required for kind deadline, null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        conditions:
          description: What the grace depends on, as the user knows it.
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        consequences:
          description: Fees or other consequences of paying late that the user knows of. Free text; record a fee as a deferral plan adjustment to count it.
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        source:
          description: Where the information comes from (a contract clause, a letter, a call).
          type: [string, "null"]
          minLength: 1
          maxLength: 200
    LeewayInput:
      type: object
      description: |
        The leeway a client writes (task DF2, ADR-0052); the request form of
        Leeway. A create must give kind; the other members it leaves out are
        null. A merge patch merges member by member into the recorded leeway,
        so it may send only the members that change. When no leeway is
        recorded, a patch must give kind too. A patch that changes kind
        must also send null for each member the new kind does not use (days
        unless kind is period, until unless kind is deadline). Unknown members
        are refused.
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [unknown, none, period, deadline]
        days:
          description: Required for kind period (1 to 365), null otherwise.
          type: [integer, "null"]
          minimum: 1
          maximum: 365
        until:
          description: Required for kind deadline, null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        conditions:
          description: What the grace depends on, as the user knows it.
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        consequences:
          description: Fees or other consequences of paying late that the user knows of. Free text; record a fee as a deferral plan adjustment to count it.
          type: [string, "null"]
          minLength: 1
          maxLength: 500
        source:
          description: Where the information comes from (a contract clause, a letter, a call).
          type: [string, "null"]
          minLength: 1
          maxLength: 200
    PaymentMatchingRun:
      type: object
      description: The counts of one automatic payment-matching run (ADR-0039).
      additionalProperties: false
      required: [candidates, confirmed, suggested, dropped, skipped]
      properties:
        candidates:
          type: integer
          minimum: 0
          description: Candidate pairs evaluated, including those already suggested.
        confirmed:
          type: integer
          minimum: 0
          description: Matches confirmed automatically (every D9 safeguard passed).
        suggested:
          type: integer
          minimum: 0
          description: New suggestions left for review.
        dropped:
          type: integer
          minimum: 0
          description: The engine's own suggestions rejected because they are no longer candidates.
        skipped:
          type: integer
          minimum: 0
          description: Actions the match store refused (its guards, or a person changed the data meanwhile); the next run decides again.
    YearMonth:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      description: A calendar month, YYYY-MM.
    Occurrence:
      type: object
      description: |
        One due date of a commitment, generated from its definition
        (ADR-0027). Paid occurrences (any payment evidence) never change;
        unpaid ones due on or after an edit's effective date follow the edit
        (version increases, id stays). The version also increases with every
        payment-state change (manual payment, override, payment match), so the ETag covers
        the payment state (ADR-0031).
      required: [id, commitment_id, month, due_date, amount, version, created_at, updated_at, cancelled_at, cancelled_reason, payment]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        commitment_id:
          $ref: "#/components/schemas/ID"
        month:
          $ref: "#/components/schemas/YearMonth"
        due_date:
          $ref: "#/components/schemas/Date"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
          description: |
            Set when the occurrence was cancelled instead of removed because
            deleted payments still refer to it (decision D31). A cancelled
            occurrence is not counted in the monthly totals, the overdue
            counts or the outlook; its payment state shows its history and is
            not an obligation. It takes no new payment, match or override
            (409 occurrence_cancelled).
        cancelled_reason:
          type: [string, "null"]
          enum: [out_of_range, terms_change, commitment_deleted, null]
          description: |
            Why it was cancelled; null unless cancelled_at is set. It follows
            the removal path, not the cause of the edit: out_of_range for the
            rows before an edit's effective date that a start or end date
            correction removes, terms_change for the rows the edit's plan
            removes (an end-date correction therefore gives both), and
            commitment_deleted for a commitment delete.
        payment:
          $ref: "#/components/schemas/PaymentState"
    MonthSummary:
      type: object
      description: The monthly view (ADR-0034).
      additionalProperties: false
      required: [month, as_of, items, carried_in, totals, freshness, filter]
      properties:
        month:
          $ref: "#/components/schemas/YearMonth"
        as_of:
          $ref: "#/components/schemas/Date"
        filter:
          description: Null for the whole month. Set when category_id or label_id restricted it; the items and the totals then cover only the matching commitments, never the whole month.
          oneOf:
            - type: object
              additionalProperties: false
              required: [category_ids, label_ids, note]
              properties:
                category_ids:
                  type: array
                  items:
                    $ref: "#/components/schemas/ID"
                label_ids:
                  type: array
                  items:
                    $ref: "#/components/schemas/ID"
                note:
                  type: string
            - type: "null"
        items:
          type: array
          description: Every occurrence of the month, by due date, then ID, each with its commitment's name.
          items:
            allOf:
              - $ref: "#/components/schemas/Occurrence"
              - type: object
                required: [commitment_name, deferral]
                properties:
                  commitment_name:
                    type: string
                    description: The name of the commitment the occurrence belongs to.
                  deferral:
                    description: The occurrence's active deferral plan (ADR-0050); null when none. It never changes the payment state.
                    oneOf:
                      - $ref: "#/components/schemas/DeferralPlan"
                      - type: "null"
        carried_in:
          type: array
          description: Occurrences of earlier months whose active deferral plan falls in this month, by due date, then ID. They keep their own month and due date, count only in the planned figures and are listed apart from this month's own occurrences.
          items:
            allOf:
              - $ref: "#/components/schemas/Occurrence"
              - type: object
                required: [commitment_name, deferral]
                properties:
                  commitment_name:
                    type: string
                  deferral:
                    $ref: "#/components/schemas/DeferralPlan"
        totals:
          type: array
          description: One entry per currency present, sorted by currency code. Empty for an empty month.
          items:
            $ref: "#/components/schemas/MonthTotals"
        freshness:
          $ref: "#/components/schemas/MonthFreshness"
    MonthTotals:
      type: object
      description: Exact totals of the occurrences in one currency. Evidence in another currency is not converted or counted.
      additionalProperties: false
      required: [currency, due, paid, outstanding, overdue, overpaid, occurrence_count, overdue_count, unconverted_evidence_count, planned, deferred_out, carried_in, adjustments]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        due:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        outstanding:
          $ref: "#/components/schemas/Money"
        overdue:
          $ref: "#/components/schemas/Money"
        overpaid:
          $ref: "#/components/schemas/Money"
        occurrence_count:
          type: integer
        overdue_count:
          type: integer
        unconverted_evidence_count:
          type: integer
          description: Occurrences with payment evidence in another currency, which no total includes.
    DeferralPlanType:
      type: string
      enum: [personal, creditor_agreed, documented_grace]
      description: |
        On what authority the payment is planned later (decision D14).
        personal: the user's own plan, nothing agreed with the creditor.
        creditor_agreed: a later date the creditor agreed to.
        documented_grace: a grace period the creditor documents; the planned
        date is its last day. The occurrence is overdue from its original due
        date in every case (decision D7).
    DeferralPlanState:
      type: string
      enum: [active, undone]
    DeferralAdjustmentKind:
      type: string
      enum: [fee, interest, other]
    DeferralReason:
      type: [string, "null"]
      minLength: 1
      maxLength: 500
      description: Why, in 1 to 500 characters; optional (null for none).
    DeferralAdjustment:
      type: object
      description: An explicit fee, interest or other charge recorded on a plan, in the plan's currency.
      additionalProperties: false
      required: [id, kind, amount, note, created_at, removed_at, paid_at, paid_by]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          $ref: "#/components/schemas/DeferralAdjustmentKind"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        note:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        removed_at:
          type: [string, "null"]
          format: date-time
          description: Set once removed; a removed adjustment is history and does not count.
        paid_at:
          type: [string, "null"]
          format: date-time
          description: When the person marked the adjustment paid; null while it is still planned. Reversible, and never payment evidence for the occurrence.
        paid_by:
          description: Who marked it paid and how; null while it is still planned.
          oneOf:
            - $ref: "#/components/schemas/MatchActor"
            - type: "null"
    DeferralPlan:
      type: object
      description: |
        A deferral plan (ADR-0050): the user's plan to pay an outstanding
        occurrence later than its due date. It is separate from the
        occurrence and never payment. original_due_date, original_amount and
        outstanding_when_planned are what the occurrence was and owed when
        the plan was made (history). occurrence_status, outstanding_amount and
        overdue_since are the occurrence's live state, which only payment
        evidence changes.
      additionalProperties: false
      required: [id, occurrence_id, commitment_id, plan_type, state, planned_date, planned_month, reason, original_due_date, original_amount, outstanding_when_planned,
        occurrence_status, outstanding_amount, overdue_since, grace_until, within_grace, missed, missed_reason, adjustment_total, unpaid_adjustment_total, adjustments, version, created_at, updated_at, undone_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurrence_id:
          $ref: "#/components/schemas/ID"
        commitment_id:
          $ref: "#/components/schemas/ID"
        plan_type:
          $ref: "#/components/schemas/DeferralPlanType"
        state:
          $ref: "#/components/schemas/DeferralPlanState"
        planned_date:
          $ref: "#/components/schemas/Date"
        planned_month:
          $ref: "#/components/schemas/YearMonth"
        reason:
          $ref: "#/components/schemas/DeferralReason"
        original_due_date:
          $ref: "#/components/schemas/Date"
        original_amount:
          $ref: "#/components/schemas/PositiveMoney"
        outstanding_when_planned:
          $ref: "#/components/schemas/PositiveMoney"
        occurrence_status:
          $ref: "#/components/schemas/PaymentStatus"
        outstanding_amount:
          $ref: "#/components/schemas/Money"
        overdue_since:
          description: The occurrence's current due date while it is overdue; null otherwise. A plan never moves it (original_due_date is the due date when the plan was made).
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        grace_until:
          description: The planned date of an active documented_grace plan; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        within_grace:
          type: boolean
          description: True while the occurrence is overdue and today is not after grace_until ("overdue, within documented grace until grace_until").
        missed:
          type: boolean
          description: |
            True while the plan is active, its planned date has passed (today is after it) and either the occurrence is overdue and still owes something ("principal") or a recorded fee is still planned, even when the principal is paid ("fee").
            Derived on every read and never stored; it is not payment state. It clears when the occurrence is paid and every fee is paid or removed, the plan is revised to a later date or the plan is undone.
        missed_reason:
          description: Why the plan is missed; null when it is not. "principal" takes precedence over "fee".
          oneOf:
            - type: string
              enum: [principal, fee]
            - type: "null"
        adjustment_total:
          $ref: "#/components/schemas/Money"
          description: The adjustments not removed, paid ones included.
        unpaid_adjustment_total:
          $ref: "#/components/schemas/Money"
          description: The adjustments still planned (neither removed nor marked paid), which the monthly view counts in the planned month.
        adjustments:
          type: array
          description: Every adjustment, oldest first, removed ones included.
          items:
            $ref: "#/components/schemas/DeferralAdjustment"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        undone_at:
          type: [string, "null"]
          format: date-time
    DeferralPlanEvent:
      type: object
      description: One change of a plan, with the plan's type and planned date after it.
      additionalProperties: false
      required: [action, plan_version, plan_type, planned_date, reason, adjustment_id, by, at]
      properties:
        action:
          type: string
          enum: [created, revised, undone, adjustment_added, adjustment_removed, adjustment_paid, adjustment_unpaid]
        plan_version:
          $ref: "#/components/schemas/Version"
        plan_type:
          $ref: "#/components/schemas/DeferralPlanType"
        planned_date:
          $ref: "#/components/schemas/Date"
        reason:
          $ref: "#/components/schemas/DeferralReason"
        adjustment_id:
          description: The adjustment added, removed or marked paid or unpaid; null for other changes.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        by:
          $ref: "#/components/schemas/MatchActor"
        at:
          type: string
          format: date-time
    MonthFreshness:
      type: object
      additionalProperties: false
      required: [computed_at, occurrences_changed_at, bank]
      properties:
        computed_at:
          type: string
          format: date-time
        occurrences_changed_at:
          type: [string, "null"]
          format: date-time
          description: The newest update among the month's occurrences; null for an empty month.
        bank:
          type: object
          additionalProperties: false
          required: [available, connections, state, last_success_at, note]
          properties:
            available:
              type: boolean
              description: True when at least one bank connection exists, whatever its state. False when there is none (state none) and also when the connections could not be read (state unknown); read state to tell the two apart.
            connections:
              type: integer
              description: How many bank connections exist.
            state:
              type: string
              enum: [none, unknown, fresh, stale, never_refreshed, failed, disconnected, reconnect_required]
              description: The worst freshness among the connections' accounts (a connection without accounts counts by its status). none without a connection; unknown when the connections could not be read.
            last_success_at:
              type: [string, "null"]
              format: date-time
              description: The newest successful bank fetch of any account; null when none succeeded.
            note:
              type: string
    SignedMoney:
      type: object
      description: An exact amount with its currency that may be negative (a balance, or a difference). It is never converted.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          $ref: "#/components/schemas/Currency"
    Outlook:
      type: object
      description: The outlook against recorded commitments (ADR-0044). Not a forecast and not money that is safe to spend.
      additionalProperties: false
      required: [as_of, notice, slice, window, currencies, balances, accounts, converted, planned_outflows, freshness]
      properties:
        as_of:
          $ref: "#/components/schemas/Date"
        notice:
          type: string
          description: The wording to show with the outlook.
        slice:
          description: Null for the whole outlook. Set when the outlook was restricted to a bucket (the bucket parameter); every figure then covers only that bucket's commitments and accounts.
          oneOf:
            - type: object
              additionalProperties: false
              required: [bucket, commitment_count, account_count, note]
              properties:
                bucket:
                  $ref: "#/components/schemas/OrganisationDefinition"
                commitment_count:
                  type: integer
                  description: Commitments in the bucket.
                account_count:
                  type: integer
                  description: Accounts in the bucket.
                note:
                  type: string
                  description: The wording to show with a slice.
            - type: "null"
        window:
          type: object
          additionalProperties: false
          required: [from, through, truncated, not_recorded_count]
          properties:
            not_recorded_count:
              type: integer
              description: Occurrences in the window that are counted nowhere because they fell due before their commitment was recorded; the monthly view lists them.
            from:
              description: The first month read; null when no commitment starts by through.
              oneOf:
                - $ref: "#/components/schemas/YearMonth"
                - type: "null"
            through:
              $ref: "#/components/schemas/YearMonth"
            truncated:
              type: boolean
              description: True when commitments start more than 240 months before through; older occurrences are not counted.
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/OutlookCurrency"
        balances:
          type: object
          additionalProperties: false
          required: [shown, note, stale_after_seconds]
          properties:
            shown:
              type: boolean
            note:
              type: string
            stale_after_seconds:
              description: How old the last successful refresh of an account may be before its balance is flagged as not fresh (banking.stale_after); null when balances are not shown.
              type: [integer, "null"]
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/OutlookAccount"
        converted:
          oneOf:
            - $ref: "#/components/schemas/OutlookConverted"
            - type: "null"
        planned_outflows:
          type: object
          additionalProperties: false
          required: [included, note]
          properties:
            included:
              type: boolean
            note:
              type: string
        freshness:
          type: object
          additionalProperties: false
          required: [computed_at, occurrences_changed_at]
          properties:
            computed_at:
              type: string
              format: date-time
            occurrences_changed_at:
              type: [string, "null"]
              format: date-time
    OutlookCurrency:
      type: object
      description: The comparison in one currency. Nothing in it is converted.
      additionalProperties: false
      required: [currency, still_due, overdue, upcoming, planned_outflows, overdue_count, unconverted_evidence_count, balance, balance_less_still_due, account_count, stale_account_count, oldest_balance_obtained_at, overdue_months, balance_as_of, payments_after_balance]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        still_due:
          $ref: "#/components/schemas/Money"
        overdue:
          $ref: "#/components/schemas/Money"
        upcoming:
          $ref: "#/components/schemas/Money"
        planned_outflows:
          type: object
          description: |
            The window with each outstanding amount placed in the month it is planned to be paid (deferral plans, ADR-0050, D-DF 8):
            total = still_due - deferred_beyond + adjustments. A plan is not payment and not forgiveness: still_due, overdue and
            upcoming are unchanged by plans. Per currency only: the converted aggregate carries only the converted total.
            Only occurrences of the window's own months count: an amount deferred into a truncated window from before it is
            not in still_due and so is in none of total, deferred_in and deferred_beyond.
          additionalProperties: false
          required: [total, deferred_in, deferred_beyond, adjustments, missed_count, missed_outstanding]
          properties:
            total:
              $ref: "#/components/schemas/Money"
            deferred_in:
              description: The outstanding amount of occurrences planned into a later month of the window than their own, shown apart; part of still_due (and overdue past the due date) as before, and of total.
              $ref: "#/components/schemas/Money"
            deferred_beyond:
              description: The part of still_due whose active plan falls in a month after the window; owed, not planned inside it. Counts only occurrences of the window.
              $ref: "#/components/schemas/Money"
            adjustments:
              description: Recorded fees, interest and other charges of active plans still planned (neither removed nor marked paid); not part of still_due.
              $ref: "#/components/schemas/Money"
            missed_count:
              type: integer
              description: Active plans of occurrences in the window whose planned date has passed while something planned (principal or a fee) is still unpaid. Derived when read; not payment state.
            missed_outstanding:
              description: The outstanding principal of the occurrences behind missed_count (zero when only fees are unpaid).
              $ref: "#/components/schemas/Money"
        overdue_count:
          type: integer
        unconverted_evidence_count:
          type: integer
          description: Occurrences with payment evidence in another currency, which is never converted and counted nowhere.
        balance:
          oneOf:
            - $ref: "#/components/schemas/SignedMoney"
            - type: "null"
        balance_less_still_due:
          oneOf:
            - $ref: "#/components/schemas/SignedMoney"
            - type: "null"
        account_count:
          type: integer
        stale_account_count:
          type: integer
        oldest_balance_obtained_at:
          type: [string, "null"]
          format: date-time
        overdue_months:
          type: array
          description: The months the overdue part comes from, oldest first, each with its overdue count and amount; the monthly view of that month lists the items.
          items:
            type: object
            additionalProperties: false
            required: [month, count, amount]
            properties:
              month:
                $ref: "#/components/schemas/YearMonth"
              count:
                type: integer
              amount:
                $ref: "#/components/schemas/Money"
        balance_as_of:
          description: The date of the oldest counted balance (its reference date, or the date it was obtained in the reporting time zone when the bank gave none); null when no balance is counted. The balance is never adjusted.
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        payments_after_balance:
          description: Payment evidence in this currency dated strictly after balance_as_of (manual payments and confirmed bank matches); a payment dated on balance_as_of itself is not counted. These are recorded payments the balance may not yet reflect. A caveat only, never netted into the balance. Null when no balance is counted.
          oneOf:
            - type: object
              additionalProperties: false
              required: [count, amount]
              properties:
                count:
                  type: integer
                amount:
                  $ref: "#/components/schemas/Money"
            - type: "null"
    OutlookAccount:
      type: object
      description: A bank account, the balances the outlook counts for it (one per currency) and its data freshness.
      additionalProperties: false
      required: [id, connection_id, name, institution, currency, balances, counted, not_counted_reason, freshness]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        connection_id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        institution:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, provider_type, amount, reference_date, obtained_at]
            properties:
              type:
                type: string
                enum: [booked, available, expected, other]
              provider_type:
                type: string
              amount:
                $ref: "#/components/schemas/SignedMoney"
              reference_date:
                oneOf:
                  - $ref: "#/components/schemas/Date"
                  - type: "null"
              obtained_at:
                type: string
                format: date-time
        counted:
          type: boolean
        not_counted_reason:
          type: [string, "null"]
          enum: [no_balance, no_longer_reported, unsupported_balance_type, null]
        freshness:
          type: object
          additionalProperties: false
          required: [state, stale, last_success_at, last_attempt_at, last_error_kind, last_error_code, notice_code]
          properties:
            state:
              type: string
              enum: [fresh, stale, failed, reconnect_required, disconnected, never_refreshed]
            stale:
              type: boolean
              description: True for every state but fresh.
            last_success_at:
              type: [string, "null"]
              format: date-time
            last_attempt_at:
              type: [string, "null"]
              format: date-time
            last_error_kind:
              type: [string, "null"]
            last_error_code:
              type: [string, "null"]
            notice_code:
              type: [string, "null"]
    OutlookConverted:
      type: object
      description: The secondary aggregate in one reporting currency (decision D5). Only currencies with an acceptable rate are included.
      additionalProperties: false
      required: [currency, complete, still_due, overdue, planned_total, balance, balance_less_still_due, balance_account_count, stale_balance_account_count, included, excluded]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        complete:
          type: boolean
          description: False when any currency is excluded.
        still_due:
          $ref: "#/components/schemas/Money"
        overdue:
          $ref: "#/components/schemas/Money"
        planned_total:
          description: The per-currency planned_outflows.total converted with the same rate and rounding as still_due. The other planned figures (deferred in, beyond, fees, missed) are per currency only.
          $ref: "#/components/schemas/Money"
        balance:
          oneOf:
            - $ref: "#/components/schemas/SignedMoney"
            - type: "null"
        balance_less_still_due:
          oneOf:
            - $ref: "#/components/schemas/SignedMoney"
            - type: "null"
        balance_account_count:
          type: integer
          description: Accounts whose balance is counted in balance (included currencies only).
        stale_balance_account_count:
          type: integer
          description: Of those accounts, how many have data that is not fresh. Stale balances are counted and flagged.
        included:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, rate, age_seconds, from_cache, refresh_failed]
            properties:
              currency:
                $ref: "#/components/schemas/Currency"
              rate:
                description: Null for the reporting currency itself.
                oneOf:
                  - $ref: "#/components/schemas/ExchangeRate"
                  - type: "null"
              age_seconds:
                type: [integer, "null"]
                description: Seconds since Ledger last retrieved the rate.
              from_cache:
                type: boolean
              refresh_failed:
                type: boolean
                description: A refresh was due and failed; the cached rate is still within the freshness policy.
        excluded:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, status, reason, rate]
            properties:
              currency:
                $ref: "#/components/schemas/Currency"
              status:
                type: string
                enum: [stale, missing]
              reason:
                type: string
                description: not_retrieved_recently, rate_date_too_old, unconfirmed, not_cached, not_published, no_provider, conversion_failed or conversion_timed_out.
              rate:
                description: The rate found too old, for a stale conversion; null otherwise.
                oneOf:
                  - $ref: "#/components/schemas/ExchangeRate"
                  - type: "null"
    ExchangeRate:
      type: object
      description: A cached exchange rate with its provenance (ADR-0022). 1 base = value quote.
      additionalProperties: false
      required: [provider, source, base, quote, value, date, retrieved_at, confirmed_through]
      properties:
        provider:
          type: string
        source:
          type: string
        base:
          $ref: "#/components/schemas/Currency"
        quote:
          $ref: "#/components/schemas/Currency"
        value:
          $ref: "#/components/schemas/PositiveDecimal"
        date:
          $ref: "#/components/schemas/Date"
        retrieved_at:
          type: string
          format: date-time
        confirmed_through:
          $ref: "#/components/schemas/Date"
    PaymentStatus:
      type: string
      enum: [paid, partially_paid, upcoming, due, overdue, not_recorded, cancelled]
      description: |
        Derived payment status (decision D7). paid: payment evidence in the
        occurrence's currency covers its amount, or an applied "paid"
        override. partially_paid: some, not all. Otherwise by date in the
        reporting zone: upcoming before the due date, due on it, overdue from
        the day after it. Overdue always counts from the original due date.
        cancelled: the occurrence was cancelled (cancelled_at is set, D31); it
        is not an obligation and is never upcoming, due or overdue.
        not_recorded: unpaid and due before its commitment was created (D38 1a,
        ADR-0042); not overdue, left out of the overdue and outstanding
        totals, still listed and can be marked paid. paid also covers an
        occurrence whose confirmed bank payment falls short of the amount by no
        more than the commitment's match_tolerance (D39 5a); see shortfall_amount.
    OverrideStatus:
      type: string
      enum: [paid, unpaid]
    PaymentState:
      type: object
      description: |
        Derived when read from payment evidence (manual payments; confirmed
        bank-transaction allocations from task X1), dates and the manual
        override (ADR-0031). Only evidence in the occurrence's currency is
        counted; other currencies are listed in unconverted_currencies and
        never converted or summed.
      required: [status, derived_status, timing, paid_amount, outstanding_amount, overpaid_amount, shortfall_amount, unconverted_currencies, evidence_count, manual_evidence_count, bank_evidence_count, grace_until, within_grace, leeway, override]
      properties:
        status:
          $ref: "#/components/schemas/PaymentStatus"
        derived_status:
          description: The status from evidence and dates alone, before the override.
          allOf:
            - $ref: "#/components/schemas/PaymentStatus"
        timing:
          description: upcoming, due, overdue or not_recorded (due before the commitment was created) for an occurrence that is not paid (for partially_paid, its unpaid remainder); null when paid or cancelled.
          type: [string, "null"]
          enum: [upcoming, due, overdue, not_recorded, null]
        paid_amount:
          description: The sum of the evidence in the occurrence's currency (zero when none).
          $ref: "#/components/schemas/Money"
        outstanding_amount:
          description: >-
            The amount less paid_amount, never below zero; zero when paid. Under an
            applied "unpaid" override it is the full amount (the evidence is declared
            not to settle the occurrence), so it is never zero while the status is not paid.
            Always zero for a cancelled occurrence, which has no live evidence; paid_amount and
            evidence_count count live evidence only (deleted payments are not counted), so both are zero too.
          $ref: "#/components/schemas/Money"
        overpaid_amount:
          description: paid_amount less the amount when positive, else zero. Informational; it does not change the status.
          $ref: "#/components/schemas/Money"
        shortfall_amount:
          description: How far a confirmed bank payment fell short of the amount when that is within the commitment's match_tolerance (D39 5a); the status is then paid and outstanding_amount zero. Zero otherwise.
          $ref: "#/components/schemas/Money"
        unconverted_currencies:
          type: array
          description: Currencies of evidence not in the occurrence's currency; not counted.
          items:
            type: string
            pattern: "^[A-Z]{3}$"
        evidence_count:
          type: integer
          minimum: 0
        manual_evidence_count:
          description: Pieces of evidence that are manual payment records; with bank_evidence_count it adds up to evidence_count.
          type: integer
          minimum: 0
        bank_evidence_count:
          description: Pieces of evidence that are confirmed matches of bank transactions.
          type: integer
          minimum: 0
        grace_until:
          description: |
            End of the grace period the user recorded for the commitment of an
            overdue occurrence (task DF2, ADR-0052), when it is a period or a
            deadline that covers the occurrence. Null for unknown, none or
            nothing recorded. The occurrence is overdue either way.
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        within_grace:
          type: boolean
          description: True while an overdue occurrence is within its recorded grace period.
        leeway:
          description: |
            What is known about the grace of an overdue occurrence: not_recorded
            (the user entered nothing), unknown (the user states they do not
            know), none (the user states there is none), period or deadline.
            Null when the occurrence is not overdue. unknown and not_recorded
            are not "no grace".
          oneOf:
            - type: string
              enum: [not_recorded, unknown, none, period, deadline]
            - type: "null"
        override:
          oneOf:
            - type: "null"
            - type: object
              required: [status, reason, set_at, applied, previous_status]
              properties:
                status:
                  $ref: "#/components/schemas/OverrideStatus"
                reason:
                  type: string
                set_at:
                  type: string
                  format: date-time
                applied:
                  type: boolean
                  description: False for a "paid" override whose evidence has since been removed; it then has no effect.
                previous_status:
                  description: The override this one replaced, which an undo restores; null for none.
                  oneOf:
                    - $ref: "#/components/schemas/OverrideStatus"
                    - type: "null"
    ManualPayment:
      type: object
      description: A payment recorded by hand for one occurrence (ADR-0031). User data, never a bank fact.
      required: [id, occurrence_id, amount, paid_on, note, version, created_at, updated_at, replaced_by_match_id]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurrence_id:
          $ref: "#/components/schemas/ID"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        paid_on:
          $ref: "#/components/schemas/Date"
        note:
          type: [string, "null"]
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        replaced_by_match_id:
          description: |
            The confirmed payment match that replaces this record now (the
            person confirmed the bank payment "as the payment I recorded",
            ADR-0049): the record is kept and listed but does not count as
            payment evidence; the match does. While that match's transaction
            does not count (the provider no longer reports it, or it was
            superseded; the match needs review) the record counts again, so
            exactly one of the two counts. Replacing and restoring the record
            increase its version. Null when none.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
    ManualPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, paid_on]
      properties:
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        paid_on:
          $ref: "#/components/schemas/Date"
        note:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
    MatchOrigin:
      type: string
      enum: [auto_rule, model_suggestion, user]
      description: |
        Who proposed the match: the matching engine's rules (task X2), an
        optional model (suggestions only, never confirmed by its origin), or
        the user.
    MatchState:
      type: string
      enum: [suggested, confirmed, rejected, reversed]
      description: |
        suggested awaits a decision and is never payment evidence. confirmed
        is payment evidence while its transaction is countable. rejected (a
        rejected suggestion or an undone match) and reversed (the payment was
        reversed) are final.
    MatchReason:
      type: [string, "null"]
      minLength: 1
      maxLength: 500
      description: Optional reason for the change, kept with the match and its history (not in the audit log).
    MatchActor:
      type: object
      required: [kind, user_id, via]
      properties:
        kind:
          type: string
          enum: [user, token, system]
        user_id:
          type: [string, "null"]
        via:
          description: |
            How the change came (decision D42 3a): session (a signed-in
            browser), token (an API token calling the API directly), mcp (an
            API token through the MCP server) or system (the server itself, the
            matching engine, a host command). Null for changes recorded before
            provenance was. A token acts as its owner, so a token or MCP change
            is still that person's.
          type: [string, "null"]
          enum: [session, token, mcp, system, null]
    MerchantSource:
      type: object
      additionalProperties: false
      required: [name, kind, enabled, description, sends_off_machine, attribution, stores_logo_ref, retention_hours]
      description: One merchant-identification source (task E2, ADR-0054).
      properties:
        name:
          type: string
          description: The token stored as enrichment.source for this source's answers (curated, local_mapping, remote).
        kind:
          type: string
          enum: [local, remote]
        enabled:
          type: boolean
        description:
          type: string
        sends_off_machine:
          type: array
          description: What leaves the machine for one lookup; empty for a local source.
          items:
            type: string
        attribution:
          type: [string, "null"]
          description: Text the source's licence requires next to identities it provided, or null.
        stores_logo_ref:
          type: boolean
          description: Whether the logo references the source returns are kept. Ledger never downloads or copies a logo.
        retention_hours:
          type: [integer, "null"]
          description: How long the source's answers are kept; null means until replaced. A person's decisions are never deleted.
    MerchantRecord:
      type: object
      description: |
        A merchant record (task M1, ADR-0058): a stable id, the name to show and the alias names a
        transaction's merchant name resolves to it by. Decisions and organisation assignments refer to
        the id.
      required: [id, display_name, aliases, archived, archived_at, merged_into, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        display_name:
          type: string
        aliases:
          type: array
          description: Sorted by key.
          items:
            $ref: "#/components/schemas/MerchantAlias"
        archived:
          type: boolean
        archived_at:
          type: [string, "null"]
          format: date-time
        merged_into:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
          description: The merchant this one was merged into; null unless merged.
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MerchantAlias:
      type: object
      required: [id, name, key, origin, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
          description: The spelling as given.
        key:
          type: string
          description: The name as matched (Unicode NFC, white space collapsed, lower case); unique across merchants.
        origin:
          type: string
          enum: [user, decision, upgrade]
          description: user (added through this API), decision (a confirmation or correction named it) or upgrade (made from earlier data by migration 0030).
        created_at:
          type: string
          format: date-time
    Merchant:
      type: object
      description: |
        The merchant of a bank transaction (task E1, ADR-0051). name, logo_ref
        and identity_source are null when no identity may be shown (fallback is
        then true). enrichment (the source's answer) and review (the person's
        decision) are the two records it is resolved from; neither contains an
        amount or a payment status.
      required: [transaction_id, state, merchant_id, name, logo_ref, identity_source, fallback, needs_review, confirmation_outdated, review_inherited, enrichment, review]
      properties:
        transaction_id:
          $ref: "#/components/schemas/ID"
        merchant_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
          description: |
            The merchant record of the identity shown (ADR-0058); name is then its display name. Null when
            nothing is shown, or the shown name is a source's name no alias knows.
        state:
          type: string
          enum: [confirmed, corrected, rejected, reliable, uncertain, ambiguous, none, unavailable, not_looked_up]
          description: |
            confirmed, corrected and rejected are the person's decisions;
            reliable is an unreviewed identity at or above the threshold;
            uncertain is identified below it (not shown); ambiguous has several
            candidates (not shown); none means the source found nothing;
            unavailable means the lookup failed and nothing earlier is known;
            not_looked_up means no lookup was recorded.
        name:
          type: [string, "null"]
        logo_ref:
          type: [string, "null"]
          description: An opaque logo reference of the source; null for a corrected name (the logo belongs to the source's own name).
        identity_source:
          type: [string, "null"]
          description: user for a confirmed or corrected name, otherwise the lookup source.
        fallback:
          type: boolean
          description: True when no identity may be shown and the client uses its neutral presentation.
        needs_review:
          type: boolean
          description: True when a decision would settle something the data leaves open (uncertain, ambiguous or an outdated confirmation).
        confirmation_outdated:
          type: boolean
          description: True when the person confirmed a name the source no longer reports; the confirmation is not applied.
        review_inherited:
          type: boolean
          description: |
            True when review is the decision made about the pending
            transaction this one superseded (its booking arrived under a new
            key). A new decision on this transaction replaces it; the
            inherited one is not removed from here (409 review_inherited):
            clear it on the transaction named by review.transaction_id.
        enrichment:
          oneOf:
            - $ref: "#/components/schemas/MerchantEnrichment"
            - type: "null"
        review:
          oneOf:
            - $ref: "#/components/schemas/MerchantReview"
            - type: "null"
    MerchantEnrichment:
      type: object
      description: What a lookup source said, as stored. A decision never edits it; a failed lookup never replaces an earlier answer (last_failed_at records it).
      required: [status, name, logo_ref, source, confidence_permille, candidates, retrieved_at, last_failed_at, merchant_id]
      properties:
        merchant_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
          description: The merchant record the identified name resolves to through an alias (ADR-0058); source and confidence_permille stay the answer's provenance.
        status:
          type: string
          enum: [identified, ambiguous, none, unavailable]
        name:
          type: [string, "null"]
        logo_ref:
          type: [string, "null"]
        source:
          type: string
        confidence_permille:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000
          description: The source's certainty in permille (an exact integer); null unless identified.
        candidates:
          type: array
          items:
            type: string
          description: The names an ambiguous answer chose between, sorted.
        retrieved_at:
          type: [string, "null"]
          format: date-time
          description: When the source answered; null when it never did (status unavailable).
        last_failed_at:
          type: [string, "null"]
          format: date-time
    MerchantReview:
      type: object
      description: The person's decision about the merchant. For confirmed, name is the enrichment name that was confirmed.
      required: [transaction_id, decision, name, merchant_id, by, decided_at, version]
      properties:
        merchant_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
          description: The merchant record the decision attaches to (ADR-0058); null for a rejection.
        transaction_id:
          $ref: "#/components/schemas/ID"
          description: The transaction the decision was made about; the superseded pending transaction when the merchant's review_inherited is true.
        decision:
          type: string
          enum: [confirmed, corrected, rejected]
        name:
          type: [string, "null"]
        by:
          $ref: "#/components/schemas/MatchActor"
        decided_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
          description: Counts the decisions made about this transaction.
    PaymentMatch:
      type: object
      description: |
        A link between a bank transaction and an occurrence with the amount
        of the transaction allocated to it (ADR-0035). The bank fact
        (transaction, source "bank"), who proposed the match (origin), the
        decision (state, decided_by, decided_at) and whether it is payment
        evidence now (counts_as_evidence) are separate fields.
      required: [id, occurrence_id, transaction_id, amount, origin, state, counts_as_evidence, needs_review, bank_text_redacted, created_by, decided_by, decided_at, reason, transaction, history, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        occurrence_id:
          $ref: "#/components/schemas/ID"
        transaction_id:
          $ref: "#/components/schemas/ID"
        amount:
          description: The allocated amount, in the currency of both the transaction and the occurrence.
          $ref: "#/components/schemas/PositiveMoney"
        origin:
          $ref: "#/components/schemas/MatchOrigin"
        state:
          $ref: "#/components/schemas/MatchState"
        counts_as_evidence:
          type: boolean
          description: True when confirmed and the transaction is booked, still reported and not superseded.
        needs_review:
          type: boolean
          description: |
            True for a suggested or confirmed match whose transaction can no
            longer back it: the provider stopped reporting it (a pending
            transaction too), it was superseded, or it is neither booked nor
            a still-reported pending one. Such a match stays listed and is
            never deleted.
        bank_text_redacted:
          type: boolean
          description: |
            True when the caller lacks the banking:read grant, so
            transaction.description and transaction.counterparty are null.
            Everything else about the match stays visible under
            commitments:read.
        occurrence_version:
          type: integer
          format: int64
          description: |
            The occurrence's new version. Present on the responses of create
            and of the confirm, reject, unmatch, correct, reverse, unconfirm and confirm-replacing actions;
            absent on reads.
        created_by:
          $ref: "#/components/schemas/MatchActor"
        decided_by:
          description: Who made the latest decision; null while suggested.
          oneOf:
            - $ref: "#/components/schemas/MatchActor"
            - type: "null"
        decided_at:
          type: [string, "null"]
          format: date-time
        reason:
          description: The reason given with the latest change, if any.
          type: [string, "null"]
        transaction:
          $ref: "#/components/schemas/MatchedBankTransaction"
        history:
          type: array
          description: Every change, oldest first, with the state and amount after it.
          items:
            type: object
            required: [action, state, amount, by, reason, at]
            properties:
              action:
                type: string
                enum: [suggested, confirmed, rejected, unmatched, corrected, reversed, unconfirmed]
              state:
                $ref: "#/components/schemas/MatchState"
              amount:
                $ref: "#/components/schemas/PositiveMoney"
              by:
                $ref: "#/components/schemas/MatchActor"
              reason:
                type: [string, "null"]
              at:
                type: string
                format: date-time
              replaced_manual_payment_ids:
                type: array
                items:
                  $ref: "#/components/schemas/ID"
                description: Manual payments this confirmation marked replaced by the match (ADR-0049). Omitted when none.
              restored_manual_payment_ids:
                type: array
                items:
                  $ref: "#/components/schemas/ID"
                description: Manual payments this unconfirm or unmatch made count again (ADR-0049). Omitted when none.
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MatchedBankTransaction:
      type: object
      description: The bank fact a match refers to, as the provider reported it (ADR-0013). Never written by Ledger.
      required: [source, id, account_id, provider, booking_status, amount, date, booking_date, value_date, description, counterparty, no_longer_reported_at, superseded_by, countable]
      properties:
        source:
          type: string
          enum: [bank]
        id:
          $ref: "#/components/schemas/ID"
        account_id:
          $ref: "#/components/schemas/ID"
        provider:
          type: string
        booking_status:
          type: string
          enum: [booked, pending, cancelled, other]
        amount:
          description: The signed source amount; a payment is negative.
          $ref: "#/components/schemas/Money"
        date:
          description: The booking date, else the value date, else the transaction date.
          $ref: "#/components/schemas/Date"
        booking_date:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        value_date:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        description:
          description: |
            The bank's raw description. Bank text: null (redacted, not
            omitted) unless the caller holds banking:read.
          type: [string, "null"]
        counterparty:
          description: |
            The counterparty name the bank reported. Bank text: null
            (redacted, not omitted) unless the caller holds banking:read.
          type: [string, "null"]
        no_longer_reported_at:
          description: When the provider stopped reporting it (never deleted, decision D8); null while reported.
          type: [string, "null"]
          format: date-time
        superseded_by:
          description: The booked transaction a pending one became, when known.
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        countable:
          type: boolean
          description: Booked, still reported and not superseded.
    Role:
      type: string
      enum: [administrator, read-only]
      description: A user's role. administrator holds every grant; read-only holds read on non-administrative resources only.
    Grant:
      type: string
      description: A grant, "resource:action". See GET /grants.
      pattern: "^[a-z][a-z0-9_]*:[a-z]+$"
      examples: ["users:read"]
    Username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9][a-z0-9._-]*$"
    User:
      type: object
      required: [id, username, display_name, role, disabled, disabled_at, version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        disabled_at:
          type: [string, "null"]
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditActorKind:
      type: string
      enum: [user, token, system, anonymous]
      description: user is a signed-in user; token an API token (its owner is actor_user_id); system the server or a host command; anonymous nobody who could be identified.
    AuditEntry:
      type: object
      required: [id, action, actor_kind, actor_user_id, actor_token_id, target_type, target_id, at, details]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        action:
          type: string
          examples: ["user.role_changed"]
        actor_kind:
          $ref: "#/components/schemas/AuditActorKind"
        actor_user_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        actor_token_id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        target_type:
          type: [string, "null"]
        target_id:
          type: [string, "null"]
        at:
          type: string
          format: date-time
        details:
          type: object
          description: Only the fields the action declares, as short text. Never a request body, a secret or a bank payload.
          additionalProperties:
            type: string
            maxLength: 256
    SettingsGroupName:
      type: string
      enum: [reporting, banking, rates, merchant_enrichment, auth, oidc, pulse, mcp, logging, alerts]
    SettingsApplyState:
      type: object
      required: [state]
      description: |
        Whether the group's values are in force: applied; failed (a component could not rebuild after the last write, the setting stays committed; code is a stable error code, never a value); restart_required (stored and valid, but no component applies the group live yet, so it takes effect at the next start).
      properties:
        state:
          type: string
          enum: [applied, failed, restart_required]
        code:
          type: string
        at:
          type: string
          format: date-time
    SettingsGroupSummary:
      type: object
      required: [group, grant, version, updated_at, pinned, apply_state]
      properties:
        group:
          $ref: "#/components/schemas/SettingsGroupName"
        grant:
          type: string
          enum: [settings, integrations]
          description: The resource whose grant the group needs.
        version:
          $ref: "#/components/schemas/Version"
        updated_at:
          type: [string, "null"]
          format: date-time
        pinned:
          type: boolean
          description: Whether any member is set by a configuration layer.
        apply_state:
          $ref: "#/components/schemas/SettingsApplyState"
    SettingsGroupMeta:
      type: object
      required: [version, updated_at, sources, pinned, apply_state]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When the group was last written; null while it has no stored row.
        sources:
          type: object
          description: For every member except secrets, where its effective value comes from.
          additionalProperties:
            type: string
            enum: [default, api, captured, yaml, environment, dotenv, flag, file]
        pinned:
          type: array
          description: The members a configuration layer sets; writes to them are 409 setting_pinned.
